<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>곤상플랜</title>
<link rel="icon" href="assets/brand/gonsang-plan-icon.png" type="image/png">
<style>
  :root{
    --bg:#fff; --ink:#222; --sub:#717171; --line:#ddd; --soft:#f7f7f7; --soft2:#ebebeb;
    --pink:#1d735a; --pink2:#155a46; --teal:#1d735a; --teal-d:#1d735a; --teal-soft:#e4f3ed; --lime:#d9f17c;
    --gray:#f0f1f0; --gray-d:#dfe2e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input{font:inherit}

  /* ===== 상단: Airbnb 스타일 ===== */
  .top{background:#fff;border-bottom:1px solid var(--line);padding:20px 16px 28px;position:relative}
  .top-head{max-width:1100px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:inline-flex;align-items:center;flex-shrink:0}
  .brand-logo{display:block;width:210px;height:70px;object-fit:contain}
  /* 대표 캐릭터: 기존 로고와 검색 사이의 작은 여행 친구 안내 */
  .top .mascot-brand{gap:24px}
  .top .travel-companion{display:flex;align-items:center;gap:16px;min-width:0;max-width:690px;padding:4px 20px 4px 12px;border:1px solid #e4eee7;border-radius:22px;background:linear-gradient(115deg,#f4faf4,#fbfcf6)}
  .top .travel-companion__image{display:block;flex:none;width:116px;height:116px;object-fit:contain}
  .top .travel-companion__copy{min-width:0}
  .top .travel-companion__eyebrow{display:block;font-size:10px;font-weight:750;letter-spacing:.3px;color:#62806b;line-height:1.6}
  .top .travel-companion__headline{margin:5px 0;font-size:19px;line-height:1.55;font-weight:800;letter-spacing:-.6px;color:#244b37;word-break:keep-all}
  .top .travel-companion__note{margin:0;font-size:12px;line-height:1.7;color:#708174;word-break:keep-all}
  .search-wrap{max-width:860px;margin:0 auto;position:relative}
  .search{display:flex;align-items:stretch;background:var(--soft2);border:1px solid var(--line);border-radius:999px;height:68px}
  .search.active{background:var(--soft2)}
  .seg{flex:1;text-align:left;padding:0 28px;border-radius:999px;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .seg:hover{background:#dedede}
  .seg.on{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .seg+.seg{position:relative}
  .seg small{font-size:12px;font-weight:700}
  .seg span{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg span.filled{color:var(--ink)}
  .go{display:flex;align-items:center;gap:6px;background:var(--pink);color:#fff;font-weight:700;border-radius:999px;margin:8px;padding:0 22px}
  .go:hover{background:var(--pink2)}
  .panel{position:absolute;top:78px;background:#fff;border-radius:32px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:24px;z-index:20;display:none}
  .panel.open{display:block}
  #p-dest{left:0;width:400px;max-height:420px;overflow:auto}
  #p-date{left:50%;transform:translateX(-50%);width:min(820px,94vw)}
  #p-guest{right:0;width:380px}
  .panel h4{margin:0 0 10px;font-size:12px;font-weight:600}
  .dest{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:12px}
  .dest:hover{background:var(--soft)}
  .dest i{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:24px;background:#fdecec}
  .dest b{display:block;font-size:15px}
  .dest em{font-style:normal;font-size:13px;color:var(--sub)}
  .dest-input{width:100%;border:0;outline:0;background:transparent;font-size:14px;padding:0}
  .dest-row{display:flex;align-items:center;gap:6px}
  .dest-x{width:22px;height:22px;flex:none;border-radius:50%;background:#d8d8d8;color:#fff;font-size:11px;display:grid;place-items:center;cursor:pointer}
  .dest-x:hover{background:var(--teal-d)}
  .dest-x[hidden]{display:none}

  /* 달력 */
  .cal-wrap{display:flex;gap:40px;justify-content:center;position:relative}
  .cal{flex:1;min-width:0}
  .cal h5{text-align:center;margin:6px 0 14px;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
  .grid .dow{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
  .day{aspect-ratio:1;border-radius:50%;font-size:14px;font-weight:600;display:grid;place-items:center}
  .day:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--ink)}
  .day:disabled{color:#c8c8c8;cursor:default;font-weight:400;text-decoration:line-through}
  .day.in{background:var(--soft2);border-radius:0}
  .day.edge{background:var(--ink);color:#fff}
  .nav{position:absolute;top:0;width:32px;height:32px;border-radius:50%;font-size:18px}
  .nav:hover{background:var(--soft2)}
  .nav.l{left:0}.nav.r{right:0}
  .nav:disabled{opacity:.25;cursor:default}
  .cal-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
  .link{text-decoration:underline;font-weight:600;color:var(--ink)}

  /* 게스트 */
  .row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--soft2)}
  .row:last-child{border-bottom:0}
  .row b{display:block;font-size:16px}
  .row em{font-style:normal;color:var(--sub);font-size:14px}
  .step{display:flex;align-items:center;gap:14px}
  .step button{width:32px;height:32px;border-radius:50%;border:1px solid #b0b0b0;font-size:18px;line-height:1}
  .step button:hover:not(:disabled){border-color:var(--ink)}
  .step button:disabled{opacity:.3;cursor:default}
  .step span{width:20px;text-align:center}

  /* ===== 하단: 트리플 스타일 ===== */
  /* 하단 영역: 탭 바는 화면 끝에서 끝까지, 본문(조회 결과)은 넓게 + 오른쪽 예산 */
  .plan{margin:0 0 80px;padding:0;display:grid;grid-template-columns:minmax(16px,1fr) minmax(0,1060px) 340px minmax(16px,1fr);align-items:start}
  .main-col{display:contents}
  .tabs{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);background:#0f4435;margin-bottom:24px;padding-top:6px}
  .tab{padding:18px 0 16px;background:none;border:0;border-bottom:4px solid transparent;border-radius:14px 14px 0 0;color:rgba(255,255,255,.6);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px}
  .tab i{font-style:normal;font-size:22px}
  .tab:hover{color:#fff;background:rgba(255,255,255,.1)}
  /* 선택된 탭: 흰 탭이 바 위로 올라와 아래 본문과 이어져 보인다 / 선택 안 된 탭: 어두운 바 배경 */
  .tab.on{color:var(--teal-d);background:#fff;border-bottom-color:var(--teal-d)}
  .tab.on:hover{background:#fff}
  .panes{grid-column:2;border:1px solid var(--line);border-radius:20px;background:#fff}
  .aside{grid-column:3;margin-left:24px;position:sticky;top:16px;background:var(--gray);border-radius:20px;padding:24px 22px 26px}
  .pane{display:none;padding:22px 24px 28px}
  .pane.on{display:block}
  .pane h3{margin:0 0 16px;font-size:17px}
  .field{margin-bottom:20px}
  .field>label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;background:#fff}
  .opt:hover{border-color:var(--teal-d)}
  .opt.on{background:var(--teal-soft);border-color:var(--teal-d);color:var(--teal-d)}
  .text{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px}
  .text:focus{outline:2px solid var(--teal);border-color:transparent}
  .range{width:100%;accent-color:var(--teal-d)}
  .range-val{font-weight:700;margin-left:6px;color:var(--ink)}
  .ftabs{display:flex;gap:6px;margin-bottom:14px}
  .ftab{padding:10px 20px;border-radius:999px;font-weight:700;color:#9db8af}
  .ftab.on{background:var(--teal-soft);color:var(--teal-d)}
  .fcard{position:relative;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:6px 0}
  .frow{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-right:70px;border-bottom:1px solid var(--soft2);cursor:pointer;font-weight:700;font-size:17px}
  .frow:last-child{border-bottom:0;margin-right:0}
  .frow:hover{background:var(--soft)}
  .frow i{font-style:normal;color:#aaa;width:22px;text-align:center}
  .frow .ph{color:#b5b5b5;font-weight:600}
  #fr-date,#fr-pax{margin-right:0}
  .swap{position:absolute;right:18px;top:50px;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#999;font-size:20px}
  .swap:hover{border-color:var(--teal-d);color:var(--teal-d)}
  .fgo{width:100%;margin-top:16px;padding:18px;border-radius:14px;background:var(--teal-d);color:#fff;font-weight:800;font-size:17px}
  .fgo:disabled{background:#bdbdbd;cursor:default}
  .fhint{margin:10px 2px 0;font-size:12px;color:var(--sub)}
  .conts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .cont{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700}
  .cont.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
  .grp{margin:10px 0 4px;font-size:12px;font-weight:800;color:var(--teal-d)}
  .summary{padding-top:6px}
  .summary h3{margin:0 0 10px;font-size:15px}
  .summary dl{margin:0;display:grid;grid-template-columns:52px 1fr;gap:6px 10px;font-size:13px}
  .summary dt{color:var(--sub)}
  .summary dd{margin:0;font-weight:600;word-break:keep-all}
  .save{display:block;width:100%;margin-top:18px;padding:15px;border-radius:14px;background:var(--teal-d);color:#fff;font-weight:700;font-size:16px}
  .save:hover{background:var(--pink2)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1}

  /* FLIGHT DEMO STYLE START — scoped to the air tab; no budget selectors. */
  #flight-demo-root{container-type:inline-size;container-name:flight-demo;margin-top:24px;color:#132d3d;scroll-margin-top:18px}
  #flight-demo-root [hidden]{display:none!important}
  #flight-demo-root button,#flight-demo-root select,#flight-demo-root input{font:inherit}
  #flight-demo-root button:focus-visible,#flight-demo-root a:focus-visible,#flight-demo-root input:focus-visible,#flight-demo-root select:focus-visible{outline:3px solid #73b7a3;outline-offset:3px}
  #flight-demo-root .fd-intro{border:1px dashed #adc8bd;border-radius:16px;padding:26px;background:#f5faf7;text-align:center}
  #flight-demo-root .fd-intro h3{margin:12px 0;font-size:21px}
  #flight-demo-root .fd-intro p{font-size:13px;color:#63766e;line-height:1.7}
  #flight-demo-root .fd-chip{display:inline-block;padding:5px 9px;border-radius:6px;background:#e2f2eb;color:#21604b;font-size:10px;font-weight:800;letter-spacing:.07em}
  #flight-demo-root .fd-btn{border:0;border-radius:9px;padding:11px 15px;background:#123d32;color:white;font-size:13px;font-weight:750;cursor:pointer}
  #flight-demo-root .fd-btn.fd-light{background:#e8f2ed;color:#1d735a}
  #flight-demo-root .fd-link{font-size:12px;color:#256a55;text-decoration:underline;cursor:pointer;padding:4px 0}
  #flight-demo-root .fd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  #flight-demo-root .fd-head h3{font-size:22px;margin:9px 0 5px;letter-spacing:-.7px}
  #flight-demo-root .fd-sub{font-size:12px;line-height:1.7;color:#65776f;margin:0}
  #flight-demo-root .fd-note{padding:10px 12px;border-radius:9px;background:#f1f5f2;font-size:11px;line-height:1.6;color:#65776f;margin:12px 0}
  #flight-demo-root .fd-stale{padding:12px;background:#fff4da;border-radius:9px;color:#7c581b;font-size:12px;margin-bottom:12px}
  #flight-demo-root .fd-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:14px 0}
  #flight-demo-root .fd-toolbar strong{font-size:13px}
  #flight-demo-root .fd-tools{display:flex;gap:12px}
  #flight-demo-root .fd-layout{display:grid;grid-template-columns:145px minmax(0,1fr);gap:14px;align-items:start}
  #flight-demo-root .fd-filters{padding:13px 12px;background:#f3f6f4;border-radius:12px}
  #flight-demo-root .fd-filters h4{font-size:13px;margin:0 0 12px}
  #flight-demo-root .fd-filter-group{margin:0;padding:14px 0;border:0;border-top:1px solid #dae3de;min-width:0}
  #flight-demo-root .fd-filter-group legend{font-size:12px;font-weight:800;padding-top:14px;margin-bottom:8px}
  #flight-demo-root .fd-check{display:flex;align-items:center;gap:6px;font-size:11px;margin:8px 0;line-height:1.5;cursor:pointer}
  #flight-demo-root .fd-check input{accent-color:#1d735a;flex:none;width:15px;height:15px;margin:0}
  #flight-demo-root .fd-check small{display:block;color:#7c8e85;font-size:10px}
  #flight-demo-root .fd-time-label{display:block;font-size:10px;line-height:1.7;color:#60766b;margin-bottom:6px}
  #flight-demo-root input[type=range]{width:100%;accent-color:#1d735a;display:block;margin:6px 0 9px}
  #flight-demo-root .fd-range-name{display:flex;justify-content:space-between;font-size:10px;color:#60766b}
  #flight-demo-root .fd-sort{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid #dae3de;border-radius:12px;overflow:hidden;margin-bottom:12px}
  #flight-demo-root .fd-sort button{padding:12px 8px;text-align:left;background:#fff;border-right:1px solid #dae3de;min-width:0}
  #flight-demo-root .fd-sort button:last-child{border:0}
  #flight-demo-root .fd-sort button[aria-pressed=true]{background:#113f34;color:white}
  #flight-demo-root .fd-sort span{display:block;font-size:11px;font-weight:700}
  #flight-demo-root .fd-sort b{display:block;font-size:16px;margin-top:5px;letter-spacing:-.5px}
  #flight-demo-root .fd-sort small{display:block;font-size:10px;opacity:.7;margin-top:3px}
  #flight-demo-root .fd-list{display:grid;gap:12px}
  #flight-demo-root .fd-card{border:1px solid #dce5df;border-radius:14px;background:white;box-shadow:0 3px 9px #152c1f07;overflow:hidden}
  #flight-demo-root .fd-card.fd-selected{border:2px solid #1d735a}
  #flight-demo-root .fd-card-top{padding:13px 14px 5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  #flight-demo-root .fd-airline{font-size:12px;font-weight:800;display:flex;align-items:center;gap:8px}
  #flight-demo-root .fd-logo{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#e3edf7;color:#2f587e;font-size:11px}
  #flight-demo-root .fd-heart{font-size:24px;line-height:1;padding:2px;color:#7d9289}
  #flight-demo-root .fd-heart[aria-pressed=true]{color:#d46a6a}
  #flight-demo-root .fd-tag{font-size:9px;border-radius:5px;padding:4px 6px;background:#e9f6ea;color:#397444;margin-left:5px}
  #flight-demo-root .fd-leg{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;align-items:center;padding:10px 15px}
  #flight-demo-root .fd-leg-time strong{font-size:21px;font-weight:600;letter-spacing:-.7px}
  #flight-demo-root .fd-leg-time small{display:block;font-size:11px;margin-top:3px;color:#71847a}
  #flight-demo-root .fd-leg-time:last-child{text-align:right}
  #flight-demo-root .fd-leg-time sup{font-size:10px;color:#1d735a;letter-spacing:0;margin-left:3px}
  #flight-demo-root .fd-flight-path{text-align:center;font-size:10px;color:#65776f}
  #flight-demo-root .fd-flight-path i{display:block;position:relative;border-top:1px solid #c8d3cd;margin:8px 0;font-style:normal}
  #flight-demo-root .fd-flight-path i:after{content:'✈';position:absolute;right:-2px;top:-10px;font-size:14px;color:#6e8b7e;background:#fff}
  #flight-demo-root .fd-flight-path em{font-style:normal;color:#2e7c66}
  #flight-demo-root .fd-leg-label{font-size:9px;color:#7c8e85;padding:3px 15px 0}
  #flight-demo-root .fd-price{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:#f5f8f6;border-top:1px solid #e5ebe7;margin-top:7px}
  #flight-demo-root .fd-price small{display:block;color:#75887e;font-size:10px;line-height:1.6}
  #flight-demo-root .fd-price strong{display:block;font-size:24px;letter-spacing:-.8px}
  #flight-demo-root .fd-price .fd-btn{white-space:nowrap}
  #flight-demo-root .fd-details{padding:9px 14px;font-size:11px;color:#65776f;line-height:1.8;border-top:1px solid #e5ebe7}
  #flight-demo-root .fd-details summary{cursor:pointer}
  #flight-demo-root .fd-selection{padding:13px;border-radius:10px;background:#e6f3eb;color:#1d6048;font-size:12px;line-height:1.8;margin:12px 0}
  #flight-demo-root .fd-selection strong{display:block}
  #flight-demo-root .fd-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}
  #flight-demo-root .fd-date{border:1px solid #dce5df;border-radius:8px;padding:10px 2px;text-align:center;background:#fff}
  #flight-demo-root .fd-date span{display:block;font-size:10px;color:#65776f}
  #flight-demo-root .fd-date b{display:block;font-size:11px;margin-top:5px}
  #flight-demo-root .fd-date[aria-pressed=true]{border-color:#1d735a;background:#e6f3eb}
  #flight-demo-root .fd-date:disabled{opacity:.35;cursor:default}
  #flight-demo-root .fd-explore{padding:14px;background:#f4f8f5;border:1px solid #dce5df;border-radius:12px;margin-bottom:14px}
  #flight-demo-root .fd-explore select{padding:7px;border:1px solid #c5d6ca;border-radius:7px;background:white;margin:8px 0 12px;font-size:12px}
  #flight-demo-root .fd-cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  #flight-demo-root .fd-city{text-align:left;padding:10px;border:1px solid #dce5df;background:#fff;border-radius:8px}
  #flight-demo-root .fd-city b{display:block;font-size:12px}
  #flight-demo-root .fd-city span{display:block;color:#2b795e;font-size:12px;margin-top:6px}
  #flight-demo-root .fd-provenance{font-size:11px;color:#6f8277;line-height:1.8;margin-top:15px}
  #flight-demo-root .fd-provenance a{color:#286b53}
  @container flight-demo (max-width:550px){
    #flight-demo-root .fd-layout{grid-template-columns:1fr}
    #flight-demo-root .fd-filters{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
    #flight-demo-root .fd-filters>h4,#flight-demo-root .fd-filters>button{grid-column:1/-1}
    #flight-demo-root .fd-sort b{font-size:15px}
    #flight-demo-root .fd-calendar{grid-template-columns:repeat(4,minmax(0,1fr))}
    #flight-demo-root .fd-cities{grid-template-columns:1fr 1fr}
  }
  /* FLIGHT DEMO STYLE END */


  /* 최종 일정 창 (trip-summary.html 을 iframe 으로 띄움) */
  .sum-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px}
  .sum-modal.open{display:flex}
  .sum-box{position:relative;width:min(1280px,100%);height:100%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .sum-box iframe{width:100%;height:100%;border:0;display:block}
  .sum-x{position:absolute;top:12px;right:14px;z-index:1;width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .sum-x:hover{border-color:var(--teal-d);color:var(--teal-d)}
  @media (max-width:760px){.sum-modal{padding:0}.sum-box{border-radius:0}}

  @media (max-width:760px){
    .brand-logo{width:174px;height:58px}

#course-root button:focus-visible,#course-root a:focus-visible{outline:3px solid #92bda3;outline-offset:2px}
@media(max-width:760px){#course-root{padding:14px}#course-root h3{font-size:18px}#course-root .course-card{padding:12px;gap:8px}#course-root .course-head{display:block}#course-root .course-mode{display:inline-block;margin-top:8px}}

    /* 내 일정 + 추천 미리보기 2열 · 사진 · 입장료 */
#course-root{container-type:inline-size;container-name:course}
#course-root .course-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start;margin-top:14px}
#course-root .course-main{min-width:0}
#course-root .course-main-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#course-root .course-main-head b{font-size:16px}
#course-root .course-main-head span{margin-left:6px;font-size:12px;color:#5c7263;font-weight:700}
#course-root .course-clear{border:1px solid #d6e0d9;background:#fff;color:#4a5f52;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800}
#course-root .course-clear:disabled{opacity:.45;cursor:default}
#course-root .course-total{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:12px 0 4px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid #dfe8e2}
#course-root .course-total span{font-size:13px;font-weight:700}
#course-root .course-total span small{font-weight:500;color:#6f7d74;margin-left:4px}
#course-root .course-total b{font-size:20px;color:#1d735a;letter-spacing:-.4px}
#course-root .course-total>small{grid-column:1/-1;font-size:11px;color:#8a6a2c}
#course-root .course-tabs button{flex:0 0 112px}
#course-root .course-tabs i{display:block;font-style:normal;font-size:10px;font-weight:600;margin-top:3px;opacity:.85;white-space:nowrap}
#course-root .course-blank{margin-top:12px;padding:26px 18px;text-align:center;border:1.5px dashed #b9cdbf;border-radius:14px;background:#fff}
#course-root .course-blank b{font-size:15px}
#course-root .course-blank p{font-size:13px;color:#5c6d62}
#course-root .course-card.course-has-photo{grid-template-columns:30px 116px minmax(0,1fr)}
#course-root .course-body{min-width:0}
#course-root .course-photo{margin:0;width:116px;min-height:88px;border-radius:10px;overflow:hidden;background:#e7efe9;position:relative;display:grid;place-items:center;font-size:28px}
#course-root .course-photo img{width:100%;height:88px;object-fit:cover;display:block}
#course-root .course-photo figcaption{padding:5px 0;font-size:9px;line-height:1.5;overflow-wrap:anywhere;color:var(--sub)}
#course-root .course-photo figcaption a{color:var(--teal-d);text-decoration:underline}
#course-root .course-noimg{background:linear-gradient(135deg,#e4f0e8,#f4efe0)}
#course-root .course-noimg figcaption{display:none}
#course-root .course-remove{margin-left:auto;border:0;background:none;color:#9a5a4a;font-size:11px;font-weight:700;padding:2px 4px}
#course-root .course-fee{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:8px;padding:8px 10px;border-radius:9px;background:#f4f8f5;font-size:11px;font-weight:700;color:#35513f}
#course-root .course-fee input{width:84px;padding:4px 6px;border:1px solid #cbd9cf;border-radius:6px;font:inherit;font-size:12px;background:#fff}
#course-root .course-fee span{font-weight:500;color:#5c6d62}
#course-root .course-fee em{flex-basis:100%;font-style:normal;font-weight:500;font-size:10px;color:#956023}
#course-root .course-side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:#fff;border:1px solid #dfe8e2;border-radius:14px;padding:14px}
#course-root .course-side-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
#course-root .course-side-head b{font-size:15px}
#course-root .course-side-head span{font-size:10px;color:#6f7d74}
#course-root .course-all{width:100%;margin:10px 0 6px;padding:11px;border:0;border-radius:10px;background:#1d735a;color:#fff;font-weight:800;font-size:13px}
#course-root .course-all:disabled{background:#cfe1d6;color:#3c6a51;cursor:default}
#course-root .course-blank .course-all{width:auto;padding:11px 18px}
#course-root .course-side-fee{font-size:12px!important;font-weight:700;color:#263c30!important;margin:4px 0 10px!important}
#course-root .course-side-fee small{font-weight:500;color:#6f7d74}
#course-root .course-rec-day{border-top:1px solid #e7eee9;padding:10px 0}
#course-root .course-rec-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
#course-root .course-rec-top b{font-size:13px}
#course-root .course-rec-top small{font-weight:500;color:#6f7d74;font-size:11px}
#course-root .course-rec-top button{border:1px solid #1d735a;background:#fff;color:#1d735a;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:800}
#course-root .course-rec-top button:disabled{border-color:#cfdcd3;color:#8aa596;cursor:default}
#course-root .course-rec-day ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
#course-root .course-rec-day li{display:grid;grid-template-columns:40px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12px;line-height:1.45}
#course-root .course-rec-thumb{margin:0;width:40px;height:40px;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-size:16px;background:#e7efe9}
#course-root .course-rec-thumb img{width:100%;height:100%;object-fit:cover;display:block}
#course-root .course-rec-thumb figcaption{display:none}
#course-root .course-rec-day li time{font-weight:800;color:#1d735a;margin-right:2px}
#course-root .course-rec-day li small{display:block;font-size:10px;color:#6f7d74}
#course-root .course-add{width:28px;height:28px;border-radius:50%;border:1px solid #1d735a;background:#fff;color:#1d735a;font-weight:900;font-size:15px;line-height:1;padding:0}
#course-root .course-add:disabled{background:#1d735a;color:#fff;cursor:default}
#course-root .course-side .course-shuffle{width:100%;margin-top:8px}
#course-root.course-old .course-side,#course-root.course-old .course-total{border-color:#e5dcc3}
@container course (max-width:720px){
  #course-root .course-layout{grid-template-columns:1fr}
  #course-root .course-side{position:static;max-height:none;order:-1}
}
@media(max-width:520px){
  #course-root .course-card.course-has-photo{grid-template-columns:28px minmax(0,1fr)}
  #course-root .course-card.course-has-photo .course-photo{grid-column:2;width:100%;height:150px}
  #course-root .course-card.course-has-photo .course-body{grid-column:2}
}

  const clock=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(Math.round(n%60)).padStart(2,'0')}`;
  const dateOK=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;
  const addDay=(s,n)=>new Date(Date.parse(s+'T12:00:00Z')+n*864e5).toISOString().slice(0,10);
  const rad=x=>x*Math.PI/180;
  function distance(a,b){const dlat=rad(b.lat-a.lat),dlng=rad(b.lng-a.lng);return 6371*2*Math.asin(Math.min(1,Math.sqrt(Math.sin(dlat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dlng/2)**2)));}
  function move(a,b){if(!a)return {minutes:0,kind:'',km:0};const km=distance(a,b),walking=km<=1.2;return {minutes:Math.max(5,Math.round((walking?km/4.5*60:km/20*60+10)/5)*5),kind:walking?'🚶 도보':'🚇 대중교통',km};}
  // NOAA fractional-year 근사식. 지형·기상·굴절 조건을 반영하지 않는 예상 일몰.
  function sunset(date,meta){
    const utc=Date.parse(date+'T00:00:00Z'),year=Number(date.slice(0,4));
    const ordinal=Math.floor((utc-Date.UTC(year,0,1))/864e5)+1,leap=new Date(Date.UTC(year,1,29)).getUTCMonth()===1;
    const g=2*Math.PI/(leap?366:365)*(ordinal-1);
    const eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
    const dec=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
    const cos=(Math.cos(rad(90.833))/(Math.cos(rad(meta.lat))*Math.cos(dec))-Math.tan(rad(meta.lat))*Math.tan(dec));
    if(cos>1||cos< -1)return null;
    const minutes=720-4*meta.lng-eq+4*Math.acos(cos)*180/Math.PI;
    const parts=new Intl.DateTimeFormat('en-GB',{timeZone:meta.tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(utc+minutes*60000));
    const p=Object.fromEntries(parts.map(p=>[p.type,p.value]));const local=Number(p.hour)*60+Number(p.minute);
    return {time:clock(local),minutes:local,arrival:local-40};
  }
  function trendPicks(city){const keys=window.TripTrend?.get()?.picks||[];return new Set(keys.filter(k=>typeof k==='string'&&k.startsWith(city+'|')).map(k=>k.slice(city.length+1)));}
  function mineOf(city){return new Set(Array.isArray(mine[city])?mine[city].filter(n=>typeof n==='string'):[]);}
  function setMine(city,names){mine[city]=[...names];save(MINE_KEY,mine);}

  // must: 반드시 넣을 장소 이름, fill: 남는 칸을 추천 장소로 채울지
  function build(meta,city,opt){
    const {mode,seed,start,actualDays,N,pace,must:mustNames,fill}=opt;
    const assigned=p=>!fill&&Number.isInteger(dayChoices[city]?.[p.name])?dayChoices[city][p.name]:null;
    const pool=meta.places.map(p=>({...p,description:[...(window.GonsangTourCatalog?.[city]||[]),...(window.GonsangTourExtras?.[city]||[])].find(x=>x.name===p.name)?.description||p.description,picked:mustNames.has(p.name)}));
    const available=pool.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng));
    const must=available.filter(p=>p.picked),rest=fill?available.filter(p=>!p.picked&&p.kind!=='기념품'):[];
    const used=new Set(),days=[],unplaced=[];
    const adjust=pace==='빡빡하게'?1:pace==='여유롭게'?-1:0;
    const priority=p=>mode==='old'?(4-p.walk)*100+p.score:p.score+(p.kind==='핫플'?5:0);
    const seeded=p=>priority(p)+(hash(seed+'|'+p.name)%1000)/1000*(seed?20:0);
    for(let d=0;d<N;d++){
      const date=addDay(start,d),single=actualDays===1,first=!single&&d===0,last=!single&&actualDays<=7&&d===N-1;
      const begin=single?600:first?900:mode==='old'?630:570,finish=single?1080:last?720:mode==='old'?1110:1260;
      const base=mode==='old'?3:5,capacity=Math.max(first||last?1:2,(first||last?Math.ceil(base/2):base)+adjust);
      const sun=sunset(date,meta),items=[],remainingMust=must.filter(p=>!used.has(p.id)&&(assigned(p)===null||assigned(p)===d));
      const counts=new Map();remainingMust.forEach(p=>counts.set(p.area,(counts.get(p.area)||0)+1));
      const startMust=[...remainingMust].sort((a,b)=>(counts.get(b.area)||0)-(counts.get(a.area)||0)||seeded(b)-seeded(a))[0];
      const firstRest=[...rest].filter(p=>!used.has(p.id)).sort((a,b)=>seeded(b)-seeded(a))[0];
      const anchor=startMust||firstRest;
      let current=begin,point=null,visits=0,walk3=0,wentOutside=false;
      const rejected=new Set();
      while(visits<capacity){
        const candidates=[...must.filter(p=>!used.has(p.id)),...rest.filter(p=>!used.has(p.id))]
          .filter(p=>(assigned(p)===null||assigned(p)===d)&&!rejected.has(p.id)&&!(mode==='old'&&p.walk===3&&walk3>=1)&&(!wentOutside||p.id===anchor?.id));
        candidates.sort((a,b)=>Number(b.picked)-Number(a.picked)
          ||Number(b.area===(point||anchor)?.area)-Number(a.area===(point||anchor)?.area)
          ||(point?distance(point,a)-distance(point,b):seeded(b)-seeded(a)));
        if(!candidates.length)break;
        const p=candidates[0],transfer=move(point,p);
        if(p.outside&&(visits>0||finish-begin<240)){rejected.add(p.id);continue;}
        let arrival=current+transfer.minutes;
        const golden=mode==='young'&&p.sunset&&sun&&sun.arrival>=begin&&sun.arrival<=finish;
        if(golden){
          if(arrival<sun.arrival-90&&candidates.some(x=>x.id!==p.id&&!x.sunset)){
            const alternate=candidates.find(x=>x.id!==p.id&&!x.sunset&&(!point||distance(point,x)<8));
            if(alternate){rejected.add(p.id);continue;}
          }
          if(arrival>sun.arrival){rejected.add(p.id);continue;}
          arrival=sun.arrival;
        }
        const stay=p.outside?Math.max(240,p.stay):p.stay;
        const needsRest=mode==='old'&&((visits+1)%2===0||p.walk===3),restMinutes=needsRest?40:0;
        if(arrival+stay+restMinutes>finish){rejected.add(p.id);continue;}
        items.push({...p,time:clock(arrival),minute:arrival,end:arrival+stay,travel:transfer,golden:!!golden});used.add(p.id);visits++;if(p.walk===3)walk3++;
        point=p;current=arrival+stay;
        if(needsRest){items.push({name:'☕ 쉬어가기 40분',kind:'휴식',time:clock(current),minute:current,end:current+40,picked:false,description:'근처에서 앉아 쉬며 다음 이동을 준비해요.'});current+=40;}
        if(fill&&mode==='young'&&visits===2&&current+30<=finish){items.push({name:'☕ 근처 카페 직접 고르기',kind:'핫플',time:clock(current),minute:current,end:current+30,picked:false,synthetic:true,description:'이 구역에서 마음에 드는 카페를 찾아 쉬어가요. 실제 매장은 직접 선택하세요.'});current+=30;}
        if(p.outside){wentOutside=true;break;}
        available.filter(x=>x.sunset&&!used.has(x.id)).forEach(x=>rejected.delete(x.id));
      }
      if(last&&(fill||items.length))items.push({name:'공항 이동',kind:'이동',time:clock(current),minute:current,end:current,picked:false,description:'공항 이동·수속 시간은 실제 항공편과 교통편에 맞춰 별도로 확보하세요.'});
      days.push({date,items,sunset:sun,area:anchor?.area||'자유일정',visits,start:begin,finish});
    }
    for(const name of mustNames){const p=pool.find(p=>p.name===name);if(!p||!used.has(p.id))unplaced.push({name,reason:!p||!Number.isFinite(p.lat)?'확인된 좌표 없음':'방문·이동·휴식 시간을 고려한 일정 한도 초과'});}
    const souvenirs=pool.filter(p=>p.kind==='기념품'&&!p.picked);
    for(const day of days){for(const gift of souvenirs){const lastStop=[...day.items].reverse().find(p=>p.area===gift.area&&!['휴식','이동'].includes(p.kind));if(lastStop)lastStop.gifts=[...(lastStop.gifts||[]),gift.name];}}
    return {days,unplaced};
  }

  function calculate(){
    const ctx=window.TripContext?.()||{},city=(ctx.dest||'').trim(),mode=window.TripTrend?.get()?.mode==='old'?'old':'young';
    if(city!==previousCity){active=0;previousCity=city;}
    const meta=Object.hasOwn(DATA.cities,city)?DATA.cities[city]:null;
    const seed=Number.isSafeInteger(seeds[city])&&seeds[city]>=0?seeds[city]:0;
    if(!meta){result={city,days:[],rec:[],mode,seed};paint();emit();return;}
    const today=new Intl.DateTimeFormat('en-CA',{timeZone:meta.tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    const dated=dateOK(ctx.start)&&dateOK(ctx.end)&&ctx.end>=ctx.start;
    const start=dateOK(ctx.start)?ctx.start:today,actualDays=dated?Math.round((Date.parse(ctx.end)-Date.parse(ctx.start))/864e5)+1:3,N=Math.min(7,actualDays);
    const pace='보통',picks=trendPicks(city),own=mineOf(city);
    const common={mode,seed,start,actualDays,N,pace};
    const rec=build(meta,city,{...common,must:picks,fill:true});
    const my=build(meta,city,{...common,must:new Set([...own,...picks]),fill:false});
    for(const d of my.days)for(const p of d.items)if(p.id){p.fromTrend=picks.has(p.name)&&!own.has(p.name);}
    const n=people(ctx);
    result={city,mode,seed,actualDays,dated,pace,days:my.days,unplaced:my.unplaced,rec:rec.days,own:[...own],picks:[...picks],
      fee:admission(city,my.days,n),recFee:admission(city,rec.days,n),currency:FEES[city]?.[0]||'',
      missing:meta.places.filter(p=>!Number.isFinite(p.lat)).map(p=>p.name)};
    active=Math.min(active,Math.max(0,my.days.length-1));
    syncBudget(result.fee.total,result.days.flatMap(d=>d.items).filter(p=>p.id).length);
    paint();emit();
  }
  function syncBudget(total,count){
    if(!Number.isFinite(total)||total<0||total>1e12)return;
    const api=window.TripBudget;if(!api)return;
    const current=api.get?.().tour;
    if(!count){
      if(lastBudget!==null&&current?.cur==='KRW'&&current.amount===lastBudget)api.clear?.('tour');
      lastBudget=null;return;
    }
    // 빈 일정 초기화/단순 화면 전환으로 사용자가 직접 입력한 관광 예산을 덮어쓰지 않는다.
    if(lastBudget!==null&&current&&(current.cur!=='KRW'||current.amount!==lastBudget))return;
    if(total===lastBudget&&current?.amount===total&&current.cur==='KRW')return;
    if(api.set?.('tour',total,'KRW'))lastBudget=total;
  }
  function emit(){document.dispatchEvent(new CustomEvent('tripcourse:change'));}

  /* ---------- 화면 ---------- */
  const label=date=>new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',weekday:'short',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'));
  function feeHtml(city,p){
    const f=feeOf(city,p);if(!f)return '';
    const n=result.fee.people,line=f.krw==null?'요금 확인 필요 · 합계 제외':f.amt===0?'무료':`≈ ${won(f.krw)} × ${n}명 = ${won(f.krw*n)}`;
    return `<label class="course-fee">🎟 참고 입장료 1인 <input type="number" min="0" step="any" inputmode="decimal" value="${f.amt??''}" placeholder="확인" data-fee="${esc(p.name)}" aria-label="${esc(p.name)} 1인 입장료 (${f.cur})"> ${esc(f.cur)} <span>${line}${f.edited?' · 직접 수정':''}</span>${f.note?`<em>${esc(f.note)}</em>`:''}</label>`;
  }
  function recHtml(r){
    const own=new Set(r.own),inMine=name=>own.has(name)||r.picks.includes(name);
    const allIn=r.rec.flatMap(d=>d.items).filter(p=>p.id).every(p=>inMine(p.name));
    let h=`<aside class="course-side" aria-label="추천 일정 미리보기"><div class="course-side-head"><b>✨ 추천 일정</b><span>${r.mode==='old'?'🍵 늙크크':'🧃 영크크'}</span></div>
      <button type="button" class="course-all" data-rec-all ${allIn?'disabled':''}>${allIn?'✓ 추천 일정을 모두 담았어요':'⬇ 추천 일정 한꺼번에 담기'}</button>
      <p class="course-side-fee">참고 입장료 ${won(r.recFee.total)} <small>(${r.recFee.people}명${r.recFee.unknown?` · 확인 필요 ${r.recFee.unknown}곳 제외`:''})</small></p>`;
    r.rec.forEach((d,i)=>{
      const real=d.items.filter(p=>p.id);
      h+=`<div class="course-rec-day"><div class="course-rec-top"><b>Day ${i+1} <small>${esc(label(d.date))}</small></b>${real.length?`<button type="button" data-rec-day="${i}" ${real.every(p=>inMine(p.name))?'disabled':''}>${real.every(p=>inMine(p.name))?'담음':'이 날 담기'}</button>`:''}</div>`;
      h+=real.length?`<ol>${real.map(p=>{const f=feeOf(r.city,p);return `<li>${photoHtml(r.city,p,'course-rec-thumb')}<span><time>${esc(p.time)}</time> ${esc(p.name)}<small>${f?(f.krw==null?'요금 확인':f.amt===0?'무료':won(f.krw)):''}</small></span><button type="button" class="course-add" data-rec-add="${esc(p.name)}" aria-label="${esc(p.name)} ${inMine(p.name)?'담음':'내 일정에 담기'}" ${inMine(p.name)?'disabled':''}>${inMine(p.name)?'✓':'+'}</button></li>`;}).join('')}</ol>`:'<p class="course-note">자유일정</p>';
      h+='</div>';
    });
    return h+`<button type="button" class="course-shuffle" data-course-shuffle>🔀 다른 추천 조합 보기</button></aside>`;
  }
  function paint(){
    const r=result,old=r.mode==='old';root.classList.toggle('course-old',old);
    const support=()=>Object.keys(DATA.cities).map(c=>`<button type="button" data-course-city="${esc(c)}">${esc(c)}</button>`).join('');
    let h=`<div class="course-mode-picker" role="group" aria-label="추천 일정 코스 선택"><span>아래 추천 일정의 코스 성향을 골라주세요</span><button type="button" class="course-mode-option" data-course-mode="young" aria-pressed="${!old}">🧃 영크크 · 활기찬 코스</button><button type="button" class="course-mode-option" data-course-mode="old" aria-pressed="${old}">🍵 늙크크 · 쉬어가는 코스</button></div><div class="course-head"><div><span class="course-chip">DEMO · 직접 구성한 예시 코스</span><h3>🗓 ${esc(r.city||'나의 여행')} ${r.actualDays?`${r.actualDays-1}박 ${r.actualDays}일`:''} 일정 만들기</h3><p>추천 일정을 한꺼번에 담거나, 빈 일정에서 한 곳씩 골라 채워요</p></div><span class="course-mode">${old?'🍵 늙크크 · 쉬어가기':'🧃 영크크 · 활기차게'}</span></div>`;
    if(!r.days?.length){root.innerHTML=h+`<div class="course-empty">${r.city?'이 여행지의 코스를 준비 중이에요.':'상단에서 여행지를 고르면 일정을 만들 수 있어요.'}<div class="course-supported">${support()}</div></div>`;return;}
    if(!r.dated)h+='<p class="course-note">날짜를 고르면 일수에 맞춰 바뀌어요. 지금은 예시 2박 3일입니다.</p>';
    if(r.actualDays>7)h+='<p class="course-note">최대 7일까지 만들어요. 8일 이후는 자유일정입니다.</p>';
    const count=r.days.flatMap(d=>d.items).filter(p=>p.id).length;
    h+='<div class="course-layout"><section class="course-main" aria-label="내 일정">';
    h+=`<div class="course-main-head"><div><b>📒 내 일정</b><span>${count}곳</span></div><button type="button" class="course-clear" data-course-clear ${r.own.length||r.picks.length?'':'disabled'}>🧹 빈 일정에서 시작</button></div>`;
    h+=`<div class="course-total"><span>🎟 참고 입장료 합계 <small>${r.fee.people}명 · 성인 기준</small></span><b>${won(r.fee.total)}</b>${r.fee.unknown?`<small>요금 확인 필요 ${r.fee.unknown}곳은 합계에서 빠졌어요</small>`:''}${window.TripBudget?.set?'<small>담은 곳의 참고 입장료를 관광 예산에 반영해요 · 교통·식비 별도</small>':''}</div>`;
    if(!count){
      h+=`<div class="course-blank"><b>아직 빈 일정이에요</b><p>추천 일정을 한꺼번에 담거나, 추천 장소 옆 <b>+</b>를 눌러 하나씩 채워보세요. 위 관광 추천에서 담은 곳도 여기에 들어와요.</p><button type="button" class="course-all" data-rec-all>⬇ 추천 일정 한꺼번에 담기</button></div>`;
    }else{
      h+=`<div class="course-tabs" role="tablist" aria-label="내 일정 날짜">${r.days.map((d,i)=>`<button type="button" role="tab" aria-selected="${i===active}" data-course-day="${i}" aria-controls="course-day-view">Day ${i+1}<small>${esc(label(d.date))}</small><i>${d.items.filter(p=>p.id).length}곳 · ${won(r.fee.perDay[i])}</i></button>`).join('')}</div>`;
      const day=r.days[active],real=day.items.filter(p=>p.id),walking=real.length?Math.max(...real.map(p=>p.walk)):0;
      const elapsed=day.items.length?Math.max(...day.items.map(p=>p.end))-day.start:0;
      h+=`<div class="course-day-head"><b>${real.length?`${esc(day.area)} 중심으로`:'자유일정'}</b><p>장소 ${real.length}곳 · 예상 걷기 ${['없음','가벼움','보통','많음'][walking]} · 소요 약 ${Math.round(elapsed/6)/10}시간 · 입장료 ${won(r.fee.perDay[active])}</p>${day.sunset?`<span>🌇 ${day.sunset.time} 일몰 · ${clock(day.sunset.arrival)} 도착 추천 (예상 시각)</span>`:''}</div>`;
      h+='<div id="course-day-view" role="tabpanel" class="course-timeline">';
      if(!day.items.length)h+='<div class="course-empty">이날은 비어 있어요. 추천 일정에서 담거나 자유일정으로 활용하세요.</div>';
      let index=0;
      for(const item of day.items){
        if(item.travel?.minutes)h+=`<p class="course-move">${item.travel.kind} 약 ${item.travel.minutes}분 · 직선거리 ${item.travel.km.toFixed(1)}km 기반 추정</p>`;
        const removable=!!item.id;
        h+=`<article class="course-card ${item.kind==='휴식'?'course-rest':''} ${item.id?'course-has-photo':''}"><div class="course-number">${item.id?++index:item.kind==='휴식'?'☕':'→'}</div>${item.id?photoHtml(r.city,item,'course-photo'):''}<div class="course-body"><div class="course-time">${esc(item.time)} <span>${esc(item.kind)}</span>${item.fromTrend?'<em>💚 관광 추천에서 담음</em>':''}${removable?`<button type="button" class="course-remove" data-mine-remove="${esc(item.name)}" aria-label="${esc(item.name)} 빼기">✕ 빼기</button>`:''}</div><b>${esc(item.name)}</b><p>${esc(item.description)}</p>${item.id?(old?`<small>🚶 걷기 ${['','쉬움','보통','많음'][item.walk]} (시연 기준) · 💡 ${esc(item.tip)}</small>`:`<small>📸 ${esc(item.shot)}</small>`):''}${item.golden?'<p class="course-golden">🌇 예상 일몰 40분 전 도착에 맞춘 슬롯</p>':''}${item.gifts?`<p>🛍 근처 기념품 후보: ${item.gifts.map(esc).join(', ')}</p>`:''}${item.id?feeHtml(r.city,item):''}</div></article>`;
      }
      h+='</div>';
    }
    if(r.unplaced.length)h+=`<div class="course-overflow"><b>다 못 넣은 곳 ${r.unplaced.length}곳</b><ul>${r.unplaced.map(p=>`<li>${esc(p.name)} · ${esc(p.reason)}</li>`).join('')}</ul>날짜나 여행 속도를 조정하거나 일부를 빼 주세요.</div>`;
    if(r.picks.length&&!r.own.length&&count)h+='<p class="course-note">💚 표시는 관광 추천에서 담은 곳이에요. 여기서 빼면 TOP 10의 담기도 함께 해제돼요.</p>';
    h+='</section>'+recHtml(r)+'</div>';
    const fxList=[r.currency].filter(Boolean).map(c=>`1 ${c} ≈ ${KRW[c]<10?KRW[c].toFixed(3):Math.round(KRW[c]).toLocaleString('ko-KR')}원${EST_FX.includes(c)?' (USD 기준 추정)':''}`).join('');
    h+=`<details><summary>데이터 출처·사진·입장료 기준</summary><p>대표 사진은 TOP 10과 같은 Wikimedia 무료 자료를 공유하며, 작가·라이선스·원본을 함께 표시해요. 연결되지 않으면 아이콘으로 표시돼요.</p><p>입장료: 첨부 파일의 성인 1인 예시 참고값이며 최신 공식 요금으로 검증하지 않았어요(현지 통화). 요일·시즌·예약 방식에 따라 달라질 수 있으니 방문 전 공식 사이트에서 확인하세요. 카드에서 금액을 고치면 이 브라우저에 저장되고 합계에 바로 반영돼요. 인원은 성인+어린이 수로 계산하고, 어린이·경로 할인과 유아는 반영하지 않아요.</p><p>환율: 같은 통화의 예산 패널 환율을 우선 사용하며, 없으면 첨부 파일에 기재된 ${FX_DATE} 참고값으로 원화 환산 · 공식 고시값의 최신 여부는 확인하지 않았으며 실시간 환율이 아닙니다${fxList?` · ${fxList}`:''}.</p><p>장소 좌표: Wikidata P625 (CC0). 설명·촬영 아이디어·동선 규칙·모의 점수는 직접 작성했어요. 트리플의 코스·사진·문장은 수집하거나 복제하지 않았어요.</p><p>거리: 하버사인 직선거리. 1.2km 이하는 도보 4.5km/h, 그 이상은 대중교통 평균 20km/h와 대기 10분을 가정해 5분 단위로 반올림해요. 일몰은 NOAA 근사식으로 계산한 예상 시각이에요.</p>${r.missing.length?`<p>좌표를 확인하지 못해 자동 배치에서 제외: ${r.missing.map(esc).join(', ')}</p>`:''}<div class="course-sources">${(DATA.cities[r.city]?.places||[]).filter(p=>p.source).map(p=>`<a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">${esc(p.name)}</a>`).join(' · ')}</div></details>`;
    root.innerHTML=h;
  }

  /* ---------- 이벤트 ---------- */
  function addNames(names,day){const city=result.city;if(!city)return;const s=mineOf(city);if(!dayChoices[city]||typeof dayChoices[city]!=='object')dayChoices[city]={};names.forEach(n=>{s.add(n);if(Number.isInteger(day))dayChoices[city][n]=day;});save(DAY_KEY,dayChoices);setMine(city,s);if(Number.isInteger(day))active=day;calculate();}
  root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.courseMode)window.TripTrend?.setMode?.(b.dataset.courseMode);
    else if(b.dataset.courseDay!=null){active=Number(b.dataset.courseDay);paint();}
    else if(b.hasAttribute('data-course-shuffle')){const city=result.city;seeds[city]=(Number(seeds[city])||0)+1;save(SEED_KEY,seeds);calculate();}
    else if(b.hasAttribute('data-rec-all')){const city=result.city;if(!dayChoices[city]||typeof dayChoices[city]!=='object')dayChoices[city]={};result.rec.forEach((d,i)=>d.items.filter(p=>p.id).forEach(p=>{dayChoices[city][p.name]=i;}));save(DAY_KEY,dayChoices);addNames(result.rec.flatMap(d=>d.items).filter(p=>p.id).map(p=>p.name));}
    else if(b.dataset.recDay!=null){const day=Number(b.dataset.recDay);addNames((result.rec[day]?.items||[]).filter(p=>p.id).map(p=>p.name),day);}
    else if(b.dataset.recAdd)addNames([b.dataset.recAdd],result.rec.findIndex(d=>d.items.some(p=>p.name===b.dataset.recAdd)));
    else if(b.dataset.mineRemove)removeName(b.dataset.mineRemove);
    else if(b.hasAttribute('data-course-clear')){setMine(result.city,[]);delete dayChoices[result.city];save(DAY_KEY,dayChoices);active=0;window.TripTour?.clear?.(result.city);calculate();}
    else if(b.dataset.courseCity)document.dispatchEvent(new CustomEvent('triptrend:destination',{detail:{city:b.dataset.courseCity}}));
  });
  root.addEventListener('change',event=>{const input=event.target.closest('input[data-fee]');if(!input)return;
    const key=result.city+'|'+input.dataset.fee,v=input.value.trim();
    if(v===''||!Number.isFinite(Number(v))||Number(v)<0||Number(v)>1e9)delete feeEdits[key];else feeEdits[key]=Number(v);
    save(FEE_KEY,feeEdits);calculate();
  });

  function removeName(name){const city=result.city,s=mineOf(city);s.delete(name);if(dayChoices[city])delete dayChoices[city][name];save(DAY_KEY,dayChoices);setMine(city,s);window.TripTour?.setPicked?.(city,name,false);calculate();}
  document.addEventListener('triptourphotos:change',paint);
  window.TripCourse=Object.freeze({
    get:()=>JSON.parse(JSON.stringify(result)),
    contains:(city,name)=>result.city===city&&[...(result.own||[]),...(result.picks||[])].includes(name),
    remove:removeName,
    feeFor:(city,name)=>{const p=DATA.cities[city]?.places.find(x=>x.name===name);return p?feeOf(city,p):null;},
    summaryText(){if(!result.days?.length)return '미정';const items=result.days.flatMap(d=>d.items).filter(p=>p.id);return `${result.city} ${result.actualDays-1}박 ${result.actualDays}일 · 내 일정 ${items.length}곳 · 입장료 ${won(result.fee.total)}`;}
  });
  document.addEventListener('tripcontext:change',calculate);document.addEventListener('triptrend:change',calculate);
  document.addEventListener('tripbudget:change',()=>{const p=window.TripBudget?.get?.().planning,signature=p?.localCurrency+'|'+p?.exchangeRateKRW;if(signature!==lastRateSignature){lastRateSignature=signature;calculate();}});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',calculate,{once:true});else calculate();
})();

</script>

    <script id="food-trend-ui">
/* Offline food UI. The data block is replaceable; this module never calls a network API. */
(() => {
  'use strict';
  const root=document.getElementById('food-root');
  if(!root)return;
  const DATA=window.FOOD_TREND_DATA;
  if(!DATA||!DATA.cities||typeof DATA.cities!=='object'){root.hidden=true;return;}
  const KINDS=['현지 음식','해산물','고기·구이','면·국물','카페·디저트','길거리 음식'];
  const BUDGETS=['1만원 이하','1~3만원','3~5만원','5만원 이상'];
  const ICONS={'웨이팅 적은 곳':'🪑','예약 가능':'📅','한국어 메뉴':'🇰🇷','채식 가능':'🌱'};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const finite=v=>typeof v==='number'&&Number.isFinite(v);
  const cities=Object.create(null),known=new Set();
  for(const [city,raw] of Object.entries(DATA.cities)){
    if(!Array.isArray(raw))continue;
    const seen=new Set();
    cities[city]=raw.filter(p=>p&&typeof p.name==='string'&&p.name.trim()).flatMap(p=>{
      const key=city+'|'+p.name;if(seen.has(key))return [];seen.add(key);known.add(key);
      return [{...p,city,key,name:p.name,area:typeof p.area==='string'&&p.area.trim()?p.area:'지역 미분류',kind:typeof p.kind==='string'?p.kind:'',budget:typeof p.budget==='string'?p.budget:'',prefs:Array.isArray(p.prefs)?p.prefs.filter(v=>typeof v==='string'):[],score:finite(p.score)?Math.max(0,Math.min(100,p.score)):0,trendPct:finite(p.trendPct)?p.trendPct:0,blogTotal:finite(p.blogTotal)?Math.max(0,Math.round(p.blogTotal)):0,chain:p.chain===true,hiddenGem:p.hiddenGem===true}];
    });
  }
  let picks=new Set(),area='',grouped=false,lastCity='',storageUnavailable=false;
  try{const v=JSON.parse(localStorage.getItem('gonsang-food-picks-v1')||'[]');if(Array.isArray(v))picks=new Set(v.filter(k=>known.has(k)));}catch(_){storageUnavailable=true;}
  const context=()=>{try{return window.TripContext?.()||{};}catch(_){return {};}};
  const mode=()=>{try{return window.TripTrend?.get()?.mode==='old'?'old':'young';}catch(_){return 'young';}};
  const arr=v=>Array.isArray(v)?v:[];
  function matches(p,food){
    const kinds=arr(food.kind),budgets=arr(food.budget),prefs=arr(food.pref);
    const kindActive=kinds.length>0&&!(kinds.length===1&&kinds[0]==='현지 음식');
    const limit=BUDGETS.indexOf(budgets[0]);
    return {kind:!kindActive||(KINDS.includes(p.kind)&&kinds.includes(p.kind)),budget:p.budget===''||limit<0||(BUDGETS.includes(p.budget)&&BUDGETS.indexOf(p.budget)<=limit),pref:prefs.every(v=>p.prefs.includes(v)||(v==='웨이팅 적은 곳'&&p.hiddenGem)),area:!area||area===p.area};
  }
  const relaxed=p=>p.hiddenGem||p.prefs.includes('웨이팅 적은 곳');
  function sorted(rows,old){return [...rows].sort((a,b)=>{
    if(old){const chain=p=>p.chain&&!p.prefs.includes('한국어 메뉴');const d=Number(chain(a))-Number(chain(b));if(d)return d;const r=Number(relaxed(b))-Number(relaxed(a));if(r)return r;}
    return b.score-a.score||a.name.localeCompare(b.name,'ko');
  });}
  function cityButtons(){return '<div class="ft-cities">'+Object.keys(cities).filter(c=>cities[c].length).map(c=>`<button type="button" data-food-city="${esc(c)}">${esc(c)}</button>`).join('')+'</div>';}
  function card(p,old){
    const picked=picks.has(p.key),change=Math.round(p.trendPct),trend=change>0?'▲'+change+'%':change<0?'▼'+Math.abs(change)+'%':'–';
    const badge=(s,c='')=>`<span class="ft-chip ${c}">${esc(s)}</span>`;
    return `<article class="ft-card${picked?' ft-picked':''}" data-food-name="${esc(p.name)}" data-food-area="${esc(p.area)}" data-food-kind="${esc(p.kind)}" data-food-budget="${esc(p.budget)}" data-food-score="${p.score}"><div class="ft-name"><span class="ft-rank">${esc(p.rank??'·')}</span><span>${esc(p.name)}</span></div><div>${badge(p.area)}${badge(p.kind||'종류 미분류')}${p.chain?badge('체인'):''}${p.hiddenGem?badge('💎 숨은 맛집','ft-good'):''}${!old&&p.trendPct>=20?badge('🔥 지금 뜨는 중','ft-good'):''}${old&&(p.prefs.includes('웨이팅 적은 곳')||p.prefs.includes('예약 가능'))?badge('🪑 여유롭게','ft-good'):''}</div><div class="ft-meter" role="meter" aria-label="${esc(p.name)} 화제도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.score}"><span style="width:${p.score}%"></span></div><div class="ft-score">화제도 ${p.score} <span>${trend}</span></div><p class="ft-note">${esc(p.budget||'예산 정보 없음')} · ${p.prefs.length?p.prefs.map(v=>esc((ICONS[v]||'✓')+' '+v)).join(' · '):'식사 조건 정보 없음'}</p><p class="ft-note">${esc(p.note||'')}</p><div class="ft-sub">📝 블로그 ${p.blogTotal.toLocaleString('ko-KR')}건 · 검색 결과 수</div><button class="ft-pick" type="button" data-food-pick="${esc(p.key)}" aria-pressed="${picked}">${picked?'담음 ✓':'＋ 담기'}</button></article>`;
  }
  function render(){
    const ctx=context(),city=(ctx.dest||'').trim(),old=mode()==='old',raw=cities[city]||[],food=ctx.food||{};
    if(city!==lastCity){area='';lastCity=city;}
    root.hidden=false;
    const header=`<span class="ft-chip ft-good">${old?'🍵 늙크크':'🧃 영크크'}</span>${DATA.dryRun===true?'<span class="ft-chip ft-demo">DEMO · 시연용 예시 값</span>':''}<h4>${old?'줄 덜 서고 편하게 먹는 곳':'검색 자료로 살펴본 요즘 맛집'}</h4><p class="ft-sub">기준 ${esc(DATA.generatedAt||'미제공')} · 네이버 블로그 검색 결과와 검색 추이 기준</p><p class="ft-sub">검색 기반 참고 순위이며 실제 방문자 수·방문 순위가 아닙니다.</p>`;
    if(!city||!raw.length){root.innerHTML=header+`<div class="ft-empty">${!city?'상단에서 여행지를 고르면 화제의 맛집이 떠요':`아직 ${esc(city)} 맛집 데이터가 없어요`}${cityButtons()}</div>`;return;}
    const checks=raw.map(p=>({p,m:matches(p,food)})),filtered=checks.filter(x=>Object.values(x.m).every(Boolean)).map(x=>x.p),rows=sorted(filtered,old);
    const areaCounts=new Map();for(const x of checks.filter(x=>x.m.kind&&x.m.budget&&x.m.pref))areaCounts.set(x.p.area,(areaCounts.get(x.p.area)||0)+1);
    const allAreas=[...new Set(raw.map(p=>p.area))];
    const chips=`<div class="ft-areas"><button type="button" data-food-area-filter="" aria-pressed="${!area}">전체 ${[...areaCounts.values()].reduce((a,b)=>a+b,0)}</button>${allAreas.map(a=>`<button type="button" data-food-area-filter="${esc(a)}" aria-pressed="${area===a}">${esc(a)} ${areaCounts.get(a)||0}</button>`).join('')}</div><label class="ft-group"><input type="checkbox" data-food-group ${grouped?'checked':''}>지역별로 묶어 보기 · 지역별 TOP 3</label><p class="ft-sub">조건에 맞는 ${rows.length}곳${grouped?' · 각 지역에서 최대 3곳 표시':''}</p>`;
    let body='';

  function emit(){document.dispatchEvent(new CustomEvent('foodtrend:change'));}

  });
  document.addEventListener('tripcontext:change',render);
  document.addEventListener('triptrend:change',render);
  render();
})();

    '리마':[['페루 국립박물관','National Museum of Peru','박물관','페루의 역사와 문화를 전시로 살펴보세요.'],['산마르틴 광장','Plaza San Martín, Lima','역사','광장과 주변 건축을 함께 둘러보는 도심 코스예요.']]
  };
  window.GonsangTourExtras=Object.freeze(Object.fromEntries(Object.entries(extras).map(([city,rows])=>[city,Object.freeze(rows.map(([name,wiki,category,description],i)=>Object.freeze({id:`${city}:extra${i}`,city,name,wiki,category,description,order:10+i})))])));
})();

<!-- tour-top10-ui START: source tour-recommendations.js; sync with tools/sync-tour-inline.mjs -->
<script id="tour-top10-ui">
/* 독립된 관광 추천 모듈. 수동 선정 후보 + 관광 테마 필터, Wikimedia 무료 사진.
 * 별점/리뷰/글로벌 저장 수는 생성하지 않는다. 담기는 이 브라우저의 내 일정에만 저장한다.
 */
(() => {
  const host=document.getElementById('travel-trends-root'); if(!host)return;
  const root=document.createElement('section'); root.id='tour-recommendations'; host.prepend(root);
  const catalog=window.GonsangTourCatalog || {}, extras=window.GonsangTourExtras || {}, giftCatalog=window.GonsangTourGifts || {}, all=[...Object.values(catalog).flat(),...Object.values(extras).flat(),...Object.values(giftCatalog).flat()];
  const known=new Set(all.map(p=>p.id)), STORE='gonsang-tour-picks-v1';
  let picked=[]; try { picked=JSON.parse(localStorage.getItem(STORE)||'[]'); } catch(_) {}
  const picks=new Set(Array.isArray(picked)?picked.filter(id=>known.has(id)):[]);
  let category='전체', onlyPicked=false, previousCity='', imageStatus='idle', busy=false, mode='young';
  try { mode=localStorage.getItem('gonsang-tour-mode-v1')==='old'?'old':'young'; } catch(_) {}
  const photos=new Map(), attempted=new Set();
  const isPicked=p=>picks.has(p.id)||window.TripCourse?.contains?.(p.city,p.name)===true;
  const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const context=()=>window.TripContext?.() || {};
  const cityNow=()=>context().dest?.trim() || '';
  const ownPlaces=()=>Object.hasOwn(catalog,cityNow())?[...catalog[cityNow()],...(extras[cityNow()]||[])]:[];
  const ownGifts=()=>Object.hasOwn(giftCatalog,cityNow())?giftCatalog[cityNow()]:[];
  const ownCandidates=()=>[...ownPlaces(),...ownGifts()];
  const recommendationReason=()=>category==='전체'?'도시 대표 여행 후보':`✓ ${category} 테마의 여행 후보`;
  function setMode(value){if(!['young','old'].includes(value))return;mode=value;try{localStorage.setItem('gonsang-tour-mode-v1',mode);}catch(_){}document.dispatchEvent(new CustomEvent('triptrend:change'));}
  const wikiURL=p=>'https://en.wikipedia.org/wiki/'+encodeURIComponent(p.wiki.replaceAll(' ','_'));
  const mapURL=p=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.city+' '+p.name+' '+p.wiki);
  const notify=()=>document.dispatchEvent(new CustomEvent('triptour:change'));
  const store=()=>{try{localStorage.setItem(STORE,JSON.stringify([...picks]));}catch(_){}notify();};
  const css=document.createElement('style');
  css.textContent=`
    #tour-recommendations{container-type:inline-size;color:#233b31}
    #tour-recommendations *{box-sizing:border-box}
    #tour-recommendations h3{margin:8px 0;font-size:25px;letter-spacing:-.6px}
    #tour-recommendations .tour-kicker{color:#1d735a;font-size:11px;font-weight:800;letter-spacing:1px}
    #tour-recommendations .tour-sub{font-size:13px;color:#707b74;line-height:1.7;margin:0 0 16px}
    #tour-recommendations .tour-tools{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
    #tour-recommendations button{font:inherit;cursor:pointer}
    #tour-recommendations .tour-filter{padding:7px 12px;border:1px solid #d9e3dc;border-radius:999px;background:#fff;color:#52665a;font-size:12px;font-weight:700}
    #tour-recommendations .tour-filter[aria-pressed="true"]{background:#1d735a;color:#fff;border-color:#1d735a}
    #tour-recommendations .tour-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
    #tour-recommendations .tour-card{display:grid;grid-template-columns:24px minmax(0,1fr) 112px;gap:10px;padding:22px 0;border-bottom:1px solid #e5eae6;min-width:0}
    #tour-recommendations .tour-rank{color:#3082de;font-size:19px;font-weight:800}
    #tour-recommendations .tour-name{display:block;color:#24382d;font-size:17px;line-height:1.4;text-decoration:none;font-weight:800;word-break:keep-all}
    #tour-recommendations .tour-desc{margin:7px 0;color:#6a746e;font-size:12px;line-height:1.65}
    #tour-recommendations .tour-meta{color:#879087;font-size:11px;line-height:1.7}
    #tour-recommendations .tour-reason{display:block;color:#27735a;font-size:11px;margin-top:4px}
    #tour-recommendations .tour-fee{padding:7px 9px;margin-top:8px;background:#f3f7ee;border-radius:8px;font-size:11px;color:#4b684d;line-height:1.7}
    #tour-recommendations .tour-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
    #tour-recommendations .tour-pick{border:1px solid #d7e3dc;color:#1d735a;background:#fff;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:800}
    #tour-recommendations .tour-pick[aria-pressed="true"]{background:#e7f3ed;border-color:#86b29c}
    #tour-recommendations .tour-map{font-size:11px;color:#577362;text-underline-offset:3px}
    #tour-recommendations .tour-photo{margin:0;min-width:0}
    #tour-recommendations .tour-photo img{width:112px;height:112px;border-radius:12px;object-fit:cover;display:block}
    #tour-recommendations .tour-placeholder{height:112px;border-radius:12px;background:linear-gradient(135deg,#edf2eb,#dee9e3);display:grid;place-items:center;color:#7b8b7e;font-size:11px;text-align:center;padding:10px;line-height:1.6}
    #tour-recommendations .tour-credit{font-size:9px;line-height:1.5;margin-top:5px;overflow-wrap:anywhere;color:#7a857d}
    #tour-recommendations .tour-credit a{color:inherit}
    #tour-recommendations .tour-tray{padding:13px;background:#f0f6f2;border-radius:12px;font-size:12px;line-height:1.8;margin:14px 0}
    #tour-recommendations .tour-empty{padding:28px 16px;border:1px dashed #cad9cf;border-radius:14px;font-size:13px;line-height:1.8;color:#65776b}
    #tour-recommendations .tour-photo-note{font-size:11px;color:#7c877f;line-height:1.6;margin:14px 0}
    #tour-recommendations .tour-gifts{padding:16px;background:#f7f4eb;border-radius:14px;margin-top:20px;font-size:13px;line-height:1.8}
    #tour-recommendations .tour-gifts p{font-size:11px;color:#7a796f}
    #tour-recommendations .tour-gifts button{margin:4px 8px 4px 0}
    #tour-recommendations button:focus-visible,#tour-recommendations a:focus-visible{outline:3px solid #86b29c;outline-offset:3px}
    @container(max-width:700px){#tour-recommendations .tour-list{grid-template-columns:1fr}}
    @container(max-width:350px){#tour-recommendations .tour-card{grid-template-columns:20px minmax(0,1fr) 82px;gap:8px}#tour-recommendations .tour-photo img{width:82px;height:94px}#tour-recommendations .tour-placeholder{height:94px}#tour-recommendations h3{font-size:21px}}
  `; document.head.appendChild(css);
  function photoHTML(p){
    const photo=photos.get(p.wiki);
    if(!photo)return `<div class="tour-placeholder" aria-label="${e(p.name)} 사진 미표시">${attempted.has(p.wiki)?'사진 준비 중':'사진 불러오는 중'}</div>`;
    return `<img src="${e(photo.url)}" alt="${e(p.name)} 관련 사진 · ${e(photo.article)}" loading="lazy" referrerpolicy="no-referrer"><figcaption class="tour-credit">${e(photo.author)} · <a href="${e(photo.licenseURL)}" target="_blank" rel="noopener noreferrer">${e(photo.license)}</a><br><a href="${e(photo.source)}" target="_blank" rel="noopener noreferrer">Wikimedia Commons 원본</a></figcaption>`;
  }
  function render(){
    const city=cityNow(); if(city!==previousCity){category='전체';onlyPicked=false;previousCity=city;imageStatus='idle';}
    const places=ownPlaces(), selected=ownCandidates().filter(isPicked);
    const gifts=ownGifts().filter(p=>!onlyPicked||isPicked(p));
    const ranked=places.filter(p=>(category==='전체'||p.category===category)&&(!onlyPicked||isPicked(p))).sort((a,b)=>a.order-b.order);
    const filtered=onlyPicked?ranked:ranked.slice(0,10);
    const categories=['전체',...new Set(places.map(p=>p.category))];
    root.innerHTML=`<span class="tour-kicker">GONSANG PICKS · 도시별 대표 장소</span><h3>${city?e(city)+' 추천 관광지':'어디로 떠나볼까요?'}${places.length?' TOP 10':''}</h3>
      <p class="tour-sub">${places.length?'아래 관광 테마를 고르면 해당하는 장소만 볼 수 있어요. 수동 선정한 추천이며 실제 인기 순위나 평점이 아닙니다.':'상단에서 여행지를 선택하면 사진과 함께 추천 장소를 살펴볼 수 있어요.'}</p>
      ${places.length?`<div class="tour-tools" role="group" aria-label="관광 테마 필터">${categories.map(c=>`<button class="tour-filter" type="button" data-category="${e(c)}" aria-pressed="${c===category}">${e(c)}</button>`).join('')}<button class="tour-filter" type="button" data-picked-only aria-pressed="${onlyPicked}">♥ 담은 곳 ${selected.length}</button></div>`:''}
      ${selected.length?`<div class="tour-tray"><b>내 일정에 담은 곳 ${selected.length}개</b><br>${selected.map(p=>e(p.name)).join(' · ')}<br>하단 ‘저장하고 최종 일정 보기’에서 함께 확인하세요.</div>`:''}
      <div class="tour-list">${filtered.map((p,i)=>`<article class="tour-card"><span class="tour-rank">${i+1}</span><div><a class="tour-name" href="${wikiURL(p)}" target="_blank" rel="noopener noreferrer">${e(p.name)}</a><p class="tour-desc">${e(p.description)}</p><span class="tour-meta">${e(p.category)} · ${e(city)} 및 인근</span><span class="tour-reason">${e(recommendationReason(p))}</span>${feeHTML(p)}<div class="tour-actions"><button class="tour-pick" type="button" data-pick="${e(p.id)}" aria-pressed="${isPicked(p)}">${isPicked(p)?'♥ 담음 · 취소':'♡ 내 일정에 담기'}</button><a class="tour-map" href="${mapURL(p)}" target="_blank" rel="noopener noreferrer">지도 보기 ↗</a></div></div><figure class="tour-photo" data-photo="${e(p.wiki)}">${photoHTML(p)}</figure></article>`).join('')}</div>
      ${!filtered.length&&!gifts.length?`<div class="tour-empty">${!city?'여행지를 먼저 선택해 주세요.':!places.length?'이 도시의 추천 장소를 준비 중이에요. 직접 검색한 여행지일 수 있어요.':'선택한 분류에 해당하거나 일정에 담은 장소가 없어요.'}</div>`:''}
      ${gifts.length?`<section class="tour-gifts"><b>🛍 함께 살펴볼 기념품 후보</b><p>담지 않은 기념품은 코스의 쇼핑 구역에 메모로 붙이고, 직접 담으면 별도 쇼핑 슬롯으로 계획해요. 실제 구매 매장은 직접 정해야 합니다.</p>${gifts.map(p=>`<button type="button" class="tour-pick" data-pick="${e(p.id)}" aria-pressed="${isPicked(p)}">${isPicked(p)?'♥':'♡'} ${e(p.name)}</button>`).join('')}</section>`:''}
      ${places.length?'<p class="tour-photo-note" role="status" data-photo-status>사진은 무료 Wikimedia 자료에서 출처·라이선스를 확인해 불러옵니다. 이미지가 없거나 연결되지 않으면 자리 표시가 나옵니다. 장소별 방문 가능 여부·운영시간·입장료는 공식 사이트에서 확인하세요.</p><button class="tour-filter" type="button" data-photo-retry>사진 다시 불러오기</button>':''}`;
    hydratePhotos();
  }
  function feeHTML(p){
    const f=window.TripCourse?.feeFor?.(p.city,p.name);if(!f)return '';
    const price=f.amt===null?'금액 확인 필요':f.amt===0?'무료로 기재된 장소':`${f.amt.toLocaleString('ko-KR')} ${f.cur} · 약 ${Math.round(f.krw).toLocaleString('ko-KR')}원`;
    return `<div class="tour-fee">🎟 1인 입장료 참고 · ${e(price)}${f.edited?' · 직접 수정':''}${f.note?'<br>'+e(f.note):''}<br>첨부 자료 기준 · 최신 요금은 공식 사이트에서 확인</div>`;
  }
  const plain=html=>{const textarea=document.createElement('textarea');textarea.innerHTML=String(html||'').replace(/<[^>]*>/g,'');return textarea.value;};
  async function getJSON(endpoint,params){
    const url=new URL(endpoint);url.search=new URLSearchParams({action:'query',format:'json',formatversion:'2',origin:'*',...params});
    const res=await fetch(url,{credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});
    if(!res.ok)throw Error('photo unavailable');return res.json();
  }
  async function hydratePhotos(){
    if(busy || !document.getElementById('pane-tour')?.classList.contains('on'))return;
    const city=cityNow(), todo=ownPlaces().filter(p=>!attempted.has(p.wiki)); if(!todo.length)return;
    busy=true;todo.forEach(p=>attempted.add(p.wiki));
    try{
      const data=await getJSON('https://en.wikipedia.org/w/api.php',{prop:'pageimages',titles:[...new Set(todo.map(p=>p.wiki))].join('|'),redirects:'1',piprop:'name',pilicense:'free'});
      const redirects=new Map([...(data.query?.normalized||[]),...(data.query?.redirects||[])].map(r=>[r.from,r.to]));
      const resolve=title=>{for(let i=0;i<5&&redirects.has(title);i++)title=redirects.get(title);return title;};
      const pages=data.query?.pages||[],fileByName=new Map(todo.map(p=>[p.name,pages.find(page=>page.title===resolve(p.wiki))?.pageimage]));
      // 대표 이미지가 없는 문서는 같은 장소의 Wikidata P18을 살펴본 뒤 Commons의 이용 조건을 확인한다.
      const missing=todo.filter(p=>!fileByName.get(p.name));
      if(missing.length){
        let course={};try{course=JSON.parse(document.getElementById('course-data')?.textContent||'{}');}catch(_){}
        const qids=missing.map(p=>({p,q:(course.cities?.[city]?.places||[]).find(x=>x.name===p.name)?.source?.match(/\/(Q\d+)$/)?.[1]})).filter(x=>x.q);
        if(qids.length)try{
          const url=new URL('https://www.wikidata.org/w/api.php');url.search=new URLSearchParams({action:'wbgetentities',format:'json',origin:'*',ids:[...new Set(qids.map(x=>x.q))].join('|'),props:'claims'});
          const res=await fetch(url,{credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});
          if(res.ok){const entities=(await res.json()).entities||{};for(const {p,q} of qids){const claim=(entities[q]?.claims?.P18||[]).find(c=>c.rank!=='deprecated'&&typeof c.mainsnak?.datavalue?.value==='string');if(claim)fileByName.set(p.name,claim.mainsnak.datavalue.value);}}
        }catch(_){/* 이미 확인한 Wikipedia 사진은 계속 표시한다. */}
      }
      const files=[...new Set([...fileByName.values()].filter(Boolean))];
      if(files.length){
        const info=await getJSON('https://commons.wikimedia.org/w/api.php',{prop:'imageinfo',titles:files.map(f=>'File:'+f).join('|'),iiprop:'url|extmetadata',iiurlwidth:'320'});
        for(const p of todo){
          const page=pages.find(page=>page.title===resolve(p.wiki)), file=fileByName.get(p.name);
          if(!file)continue;
          const media=info.query?.pages?.find(page=>page.title.replaceAll('_',' ')==='File:'+file.replaceAll('_',' '))?.imageinfo?.[0], meta=media?.extmetadata;
          const license=plain(meta?.LicenseShortName?.value), author=plain(meta?.Attribution?.value || meta?.Artist?.value);
          const url=media?.thumburl, licenseURL=meta?.LicenseUrl?.value;
          if(!url || !author || !/^(?:CC BY(?:-SA)?(?: [\d.]+)?|CC0(?: [\d.]+)?|Public domain)$/i.test(license))continue;
          const imageURL=new URL(url), rightsURL=new URL(licenseURL || (license==='Public domain'?'https://creativecommons.org/publicdomain/mark/1.0/':license.startsWith('CC0')?'https://creativecommons.org/publicdomain/zero/1.0/':''));
          if(imageURL.protocol!=='https:'||!['upload.wikimedia.org','thumb.wikimedia.org'].includes(imageURL.hostname)||rightsURL.protocol!=='https:'||!['creativecommons.org','www.gnu.org','commons.wikimedia.org'].includes(rightsURL.hostname))continue;
          photos.set(p.wiki,{url:imageURL.href,license,licenseURL:rightsURL.href,author,article:page?.title||p.wiki,source:'https://commons.wikimedia.org/wiki/'+encodeURIComponent('File:'+file)});
        }
      }
      imageStatus='done';
    }catch(_){imageStatus='unavailable';}
    finally{
      busy=false;
      if(city===cityNow()){
        root.querySelectorAll('[data-photo]').forEach(slot=>{const p=ownPlaces().find(p=>p.wiki===slot.dataset.photo);if(p)slot.innerHTML=photoHTML(p);});
        if(imageStatus==='unavailable'){const note=root.querySelector('[data-photo-status]');if(note)note.textContent='사진 제공처에 연결하지 못했어요. 장소 정보·지도·일정 담기는 계속 사용할 수 있어요.';}
      }else hydratePhotos();
      document.dispatchEvent(new CustomEvent('triptourphotos:change'));
    }
  }
  root.addEventListener('click',ev=>{
    const b=ev.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-category')){category=b.dataset.category;render();document.dispatchEvent(new CustomEvent('triptourfilter:change'));}
    else if(b.hasAttribute('data-picked-only')){onlyPicked=!onlyPicked;render();}
    else if(b.dataset.pick && known.has(b.dataset.pick)){const id=b.dataset.pick,p=all.find(p=>p.id===id);if(isPicked(p)){picks.delete(id);window.TripCourse?.remove?.(p.name);}else picks.add(id);store();render();}
    else if(b.hasAttribute('data-photo-retry') && !busy){ownPlaces().forEach(p=>{attempted.delete(p.wiki);photos.delete(p.wiki);});render();}
  });
  root.addEventListener('error',ev=>{
    const img=ev.target;if(img.tagName!=='IMG'||img.dataset.failed)return;
    img.dataset.failed='true';img.hidden=true;img.parentElement.insertAdjacentHTML('afterbegin','<div class="tour-placeholder">사진 준비 중</div>');
  },true);
  window.TripTour=Object.freeze({
    get:()=>ownCandidates().filter(isPicked).map(p=>({id:p.id,name:p.name,city:p.city,category:p.category,mapURL:mapURL(p),sourceURL:wikiURL(p)})),
    setPicked(city,name,selected){const p=all.find(p=>p.city===city&&p.name===name);if(!p)return;selected?picks.add(p.id):picks.delete(p.id);store();render();},
    clear(city){all.filter(p=>p.city===city).forEach(p=>picks.delete(p.id));store();render();},
    summaryText:()=>{const count=ownCandidates().filter(isPicked).length;return count?` · 담은 후보 ${count}개`:'';},
    filterText:()=>category==='전체'?'모든 테마':category
  });
  window.TripTourPhotos=Object.freeze({get:(city,name)=>{const p=all.find(p=>p.city===city&&p.name===name),photo=p&&photos.get(p.wiki);return photo?{...photo}:null;}});
  // 인계서의 기존 연동 인터페이스와 호환. 추천 모듈의 실제 담기 상태만 읽는다.
  window.TripTrend=Object.freeze({get:()=>({mode,picks:all.filter(p=>picks.has(p.id)).map(p=>p.city+'|'+p.name)}),setMode});
  document.addEventListener('triptour:change',()=>document.dispatchEvent(new CustomEvent('triptrend:change')));
  document.addEventListener('tripcontext:change',render);
  document.addEventListener('tripcourse:change',render);
  document.addEventListener('triptabs:change',hydratePhotos);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render,{once:true});else render();
})();

</script>
