<script id="tour-reels-ui">
/* 장소 사진과 기존 관광 후보로 만드는 숏폼 탐색 제안.
 * 영상·재생 시간·조회수를 생성하지 않으며, 외부 API를 호출하지 않는다.
 * 실제 영상은 사용자가 YouTube 검색 링크를 열어 찾아본다.
 * 담기는 TripTour.setPicked만 사용하여 기존 일정·예산 저장 흐름을 따른다.
 */
(() => {
  'use strict';
  const root = document.getElementById('tour-reels-root');
  if (!root) return;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const THEMES = [
    {id:'night', label:'야경·사진', icon:'✦', title:'빛을 따라, 사진 한 장', desc:'전망과 도시 풍경을 담을 장소를 살펴봐요.', query:'야경 사진'},
    {id:'local', label:'로컬 먹거리', icon:'♨', title:'골목에서 만나는 현지의 맛', desc:'시장·상점가와 주변 동네를 영상으로 탐색해요.', query:'시장 로컬 음식'},
    {id:'walk', label:'산책·힐링', icon:'❋', title:'천천히 걸으며 쉬어가는 하루', desc:'공원과 산책길, 여유로운 풍경을 찾아봐요.', query:'산책 힐링'}
  ];
  let courseData = {cities:{}};
  try { courseData = JSON.parse(document.getElementById('course-data')?.textContent || '{}'); } catch (_) {}
  let city = '', filter = 'all', openTheme = '', selected = new Set(), status = '', adding = false, queued = false;

  const contextCity = () => {
    try { return String(window.TripContext?.().dest || '').trim(); } catch (_) { return ''; }
  };
  function poolFor(destination) {
    const catalog = window.GonsangTourCatalog || {}, extras = window.GonsangTourExtras || {};
    if (!Object.hasOwn(catalog, destination)) return [];
    const coursePlaces = courseData.cities?.[destination]?.places;
    if (!Array.isArray(coursePlaces)) return [];
    const eligible = new Set(coursePlaces.filter(p => p && typeof p.name === 'string' && Number.isFinite(p.lat) && Number.isFinite(p.lng)).map(p => p.name));
    const seen = new Set();
    return [...(catalog[destination] || []), ...(extras[destination] || [])].filter(p => {
      if (!p || p.city !== destination || typeof p.name !== 'string' || !eligible.has(p.name) || seen.has(p.name)) return false;
      seen.add(p.name); return true;
    });
  }
  function isPicked(place) {
    try {
      return window.TripCourse?.contains?.(place.city, place.name) === true ||
        (window.TripTour?.get?.() || []).some(p => p.city === place.city && p.name === place.name);
    } catch (_) { return false; }
  }
  function themeScore(place, theme) {
    const category = place.category || '', name = place.name;
    if (theme === 'night') return (category === '전망' ? 9 : category === '명소' ? 5 : category === '산책' ? 3 : 1) + (/타워|스카이|브리지|워터|마리나|하버|피크|베이/.test(name) ? 3 : 0);
    if (theme === 'local') return (category === '쇼핑' ? 8 : category === '산책' ? 4 : category === '명소' ? 2 : 0) + (/시장|마켓|골목|거리|차이나타운|리틀 인디아|바자르|워터프런트|커낼시티|라르코마르|코번트 가든|시먼딩|기온|나카스|도톤보리|신세카이|쓰키지/.test(name) ? 5 : 0);
    return category === '산책' ? 9 : category === '자연' ? 8 : category === '역사' ? 4 : category === '명소' ? 3 : 1;
  }
  const placesFor = theme => poolFor(city).sort((a,b) => themeScore(b,theme.id) - themeScore(a,theme.id) || (Number(a.order) || 0) - (Number(b.order) || 0)).slice(0,3);
  function safeURL(value, hosts) {
    try {
      const url = new URL(String(value || ''));
      return url.protocol === 'https:' && hosts.includes(url.hostname) ? url.href : '';
    } catch (_) { return ''; }
  }
  function photoFor(place) {
    if (!place) return null;
    let photo;
    try { photo = window.TripTourPhotos?.get?.(place.city, place.name); } catch (_) {}
    if (!photo || !photo.author || !photo.license) return null;
    const url = safeURL(photo.url, ['upload.wikimedia.org','thumb.wikimedia.org']);
    const source = safeURL(photo.source, ['commons.wikimedia.org']);
    const licenseURL = safeURL(photo.licenseURL, ['creativecommons.org','www.gnu.org','commons.wikimedia.org']);
    return url && source && licenseURL ? {...photo,url,source,licenseURL} : null;
  }
  function searchURL(theme) {
    const url = new URL('https://www.youtube.com/results');
    url.searchParams.set('search_query', `${city} ${theme.query} YouTube Shorts`);
    return url.href;
  }
  function credit(photo, theme) {
    return photo ? `<p class="tr-credit">사진: ${esc(photo.author)} · <a href="${esc(photo.licenseURL)}" data-tr-focus="license-${theme.id}" target="_blank" rel="noopener noreferrer">${esc(photo.license)}</a> · <a href="${esc(photo.source)}" data-tr-focus="source-${theme.id}" target="_blank" rel="noopener noreferrer">원본</a></p>` : '<p class="tr-credit">장소 사진이 없으면 테마 일러스트로 표시해요.</p>';
  }
  function card(theme) {
    const places = placesFor(theme), photo = places.map(photoFor).find(Boolean), expanded = openTheme === theme.id;
    return `<article class="tr-card tr-${theme.id}"><div class="tr-poster"><div class="tr-art" aria-hidden="true"><span>${theme.icon}</span><i></i><b></b></div>${photo ? `<img class="tr-image" src="${esc(photo.url)}" alt="${esc(photo.article || places[0]?.name || city)} 관련 장소 사진" loading="lazy" referrerpolicy="no-referrer">` : ''}<div class="tr-shade"></div><span class="tr-badge">장소 기반 추천</span><div class="tr-copy"><span class="tr-theme">${esc(theme.label)}</span><h4>${esc(city)}<br>${esc(theme.title)}</h4><p>${esc(theme.desc)}</p><span class="tr-place-count">추천 후보 ${places.length}곳</span><button type="button" class="tr-open" data-tr-open="${theme.id}" data-tr-focus="open-${theme.id}" aria-expanded="${expanded}" aria-controls="tr-place-panel">${expanded ? '추천 장소 닫기 ↑' : '추천 장소 보기 ↗'}</button></div></div>${credit(photo, theme)}<a class="tr-youtube" data-tr-focus="youtube-${theme.id}" href="${esc(searchURL(theme))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(city+' '+theme.label+' YouTube Shorts 검색 · 새 창')}">YouTube에서 영상 찾아보기 ↗</a></article>`;
  }
  function detail(theme) {
    const places = placesFor(theme), selectable = places.filter(p => !isPicked(p));
    const chosen = selectable.filter(p => selected.has(p.name)).length;
    return `<section id="tr-place-panel" class="tr-detail" aria-label="${esc(city+' '+theme.label+' 추천 장소 선택')}"><div class="tr-detail-head"><div><span class="tr-detail-kicker">${esc(city)} · ${esc(theme.label)}</span><h4>영상 탐색과 함께 살펴볼 장소</h4></div><button type="button" class="tr-close" data-tr-close data-tr-focus="close" aria-label="추천 장소 상세 닫기">✕</button></div><p>이 목록은 기존 관광 후보를 테마별로 묶은 제안이며, 특정 영상에 등장하는 장소를 확인한 목록은 아니에요.${theme.id === 'local' ? ' 실제 식당·메뉴 정보 대신 시장·상점가 등 주변 관광지를 출발점으로 제안해요.' : ''}</p><fieldset><legend>일정에 추가할 장소 선택 · 최대 3곳</legend>${places.map((p,i) => {
      const picked = isPicked(p);
      return `<label class="tr-place${picked?' tr-picked':''}"><input type="checkbox" data-tr-place="${esc(p.name)}" data-tr-focus="place-${theme.id}-${i}" ${picked || selected.has(p.name) ? 'checked' : ''} ${picked ? 'disabled' : ''}><span><b>${esc(p.name)}</b><small>${esc(p.category || '관광')} · ${picked ? '이미 내 일정에 담음' : '기존 관광 후보'}</small></span>${picked ? '<em>담음 ✓</em>' : ''}</label>`;
    }).join('')}</fieldset><div class="tr-detail-actions"><button type="button" class="tr-add" data-tr-add data-tr-focus="add" ${!chosen || adding || !window.TripTour?.setPicked ? 'disabled' : ''}>${chosen ? '선택 장소 '+chosen+'곳 내 일정에 담기' : selectable.length ? '장소를 선택해 주세요' : '모두 내 일정에 담았어요 ✓'}</button><button type="button" class="tr-scroll" data-tr-scroll data-tr-focus="scroll">아래 추천 일정 보기 ↓</button></div><p class="tr-footnote">이미 담은 장소는 중복 추가하지 않아요. 담은 장소의 삭제와 날짜 조정은 아래 ‘내 일정’에서 해주세요.</p></section>`;
  }
  function render() {
    const focusKey = root.contains(document.activeElement) ? document.activeElement.dataset?.trFocus : '';
    const listScroll = root.querySelector('.tr-list')?.scrollLeft || 0;
    const nextCity = contextCity();
    if (nextCity !== city) { city = nextCity; filter = 'all'; openTheme = ''; selected.clear(); status = ''; }
    const pool = poolFor(city), visible = THEMES.filter(theme => filter === 'all' || filter === theme.id);
    root.innerHTML = `<div class="tr-heading"><div><span class="tr-kicker">TRAVEL IN SHORTS</span><h3>${city ? esc(city)+' 여행, 짧은 영상으로 미리 보기' : '여행지를 고르고, 영상으로 미리 보기'}</h3></div><span class="tr-kind-label">장소 기반 추천</span></div><p class="tr-intro">카드 이미지는 장소 사진이며 실제 영상은 YouTube에서 찾아볼 수 있어요.</p>${pool.length ? `<div class="tr-filters" role="group" aria-label="여행 영상 탐색 테마"><button type="button" data-tr-filter="all" data-tr-focus="filter-all" aria-pressed="${filter==='all'}">전체</button>${THEMES.map(theme => `<button type="button" data-tr-filter="${theme.id}" data-tr-focus="filter-${theme.id}" aria-pressed="${filter===theme.id}">${esc(theme.label)}</button>`).join('')}</div><div class="tr-list">${visible.map(card).join('')}</div>${openTheme ? detail(THEMES.find(theme => theme.id === openTheme)) : ''}<p class="tr-note">관광 후보를 바탕으로 만든 탐색 제안이에요. 영상·실시간 인기 순위를 제공하는 기능은 아니며, 추천 장소와 실제 영상 내용은 다를 수 있어요.</p>` : `<div class="tr-empty">${city ? '이 여행지의 영상 탐색용 장소 후보를 준비 중이에요.' : '상단에서 여행지를 선택하면 해당 도시의 야경·먹거리·산책 영상을 찾아볼 수 있어요.'}</div>`}<p class="tr-status" role="status" aria-live="polite" aria-atomic="true">${esc(status)}</p>`;
    const list = root.querySelector('.tr-list'); if (list) list.scrollLeft = listScroll;
    if (focusKey) {
      const target = [...root.querySelectorAll('[data-tr-focus]')].find(el => el.dataset.trFocus === focusKey && !el.disabled);
      (target || (focusKey === 'add' ? root.querySelector('[data-tr-scroll]') : null))?.focus({preventScroll:true});
    }
  }
  function schedule() {
    if (adding || queued) return;
    queued = true;
    queueMicrotask(() => { queued = false; render(); });
  }
  root.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || !root.contains(button) || button.disabled) return;
    if (button.hasAttribute('data-tr-filter')) {
      const value = button.dataset.trFilter;
      if (value !== 'all' && !THEMES.some(theme => theme.id === value)) return;
      filter = value; openTheme = ''; selected.clear(); status = ''; render();
    } else if (button.hasAttribute('data-tr-open')) {
      const theme = THEMES.find(item => item.id === button.dataset.trOpen);
      if (!theme) return;
      if (openTheme === theme.id) { openTheme = ''; selected.clear(); }
      else { openTheme = theme.id; selected = new Set(placesFor(theme).filter(p => !isPicked(p)).map(p => p.name)); }
      status = ''; render();
      if (openTheme) root.querySelector('#tr-place-panel')?.scrollIntoView({behavior:window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches ? 'auto' : 'smooth',block:'nearest'});
    } else if (button.hasAttribute('data-tr-close')) {
      const oldTheme = openTheme; openTheme = ''; selected.clear(); render();
      [...root.querySelectorAll('[data-tr-open]')].find(el => el.dataset.trOpen === oldTheme)?.focus({preventScroll:true});
    } else if (button.hasAttribute('data-tr-scroll')) {
      const course = document.getElementById('course-root');
      if (course) { course.scrollIntoView({behavior:window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',block:'start'}); }
    } else if (button.hasAttribute('data-tr-add')) {
      const theme = THEMES.find(item => item.id === openTheme);
      if (!theme || contextCity() !== city || !window.TripTour?.setPicked) { schedule(); return; }
      const names = placesFor(theme).filter(p => selected.has(p.name) && !isPicked(p)).slice(0,3);
      adding = true; let added = 0;
      try {
        for (const place of names) { window.TripTour.setPicked(city,place.name,true); if (isPicked(place)) { added++; selected.delete(place.name); } }
        status = added ? `${added}곳을 내 일정에 담았어요. 아래 추천 일정과 내 일정에서 확인하세요.` : '선택한 장소는 이미 내 일정에 담겨 있어요.';
      } catch (_) { status = added ? `${added}곳을 담았어요. 나머지는 아래 내 일정에서 확인해 주세요.` : '지금은 장소를 담지 못했어요. 위 관광 목록에서 다시 시도해 주세요.'; }
      finally { adding = false; render(); }
    }
  });
  root.addEventListener('change', event => {
    const input = event.target.closest('input[data-tr-place]');
    if (!input || !root.contains(input)) return;
    const theme = THEMES.find(item => item.id === openTheme);
    const place = theme && placesFor(theme).find(p => p.name === input.dataset.trPlace);
    if (!place || isPicked(place)) return;
    if (input.checked && selected.size < 3) selected.add(place.name); else selected.delete(place.name);
    status = ''; render();
  });
  root.addEventListener('error', event => {
    const img = event.target;
    if (img instanceof HTMLImageElement && img.classList.contains('tr-image')) img.remove();
  },true);
  const style = document.createElement('style');
  style.textContent = `
    #tour-reels-root{container-type:inline-size;max-width:100%;min-width:0;margin-top:28px;padding:24px 0 4px;border-top:1px solid #e2e9e4;color:#223a2e}
    #tour-reels-root *{box-sizing:border-box}
    #tour-reels-root .tr-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
    #tour-reels-root .tr-kicker{color:#1d735a;font-size:10px;font-weight:850;letter-spacing:1.3px}
    #tour-reels-root h3{font-size:24px;line-height:1.5;margin:7px 0;letter-spacing:-.7px;word-break:keep-all}
    #tour-reels-root .tr-kind-label{flex:none;background:#e6f1e9;color:#1d735a;padding:6px 9px;border-radius:7px;font-size:10px;font-weight:800;margin-top:3px}
    #tour-reels-root .tr-intro,#tour-reels-root .tr-note{font-size:12px;line-height:1.8;color:#6a786e;margin:6px 0 15px}
    #tour-reels-root .tr-filters{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
    #tour-reels-root button{font:inherit;cursor:pointer}
    #tour-reels-root .tr-filters button{padding:8px 12px;border-radius:999px;background:white;border:1px solid #d9e3dc;color:#52665a;font-size:12px;font-weight:700}
    #tour-reels-root .tr-filters button[aria-pressed=true]{background:#1d735a;color:#fff;border-color:#1d735a}
    #tour-reels-root .tr-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;max-width:100%;min-width:0}
    #tour-reels-root .tr-card{min-width:0}
    #tour-reels-root .tr-poster{position:relative;aspect-ratio:9/16;overflow:hidden;border-radius:17px;background:#1b493b;isolation:isolate}
    #tour-reels-root .tr-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
    #tour-reels-root .tr-art{position:absolute;inset:0;overflow:hidden;background:linear-gradient(145deg,#345a70,#173734 60%,#091c27);z-index:-3}

    const p = D.profile(query.city), people = query.guests.adult + query.guests.child + query.guests.infant;

      <p class="fd-note">실제 예약이 불가능한 시연용 운임입니다. 항공사·시간·수하물 조합은 모두 가상이며, 각 공항 현지 시각으로 표시합니다.${query.city === '교토' ? ' 교토는 간사이공항(KIX) 도착 후 육로 이동이 필요합니다.' : ''}</p>
      <p class="fd-stale" id="fd-stale" hidden>상단 조건이 변경됐어요. ‘항공권 조회’를 다시 눌러 새 조건을 적용해 주세요.</p>
      <div class="fd-toolbar"><strong id="fd-count" role="status"></strong><div class="fd-tools"><button class="fd-link" data-action="calendar" aria-expanded="false">날짜별 최저가</button><button class="fd-link" data-action="explore" aria-expanded="false">지역별 운임 탐색</button></div></div>
      <div id="fd-calendar" class="fd-calendar" hidden></div>
      <section id="fd-explore" class="fd-explore" hidden><strong style="font-size:13px">다음 여행지는 어디로 갈까요?</strong><p class="fd-sub">일반석 성인 1인의 ${e(query.type)} 모의 기준가 · 도시를 누르면 현재 일정으로 검색합니다.</p><label for="fd-region" class="fd-sub">지역 선택 </label><select id="fd-region"><option value="all">모든 지역</option>${[...new Set(D.profiles.map(p=>p.region))].map(region=>`<option>${e(region)}</option>`).join('')}</select><div id="fd-cities" class="fd-cities"></div></section>
      <div id="fd-selection" class="fd-selection" hidden></div>
      <div class="fd-layout"><aside class="fd-filters" aria-label="항공권 필터"><h4>원하는 항공편만</h4><button class="fd-link" data-action="reset">필터 초기화</button>
        <fieldset class="fd-filter-group"><legend>경유</legend>${[0,1,2].map(stops=>{const items=offers.filter(item=>item.stops===stops);return `<label class="fd-check"><input type="checkbox" data-filter="stops" value="${stops}" ${items.length?'checked':'disabled'}><span>${stops===0?'직항':stops===1?'1회 경유':'2회 이상 경유'}<small>${items.length?`${money(Math.min(...items.map(item=>item.price)))}부터`:'해당 없음'}</small></span></label>`;}).join('')}</fieldset>
        ${timeControls('out','가는 편 출발 시간')}${query.type==='왕복'?timeControls('in','오는 편 출발 시간'):''}
        <fieldset class="fd-filter-group"><legend>가는 편 최대 소요시간</legend><output class="fd-time-label" id="fd-duration"></output>${rangeControl('maxDuration','최대 시간',filters.maxDuration,filters.maxDuration,15)}</fieldset>
        <fieldset class="fd-filter-group"><legend>성인 1인 가격 상한</legend><output class="fd-time-label" id="fd-price-limit"></output>${rangeControl('maxPrice','최대 운임',filters.maxPrice,filters.maxPrice,10000)}</fieldset>
        <fieldset class="fd-filter-group"><legend>추가 조건</legend><label class="fd-check"><input type="checkbox" data-filter="baggage">위탁수하물 포함</label><label class="fd-check"><input type="checkbox" data-filter="favorites">관심 항공편만</label></fieldset>
        <fieldset class="fd-filter-group"><legend>항공사</legend>${filters.airlines.map(name=>`<label class="fd-check"><input type="checkbox" data-filter="airlines" value="${e(name)}" checked>${e(name)}</label>`).join('')}</fieldset>
      </aside><div><div class="fd-sort" id="fd-sort" aria-label="항공편 정렬"></div><p id="fd-stat" class="fd-sub" style="margin-bottom:12px"></p><div class="fd-list" id="fd-list" aria-live="polite"></div></div></div>
      <details class="fd-provenance"><summary>가데이터와 가격 참고 기준</summary><p>2026-10-15 공개 노선 페이지를 참고해 넓은 가격대를 수동 설정했습니다. ${e(p.region)} ${e(query.city)}의 일반석 왕복 기준은 ${money(p.low)}~${money(p.high)}이며, 편도 기준은 ${money(regionLow)}부터 가정했습니다. 날짜·좌석·공항별 가중치는 시연용 규칙입니다. 실제 시장 평균이나 조회한 날짜의 판매가격이 아닙니다.</p><p>참고 노선: <a href="https://www.skyscanner.co.kr/routes/sela/tyoa/seoul-to-tokyo.html" target="_blank" rel="noopener">서울–도쿄</a> · <a href="https://www.skyscanner.co.kr/routes/sela/bkkt/seoul-to-bangkok.html" target="_blank" rel="noopener">방콕</a> · <a href="https://www.skyscanner.co.kr/routes/sela/lond/seoul-to-london.html" target="_blank" rel="noopener">런던</a> · <a href="https://www.skyscanner.co.kr/routes/sela/nyca/seoul-to-new-york.html" target="_blank" rel="noopener">뉴욕</a> · <a href="https://www.skyscanner.co.kr/routes/sela/syd/seoul-to-sydney.html" target="_blank" rel="noopener">시드니</a>. 다른 도시의 가격대는 이 지역별 차이를 참고한 시연용 추정값입니다.</p></details>`;
    updateFilterLabels(); paint();
  }
  function legHtml(leg, title) {
    const offset = leg.dayOffset ? `<sup>${leg.dayOffset>0?'+':''}${leg.dayOffset}일</sup>` : '';
    return `<div class="fd-leg-label">${title} · ${e(dateLabel(leg.date))}</div><div class="fd-leg"><div class="fd-leg-time"><strong>${e(leg.depart)}</strong><small>${e(leg.origin)}</small></div><div class="fd-flight-path">${duration(leg.minutes)}<i></i><em>${leg.stops ? `${leg.stops}회 경유 · ${e(leg.via)}` : '직항'}</em></div><div class="fd-leg-time"><strong>${e(leg.arrive)}${offset}</strong><small>${e(leg.destination)}</small></div></div>`;
  }
  function cardHtml(offer, index) {
    const chosen = selected?.offer?.id === offer.id, liked = favorites.has(offer.id), people = query.guests.adult + query.guests.child + query.guests.infant;
    const tag = sort==='cheap'?'최저가 후보':sort==='fast'?'최단시간 후보':'추천 후보';
    return `<article class="fd-card${chosen?' fd-selected':''}"><div class="fd-card-top"><div class="fd-airline"><span class="fd-logo" aria-hidden="true">${e(offer.airline.slice(0,2))}</span>${e(offer.airline)}${index===0?`<span class="fd-tag">${tag}</span>`:''}</div><button class="fd-heart" data-action="favorite" data-id="${offer.id}" aria-label="${e(offer.airline)} 관심 항공편 ${liked?'해제':'저장'}" aria-pressed="${liked}">${liked?'♥':'♡'}</button></div>
      ${legHtml(offer.outbound,'가는 편')}${offer.inbound?legHtml(offer.inbound,'오는 편'):''}
      <div class="fd-price"><div><small>성인 1인 · ${e(query.type)}</small><strong>${money(offer.price)}</strong><small>총 ${people}명 ${money(offer.groupPrice)}</small></div><button class="fd-btn" data-action="select" data-id="${offer.id}">${chosen?'선택됨 ✓':'후보로 선택 →'}</button></div>
      <details class="fd-details"><summary>모의 운임 상세</summary><div>${e(offer.cabin)} · 기내수하물 7kg 가정 · ${offer.baggage?'위탁수하물 15kg 포함 가정':'위탁수하물 별도 가정'}<br>세금 포함을 가정한 총액입니다. 어린이 75%, 유아 10% 요율은 시연 계산용이며 실제 항공사 규정이 아닙니다. 예약·발권은 진행되지 않습니다.</div></details></article>`;
  }
  function sorted(items, order) {
    return [...items].sort((a,b)=>order==='cheap'?a.price-b.price:order==='fast'?a.duration-b.duration:a.recommendation-b.recommendation || a.price-b.price);
  }
  function paint() {
    let visible = D.filterOffers(offers,filters); if (favoriteOnly) visible = visible.filter(item=>favorites.has(item.id));
    $('#fd-count').textContent = `${visible.length} / ${offers.length}개 모의 항공편`;
    $('#fd-sort').innerHTML = [['best','추천순'],['cheap','최저가'],['fast','최단시간']].map(([order,label])=>{
      const best = sorted(visible,order)[0]; return `<button data-action="sort" data-sort="${order}" aria-pressed="${sort===order}"><span>${label}</span><b>${best?money(best.price):'—'}</b><small>${best?`${duration(best.outbound.minutes)} · 가는 편`:'조건을 조정해 주세요'}</small></button>`;
    }).join('');
    $('#fd-stat').textContent = visible.length ? `모의 결과 평균 ${money(visible.reduce((sum,item)=>sum+item.price,0)/visible.length)} · 성인 1인 ${query.type} 기준` : '현재 필터에 맞는 모의 항공편이 없습니다.';
    $('#fd-list').innerHTML = visible.length ? sorted(visible,sort).map(cardHtml).join('') : '<div class="fd-intro"><h3>조건에 맞는 항공편이 없어요</h3><p>시간대나 경유 조건을 넓혀 보세요.</p><button class="fd-btn" data-action="reset">필터 초기화</button></div>';
    const selection = $('#fd-selection'); selection.hidden = !selected;
    if (selected) selection.innerHTML = `<strong>✓ 여행 후보에 담았어요</strong>${e(selected.offer.airline)} · ${money(selected.offer.price)} / 성인 1인 · 전체 ${money(selected.offer.groupPrice)}<br>이 선택은 가데이터 후보로 브라우저에 저장됩니다.`;
  }
  function updateFilterLabels() {
    for (const prefix of ['out','in']) {
      const label = $(`#fd-time-${prefix}`); if (label) label.textContent = `${String(filters[`${prefix}Min`]).padStart(2,'0')}:00 ~ ${String(filters[`${prefix}Max`]).padStart(2,'0')}:59`;
      for (const suffix of ['Min','Max']) { const output=$(`#fd-value-${prefix}${suffix}`); if(output) output.textContent=`${filters[`${prefix}${suffix}`]}시`; }
    }
    $('#fd-duration').textContent = duration(filters.maxDuration); $('#fd-price-limit').textContent = money(filters.maxPrice);
  }
  function updateFilter(input) {
    const name=input.dataset.filter; if (!name || !query) return;
    if (name==='stops'||name==='airlines') filters[name]=Array.from(root.querySelectorAll(`[data-filter="${name}"]:checked`)).map(el=>name==='stops'?Number(el.value):el.value);
    else if(name==='baggage') filters.baggage=input.checked;
    else if(name==='favorites') favoriteOnly=input.checked;
    else {
      filters[name]=Number(input.value);
      for (const prefix of ['out','in']) if (filters[`${prefix}Min`]>filters[`${prefix}Max`]) {
        const other=name.endsWith('Min')?`${prefix}Max`:`${prefix}Min`;
        filters[other]=filters[name]; const element=$(`#fd-${other}`); if(element)element.value=String(filters[other]);
      }
    }
    updateFilterLabels(); paint();
  }
  function paintExplore(region='all') {
    $('#fd-cities').innerHTML = D.profiles.filter(p=>region==='all'||p.region===region).map(p=>{
      const offersForCity=D.buildOffers({...query,city:p.city,cabin:'일반석'}), low=offersForCity.length?Math.min(...offersForCity.map(offer=>offer.price)):null;
      return `<button class="fd-city" data-action="destination" data-city="${e(p.city)}"><b>${e(p.city)} <small>${e(p.airport)}</small></b><span>${low?`${money(low)}부터`:'일정 조정 필요'}</span></button>`;
    }).join('');
  }
  function search(input) {
    try {
      query=D.normalize(input); offers=D.buildOffers(query); if(!offers.length)throw Error('왕복 비행시간에 비해 일정이 짧아요. 오는 날짜를 늦춰 다시 조회해 주세요.');sort='best';resetFilters();
      const previous=load('gonsang-flight-selection-v1',null); selected=previous?.query && keyOf(previous.query)===keyOf(query)?previous:null;
      // 예산 연동: 같은 조건의 선택이 복원되면 항공 금액을 다시 채우고, 아니면 비운다.
      document.dispatchEvent(new CustomEvent(selected?'tripflight:select':'tripflight:deselect',{detail:selected}));
      renderFrame(); root.scrollIntoView({behavior:'smooth',block:'start'});
    } catch(error) { root.innerHTML=`<div class="fd-intro"><span class="fd-chip">DEMO</span><h3>검색 조건을 확인해 주세요</h3><p role="status">${e(error.message)}</p></div>`; }
  }
  root.addEventListener('input',event=>{if(event.target.type==='range')updateFilter(event.target)});
  root.addEventListener('change',event=>{if(event.target.id==='fd-region')paintExplore(event.target.value);else if(event.target.type!=='range')updateFilter(event.target)});
  root.addEventListener('click',event=>{
    const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
    const action=button.dataset.action;
    if(action==='example'){document.dispatchEvent(new CustomEvent('tripflight:example'));return;}
    if(!query)return;
    if(action==='sort'){sort=button.dataset.sort;paint();}
    if(action==='reset'){resetFilters();renderFrame();}
    if(action==='calendar'){
      const calendar=$('#fd-calendar');calendar.hidden=!calendar.hidden;button.setAttribute('aria-expanded',String(!calendar.hidden));
      if(!calendar.hidden)calendar.innerHTML=D.calendar(query).map(day=>`<button class="fd-date" data-action="date" data-start="${day.start}" data-end="${day.end}" aria-pressed="${day.start===query.start}" ${day.disabled?'disabled':''}><span>${e(dateLabel(day.start))}</span><b>${day.price?money(day.price):'결과 없음'}</b></button>`).join('');
    }
    if(action==='explore'){const panel=$('#fd-explore');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)paintExplore($('#fd-region').value);}
    if(action==='date')document.dispatchEvent(new CustomEvent('tripflight:dateschange',{detail:{start:button.dataset.start,end:button.dataset.end}}));
    if(action==='destination')document.dispatchEvent(new CustomEvent('tripflight:destination',{detail:{city:button.dataset.city}}));
    if(action==='favorite'){const id=button.dataset.id;favorites.has(id)?favorites.delete(id):favorites.add(id);save('gonsang-flight-favorites-v1',[...favorites]);paint();}
    if(action==='select'){
      const offer=offers.find(item=>item.id===button.dataset.id);if(!offer)return;
      // Future budget adapter: amountKrw is the entire party total; offer.price is one adult.
      // Listen for tripflight:select separately when the budget team is ready to integrate.
      selected={version:1,source:'demo',currency:'KRW',query,offer,amountKrw:offer.groupPrice,updatedAt:new Date().toISOString()};
      save('gonsang-flight-selection-v1',selected);paint();document.dispatchEvent(new CustomEvent('tripflight:select',{detail:selected}));
    }
  });
  window.FlightDemo=Object.freeze({search,updateConditions(input){if(!query||!$('#fd-stale'))return;$('#fd-stale').hidden=keyOf(query)===keyOf(input);}});
  root.innerHTML='<div class="fd-intro"><span class="fd-chip">OFFLINE FLIGHT DEMO</span><h3>내 조건에 맞는 항공편을 비교해 보세요</h3><p>상단에서 도시·날짜·인원을 고르고 조회하면<br>이곳에 직항·경유 항공편과 모의 운임이 펼쳐집니다.</p><button class="fd-btn fd-light" data-action="example">도쿄 예시 조건으로 살펴보기 →</button></div>';
})();
</script>

  let contSel = '전체';

  const today = new Date(); today.setHours(0,0,0,0);

  /* ---------- 렌더 ---------- */
  function renderSummary() {
    const o = state.opts, j = a => (a && a.length ? a.join(', ') : '상관없음');
    const rows = [
      ['여행지', state.dest || '미정'],
      ['날짜', state.start ? (state.end ? `${fmtLong(state.start)} ~ ${fmtLong(state.end)} (${nights()}박)` : `${fmtLong(state.start)} ~`) : '미정'],

  // 숙소 검색(stay.js)이 상단 선택값을 읽어 가는 통로
  window.TripContext = () => ({

    flight: { home:(air.from.match(/[A-Z]{3}/)||['SEL'])[0], type:air.type, reverse:air.reverse, cabin:(state.opts.airClass || ['일반석'])[0] }
  });
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  // 관광 코스: 최종 일정표에서 항목별 비용을 보여 줄 수 있도록 1인 참고 입장료(원)를 붙인다. 모르면 null.
  const courseForSave = () => {

    const data = { dest: state.dest, start: state.start && ymd(state.start),
      end: state.end && ymd(state.end), guests: state.guests, flight: air, budget: window.TripBudget ? window.TripBudget.get() : null, stay: window.StayFilter ? window.StayFilter.get() : null, tour:window.TripTour?.get() || [], course:courseForSave(), food:window.TripFood?.get?.() || null, options: state.opts };

  // 최종 일정 창: 저장한 조건을 trip-summary.html 이 읽어 일정·경비·체크리스트로 보여 준다
  const sumModal = $('#sumModal'), sumFrame = $('#sumFrame');

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sumModal.classList.contains('open')) closeSummary(); });
  window.addEventListener('message', e => {
    if (e.origin === location.origin && e.data && e.data.type === 'trip-summary:close') closeSummary();
  });

  renderCal(); renderGuest(); renderAll();
})();
</script>
</body>
</html>
