<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 조건 설정</title>
<style>
  :root{
    --bg:#fff; --ink:#222; --sub:#717171; --line:#ddd; --soft:#f7f7f7; --soft2:#ebebeb;
    --pink:#1d735a; --pink2:#155a46; --teal:#1d735a; --teal-d:#1d735a; --teal-soft:#e4f3ed; --lime:#d9f17c;
    --gray:#f0f1f0; --gray-d:#dfe2e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input{font:inherit}

  /* ===== 상단: Airbnb 스타일 ===== */
  .top{background:#fff;border-bottom:1px solid var(--line);padding:20px 16px 28px;position:relative}
  .top-head{max-width:1100px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;color:var(--pink);font-size:22px;letter-spacing:-.5px}
  .search-wrap{max-width:860px;margin:0 auto;position:relative}
  .search{display:flex;align-items:stretch;background:var(--soft2);border:1px solid var(--line);border-radius:999px;height:68px}
  .search.active{background:var(--soft2)}
  .seg{flex:1;text-align:left;padding:0 28px;border-radius:999px;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .seg:hover{background:#dedede}
  .seg.on{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .seg+.seg{position:relative}
  .seg small{font-size:12px;font-weight:700}
  .seg span{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg span.filled{color:var(--ink)}
  .go{display:flex;align-items:center;gap:6px;background:var(--pink);color:#fff;font-weight:700;border-radius:999px;margin:8px;padding:0 22px}
  .go:hover{background:var(--pink2)}
  .panel{position:absolute;top:78px;background:#fff;border-radius:32px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:24px;z-index:20;display:none}
  .panel.open{display:block}
  #p-dest{left:0;width:400px;max-height:420px;overflow:auto}
  #p-date{left:50%;transform:translateX(-50%);width:min(820px,94vw)}
  #p-guest{right:0;width:380px}
  .panel h4{margin:0 0 10px;font-size:12px;font-weight:600}
  .dest{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:12px}
  .dest:hover{background:var(--soft)}
  .dest i{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:24px;background:#fdecec}
  .dest b{display:block;font-size:15px}
  .dest em{font-style:normal;font-size:13px;color:var(--sub)}
  .dest-input{width:100%;border:0;outline:0;background:transparent;font-size:14px;padding:0}
  .dest-row{display:flex;align-items:center;gap:6px}
  .dest-x{width:22px;height:22px;flex:none;border-radius:50%;background:#d8d8d8;color:#fff;font-size:11px;display:grid;place-items:center;cursor:pointer}
  .dest-x:hover{background:var(--teal-d)}
  .dest-x[hidden]{display:none}

  /* 달력 */
  .cal-wrap{display:flex;gap:40px;justify-content:center;position:relative}
  .cal{flex:1;min-width:0}
  .cal h5{text-align:center;margin:6px 0 14px;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
  .grid .dow{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
  .day{aspect-ratio:1;border-radius:50%;font-size:14px;font-weight:600;display:grid;place-items:center}
  .day:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--ink)}
  .day:disabled{color:#c8c8c8;cursor:default;font-weight:400;text-decoration:line-through}
  .day.in{background:var(--soft2);border-radius:0}
  .day.edge{background:var(--ink);color:#fff}
  .nav{position:absolute;top:0;width:32px;height:32px;border-radius:50%;font-size:18px}
  .nav:hover{background:var(--soft2)}
  .nav.l{left:0}.nav.r{right:0}
  .nav:disabled{opacity:.25;cursor:default}
  .cal-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
  .link{text-decoration:underline;font-weight:600;color:var(--ink)}

  /* 게스트 */
  .row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--soft2)}
  .row:last-child{border-bottom:0}
  .row b{display:block;font-size:16px}
  .row em{font-style:normal;color:var(--sub);font-size:14px}
  .step{display:flex;align-items:center;gap:14px}
  .step button{width:32px;height:32px;border-radius:50%;border:1px solid #b0b0b0;font-size:18px;line-height:1}
  .step button:hover:not(:disabled){border-color:var(--ink)}
  .step button:disabled{opacity:.3;cursor:default}
  .step span{width:20px;text-align:center}

  /* ===== 하단: 트리플 스타일 ===== */
  /* 하단 영역: 탭 바는 화면 끝에서 끝까지, 본문(조회 결과)은 넓게 + 오른쪽 예산 */
  .plan{margin:0 0 80px;padding:0;display:grid;grid-template-columns:minmax(16px,1fr) minmax(0,1060px) 340px minmax(16px,1fr);align-items:start}
  .main-col{display:contents}
  .tabs{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);background:var(--teal-d);margin-bottom:24px}
  .tab{padding:18px 0 16px;background:none;border:0;border-bottom:4px solid transparent;color:rgba(255,255,255,.72);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px}
  .tab i{font-style:normal;font-size:22px}
  .tab:hover{color:#fff;background:rgba(255,255,255,.08)}
  .tab.on{color:#fff;border-bottom-color:#fff}
  .panes{grid-column:2;border:1px solid var(--line);border-radius:20px;background:#fff}
  .aside{grid-column:3;margin-left:24px;position:sticky;top:16px;background:var(--gray);border-radius:20px;padding:24px 22px 26px}
  .pane{display:none;padding:22px 24px 28px}
  .pane.on{display:block}
  .pane h3{margin:0 0 16px;font-size:17px}
  .field{margin-bottom:20px}
  .field>label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;background:#fff}
  .opt:hover{border-color:var(--teal-d)}
  .opt.on{background:var(--teal-soft);border-color:var(--teal-d);color:var(--teal-d)}
  .text{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px}
  .text:focus{outline:2px solid var(--teal);border-color:transparent}
  .range{width:100%;accent-color:var(--teal-d)}
  .range-val{font-weight:700;margin-left:6px;color:var(--ink)}
  .ftabs{display:flex;gap:6px;margin-bottom:14px}
  .ftab{padding:10px 20px;border-radius:999px;font-weight:700;color:#9db8af}
  .ftab.on{background:var(--teal-soft);color:var(--teal-d)}
  .fcard{position:relative;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:6px 0}
  .frow{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-right:70px;border-bottom:1px solid var(--soft2);cursor:pointer;font-weight:700;font-size:17px}
  .frow:last-child{border-bottom:0;margin-right:0}
  .frow:hover{background:var(--soft)}
  .frow i{font-style:normal;color:#aaa;width:22px;text-align:center}
  .frow .ph{color:#b5b5b5;font-weight:600}
  #fr-date,#fr-pax{margin-right:0}
  .swap{position:absolute;right:18px;top:50px;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#999;font-size:20px}
  .swap:hover{border-color:var(--teal-d);color:var(--teal-d)}
  .fgo{width:100%;margin-top:16px;padding:18px;border-radius:14px;background:var(--teal-d);color:#fff;font-weight:800;font-size:17px}
  .fgo:disabled{background:#bdbdbd;cursor:default}
  .fhint{margin:10px 2px 0;font-size:12px;color:var(--sub)}
  .conts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .cont{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700}
  .cont.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
  .grp{margin:10px 0 4px;font-size:12px;font-weight:800;color:var(--teal-d)}
  .summary{padding-top:6px}
  .summary h3{margin:0 0 10px;font-size:15px}
  .summary dl{margin:0;display:grid;grid-template-columns:52px 1fr;gap:6px 10px;font-size:13px}
  .summary dt{color:var(--sub)}
  .summary dd{margin:0;font-weight:600;word-break:keep-all}
  .save{display:block;width:100%;margin-top:18px;padding:15px;border-radius:14px;background:var(--teal-d);color:#fff;font-weight:700;font-size:16px}
  .save:hover{background:var(--pink2)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1}

  /* FLIGHT DEMO STYLE START — scoped to the air tab; no budget selectors. */
  #flight-demo-root{container-type:inline-size;container-name:flight-demo;margin-top:24px;color:#132d3d;scroll-margin-top:18px}
  #flight-demo-root [hidden]{display:none!important}
  #flight-demo-root button,#flight-demo-root select,#flight-demo-root input{font:inherit}
  #flight-demo-root button:focus-visible,#flight-demo-root a:focus-visible,#flight-demo-root input:focus-visible,#flight-demo-root select:focus-visible{outline:3px solid #73b7a3;outline-offset:3px}
  #flight-demo-root .fd-intro{border:1px dashed #adc8bd;border-radius:16px;padding:26px;background:#f5faf7;text-align:center}
  #flight-demo-root .fd-intro h3{margin:12px 0;font-size:21px}
  #flight-demo-root .fd-intro p{font-size:13px;color:#63766e;line-height:1.7}
  #flight-demo-root .fd-chip{display:inline-block;padding:5px 9px;border-radius:6px;background:#e2f2eb;color:#21604b;font-size:10px;font-weight:800;letter-spacing:.07em}
  #flight-demo-root .fd-btn{border:0;border-radius:9px;padding:11px 15px;background:#123d32;color:white;font-size:13px;font-weight:750;cursor:pointer}
  #flight-demo-root .fd-btn.fd-light{background:#e8f2ed;color:#1d735a}
  #flight-demo-root .fd-link{font-size:12px;color:#256a55;text-decoration:underline;cursor:pointer;padding:4px 0}
  #flight-demo-root .fd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  #flight-demo-root .fd-head h3{font-size:22px;margin:9px 0 5px;letter-spacing:-.7px}
  #flight-demo-root .fd-sub{font-size:12px;line-height:1.7;color:#65776f;margin:0}
  #flight-demo-root .fd-note{padding:10px 12px;border-radius:9px;background:#f1f5f2;font-size:11px;line-height:1.6;color:#65776f;margin:12px 0}
  #flight-demo-root .fd-stale{padding:12px;background:#fff4da;border-radius:9px;color:#7c581b;font-size:12px;margin-bottom:12px}
  #flight-demo-root .fd-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:14px 0}
  #flight-demo-root .fd-toolbar strong{font-size:13px}
  #flight-demo-root .fd-tools{display:flex;gap:12px}
  #flight-demo-root .fd-layout{display:grid;grid-template-columns:145px minmax(0,1fr);gap:14px;align-items:start}
  #flight-demo-root .fd-filters{padding:13px 12px;background:#f3f6f4;border-radius:12px}
  #flight-demo-root .fd-filters h4{font-size:13px;margin:0 0 12px}
  #flight-demo-root .fd-filter-group{margin:0;padding:14px 0;border:0;border-top:1px solid #dae3de;min-width:0}
  #flight-demo-root .fd-filter-group legend{font-size:12px;font-weight:800;padding-top:14px;margin-bottom:8px}
  #flight-demo-root .fd-check{display:flex;align-items:center;gap:6px;font-size:11px;margin:8px 0;line-height:1.5;cursor:pointer}
  #flight-demo-root .fd-check input{accent-color:#1d735a;flex:none;width:15px;height:15px;margin:0}
  #flight-demo-root .fd-check small{display:block;color:#7c8e85;font-size:10px}
  #flight-demo-root .fd-time-label{display:block;font-size:10px;line-height:1.7;color:#60766b;margin-bottom:6px}
  #flight-demo-root input[type=range]{width:100%;accent-color:#1d735a;display:block;margin:6px 0 9px}
  #flight-demo-root .fd-range-name{display:flex;justify-content:space-between;font-size:10px;color:#60766b}
  #flight-demo-root .fd-sort{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid #dae3de;border-radius:12px;overflow:hidden;margin-bottom:12px}
  #flight-demo-root .fd-sort button{padding:12px 8px;text-align:left;background:#fff;border-right:1px solid #dae3de;min-width:0}
  #flight-demo-root .fd-sort button:last-child{border:0}
  #flight-demo-root .fd-sort button[aria-pressed=true]{background:#113f34;color:white}
  #flight-demo-root .fd-sort span{display:block;font-size:11px;font-weight:700}
  #flight-demo-root .fd-sort b{display:block;font-size:16px;margin-top:5px;letter-spacing:-.5px}
  #flight-demo-root .fd-sort small{display:block;font-size:10px;opacity:.7;margin-top:3px}
  #flight-demo-root .fd-list{display:grid;gap:12px}
  #flight-demo-root .fd-card{border:1px solid #dce5df;border-radius:14px;background:white;box-shadow:0 3px 9px #152c1f07;overflow:hidden}
  #flight-demo-root .fd-card.fd-selected{border:2px solid #1d735a}
  #flight-demo-root .fd-card-top{padding:13px 14px 5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  #flight-demo-root .fd-airline{font-size:12px;font-weight:800;display:flex;align-items:center;gap:8px}
  #flight-demo-root .fd-logo{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#e3edf7;color:#2f587e;font-size:11px}
  #flight-demo-root .fd-heart{font-size:24px;line-height:1;padding:2px;color:#7d9289}
  #flight-demo-root .fd-heart[aria-pressed=true]{color:#d46a6a}
  #flight-demo-root .fd-tag{font-size:9px;border-radius:5px;padding:4px 6px;background:#e9f6ea;color:#397444;margin-left:5px}
  #flight-demo-root .fd-leg{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;align-items:center;padding:10px 15px}
  #flight-demo-root .fd-leg-time strong{font-size:21px;font-weight:600;letter-spacing:-.7px}
  #flight-demo-root .fd-leg-time small{display:block;font-size:11px;margin-top:3px;color:#71847a}
  #flight-demo-root .fd-leg-time:last-child{text-align:right}
  #flight-demo-root .fd-leg-time sup{font-size:10px;color:#1d735a;letter-spacing:0;margin-left:3px}
  #flight-demo-root .fd-flight-path{text-align:center;font-size:10px;color:#65776f}
  #flight-demo-root .fd-flight-path i{display:block;position:relative;border-top:1px solid #c8d3cd;margin:8px 0;font-style:normal}
  #flight-demo-root .fd-flight-path i:after{content:'✈';position:absolute;right:-2px;top:-10px;font-size:14px;color:#6e8b7e;background:#fff}
  #flight-demo-root .fd-flight-path em{font-style:normal;color:#2e7c66}
  #flight-demo-root .fd-leg-label{font-size:9px;color:#7c8e85;padding:3px 15px 0}
  #flight-demo-root .fd-price{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:#f5f8f6;border-top:1px solid #e5ebe7;margin-top:7px}
  #flight-demo-root .fd-price small{display:block;color:#75887e;font-size:10px;line-height:1.6}
  #flight-demo-root .fd-price strong{display:block;font-size:24px;letter-spacing:-.8px}
  #flight-demo-root .fd-price .fd-btn{white-space:nowrap}
  #flight-demo-root .fd-details{padding:9px 14px;font-size:11px;color:#65776f;line-height:1.8;border-top:1px solid #e5ebe7}
  #flight-demo-root .fd-details summary{cursor:pointer}
  #flight-demo-root .fd-selection{padding:13px;border-radius:10px;background:#e6f3eb;color:#1d6048;font-size:12px;line-height:1.8;margin:12px 0}
  #flight-demo-root .fd-selection strong{display:block}
  #flight-demo-root .fd-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}
  #flight-demo-root .fd-date{border:1px solid #dce5df;border-radius:8px;padding:10px 2px;text-align:center;background:#fff}
  #flight-demo-root .fd-date span{display:block;font-size:10px;color:#65776f}
  #flight-demo-root .fd-date b{display:block;font-size:11px;margin-top:5px}
  #flight-demo-root .fd-date[aria-pressed=true]{border-color:#1d735a;background:#e6f3eb}
  #flight-demo-root .fd-date:disabled{opacity:.35;cursor:default}
  #flight-demo-root .fd-explore{padding:14px;background:#f4f8f5;border:1px solid #dce5df;border-radius:12px;margin-bottom:14px}
  #flight-demo-root .fd-explore select{padding:7px;border:1px solid #c5d6ca;border-radius:7px;background:white;margin:8px 0 12px;font-size:12px}
  #flight-demo-root .fd-cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  #flight-demo-root .fd-city{text-align:left;padding:10px;border:1px solid #dce5df;background:#fff;border-radius:8px}
  #flight-demo-root .fd-city b{display:block;font-size:12px}
  #flight-demo-root .fd-city span{display:block;color:#2b795e;font-size:12px;margin-top:6px}
  #flight-demo-root .fd-provenance{font-size:11px;color:#6f8277;line-height:1.8;margin-top:15px}
  #flight-demo-root .fd-provenance a{color:#286b53}
  @container flight-demo (max-width:550px){
    #flight-demo-root .fd-layout{grid-template-columns:1fr}
    #flight-demo-root .fd-filters{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
    #flight-demo-root .fd-filters>h4,#flight-demo-root .fd-filters>button{grid-column:1/-1}
    #flight-demo-root .fd-sort b{font-size:15px}
    #flight-demo-root .fd-calendar{grid-template-columns:repeat(4,minmax(0,1fr))}
    #flight-demo-root .fd-cities{grid-template-columns:1fr 1fr}
  }
  /* FLIGHT DEMO STYLE END */


  /* 최종 일정 창 (trip-summary.html 을 iframe 으로 띄움) */
  .sum-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px}
  .sum-modal.open{display:flex}
  .sum-box{position:relative;width:min(1280px,100%);height:100%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .sum-box iframe{width:100%;height:100%;border:0;display:block}
  .sum-x{position:absolute;top:12px;right:14px;z-index:1;width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .sum-x:hover{border-color:var(--teal-d);color:var(--teal-d)}
  @media (max-width:760px){.sum-modal{padding:0}.sum-box{border-radius:0}}

  @media (max-width:760px){
    .search{flex-direction:column;border-radius:24px;height:auto}
    .seg{padding:12px 20px;border-radius:24px}
    .go{margin:8px;padding:14px;justify-content:center}
    .panel{position:static;transform:none!important;width:auto!important;margin-top:10px;max-height:none!important}
    .cal-wrap{flex-direction:column;gap:20px}
    .cal:nth-child(3){display:none}
    .plan{grid-template-columns:16px minmax(0,1fr) 16px}
    .aside{grid-column:2;margin:20px 0 0;position:static}
    .tab{font-size:15px;padding:14px 0 12px;gap:6px}
    .tab i{font-size:18px}
  }
  /* 항공 조회 결과가 작게 보이는 문제: 데스크톱에서 항공 데모 영역을 확대 (데모 CSS 는 건드리지 않음) */
  @media (min-width:900px){
    #flight-demo-root{zoom:1.2}
  }
</style>
</head>
<body>

<!-- ============ 상단 (5/1) : 여행지 · 날짜 · 여행자 ============ -->
<header class="top">
  <div class="top-head"><span class="logo">곤상플랜</span></div>
  <div class="search-wrap" id="searchWrap">
    <div class="search">
      <button class="seg" id="s-dest" type="button">
        <small>여행지</small>

    <script id="course-demo">
(() => {

  const dateOK=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;

  const rad=x=>x*Math.PI/180;

  function move(a,b){if(!a)return {minutes:0,kind:'',km:0};const km=distance(a,b),walking=km<=1.2;return {minutes:Math.max(5,Math.round((walking?km/4.5*60:km/20*60+10)/5)*5),kind:walking?'🚶 도보':'🚇 대중교통',km};}
  // NOAA fractional-year 근사식. 지형·기상·굴절 조건을 반영하지 않는 예상 일몰.
  function sunset(date,meta){
    const utc=Date.parse(date+'T00:00:00Z'),year=Number(date.slice(0,4));
    const ordinal=Math.floor((utc-Date.UTC(year,0,1))/864e5)+1,leap=new Date(Date.UTC(year,1,29)).getUTCMonth()===1;

  function pickedKeys(city){const keys=window.TripTrend?.get()?.picks || [];return new Set(keys.filter(k=>typeof k==='string'&&k.startsWith(city+'|')));}
  function calculate(){
    const ctx=window.TripContext?.()||{},city=(ctx.dest||'').trim(),mode=window.TripTrend?.get()?.mode==='old'?'old':'young';

    const dated=dateOK(ctx.start)&&dateOK(ctx.end)&&ctx.end>=ctx.start;

    const keys=pickedKeys(city);previousPicks.forEach(key=>{if(!keys.has(key))removedPicks.add(key);});keys.forEach(key=>removedPicks.delete(key));previousPicks=new Set(keys);const pool=meta.places.map(p=>({...p,picked:keys.has(city+'|'+p.name)}));
    const available=pool.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng));

        if(mode==='young'&&visits===2&&current+30<=finish){items.push({name:'☕ 근처 카페 직접 고르기',kind:'핫플',time:clock(current),minute:current,end:current+30,picked:false,synthetic:true,description:'이 구역에서 마음에 드는 카페를 찾아 쉬어가요. 실제 매장은 직접 선택하세요.'});current+=30;}
        if(p.outside){wentOutside=true;break;}
        // 앞쪽 장소 배치 후 일몰 후보를 다시 고려한다.
        available.filter(x=>x.sunset&&!used.has(x.id)).forEach(x=>rejected.delete(x.id));
      }
      if(last)items.push({name:'공항 이동',kind:'이동',time:clock(current),minute:current,end:current,picked:false,description:'공항 이동·수속 시간은 실제 항공편과 교통편에 맞춰 별도로 확보하세요.'});
      days.push({date,items,sunset:sun,area:anchor?.area||'자유일정',visits,start:begin,finish});
    }
    for(const key of keys){const p=pool.find(p=>key===city+'|'+p.name);if(!p||!used.has(p.id))unplaced.push({name:key.slice(city.length+1),reason:!p||!Number.isFinite(p.lat)?'확인된 좌표 없음':'방문·이동·휴식 시간을 고려한 일정 한도 초과'});}
    const souvenirs=pool.filter(p=>p.kind==='기념품'&&!p.picked);
    for(const day of days){for(const gift of souvenirs){const last=[...day.items].reverse().find(p=>p.area===gift.area&&!['휴식','이동'].includes(p.kind));if(last)last.gifts=[...(last.gifts||[]),gift.name];}}
    result={city,days,mode,seed,actualDays,dated,unplaced,pace,missing:meta.places.filter(p=>!Number.isFinite(p.lat)).map(p=>p.name),sourceCount:available.length};
    active=Math.min(active,days.length-1);paint();emit();
  }
  function emit(){document.dispatchEvent(new CustomEvent('tripcourse:change'));}
  function paint(){
    const r=result,day=r.days[active],old=r.mode==='old';root.classList.toggle('course-old',old);
    const support=()=>Object.keys(DATA.cities).map(c=>`<button type="button" data-course-city="${esc(c)}">${esc(c)}</button>`).join('');
    let h=`<div class="course-head"><div><span class="course-chip">DEMO · 직접 구성한 예시 코스</span><h3>🗓 ${esc(r.city||'나의 여행')} ${r.actualDays?`${r.actualDays-1}박 ${r.actualDays}일`:'추천'} 코스</h3><p>담은 곳과 모드에 맞춰 자동으로 짜여요</p></div><span class="course-mode">${old?'🍵 늙크크 · 쉬어가기':'🧃 영크크 · 활기차게'}</span></div>`;
    if(!day){root.innerHTML=h+`<div class="course-empty">${r.city?'이 여행지의 코스를 준비 중이에요.':'상단에서 여행지를 고르면 코스가 짜여요.'}<div class="course-supported">${support()}</div></div>`;return;}
    const label=date=>new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',weekday:'short',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'));
    if(!r.dated)h+='<p class="course-note">날짜를 고르면 일수에 맞춰 바뀌어요. 지금은 예시 2박 3일 코스입니다.</p>';
    if(r.actualDays>7)h+='<p class="course-note">최대 7일의 코스를 생성했어요. 8일 이후는 자유일정입니다.</p>';
    h+=`<div class="course-tabs" role="tablist" aria-label="추천 코스 날짜">${r.days.map((d,i)=>`<button type="button" role="tab" aria-selected="${i===active}" data-course-day="${i}" aria-controls="course-day-view">Day ${i+1}<small>${esc(label(d.date))}</small></button>`).join('')}</div>`;
    const real=day.items.filter(p=>p.id),walking=real.length?Math.max(...real.map(p=>p.walk)):0;
    const elapsed=day.items.length?Math.max(...day.items.map(p=>p.end))-day.start:0;
    h+=`<div class="course-day-head"><b>${esc(day.area)} 중심으로</b><p>장소 ${real.length}곳 · 예상 걷기 ${['없음','가벼움','보통','많음'][walking]} · 소요 약 ${Math.round(elapsed/6)/10}시간</p>${day.sunset?`<span>🌇 ${day.sunset.time} 일몰 · ${clock(day.sunset.arrival)} 도착 추천 (예상 시각)</span>`:'<span>해당 날짜의 일몰 시각을 계산하지 못했어요.</span>'}</div>`;
    h+='<div id="course-day-view" role="tabpanel" class="course-timeline">';
    if(!day.items.length)h+='<div class="course-empty">남은 후보가 없거나 시간에 맞는 장소가 없어요. 이날은 자유일정으로 활용하세요.</div>';
    let index=0;
    for(const item of day.items){
      if(item.travel?.minutes)h+=`<p class="course-move">${item.travel.kind} 약 ${item.travel.minutes}분 · 직선거리 ${item.travel.km.toFixed(1)}km 기반 추정</p>`;
      h+=`<article class="course-card ${item.kind==='휴식'?'course-rest':''}"><div class="course-number">${item.id?++index:item.kind==='휴식'?'☕':'→'}</div><div><div class="course-time">${esc(item.time)} <span>${esc(item.kind)}</span>${item.picked?'<em>💚 내가 담은 곳</em>':''}</div><b>${esc(item.name)}</b><p>${esc(item.description)}</p>${item.id?(old?`<small>🚶 걷기 ${['','쉬움','보통','많음'][item.walk]} (시연 기준) · 💡 ${esc(item.tip)}</small>`:`<small>📸 ${esc(item.shot)}<br>🎬 풍경 전체 → 내 모습 → 세부 장면 순서로 담아보세요.</small>`):''}${item.golden?'<p class="course-golden">🌇 예상 일몰 40분 전 도착에 맞춘 슬롯</p>':''}${item.gifts?`<p>🛍 근처에서 살 기념품 후보: ${item.gifts.map(esc).join(', ')}</p>`:''}</div></article>`;
    }
    h+='</div>';
    if(r.unplaced.length)h+=`<div class="course-overflow"><b>다 못 넣은 담은 곳 ${r.unplaced.length}곳</b><ul>${r.unplaced.map(p=>`<li>${esc(p.name)} · ${esc(p.reason)}</li>`).join('')}</ul>날짜·여행 속도 또는 방문 후보를 조정해 주세요.</div>`;
    h+=`<button type="button" class="course-shuffle" data-course-shuffle>🔀 다른 조합 보기</button><p class="course-note">${r.pace} · 담은 곳 우선 · 모의 점수/걷기 난이도/체류 시간은 편집 기준입니다. 이동은 실제 대중교통 조회가 아니며 운영시간·휴무·예약·항공 도착 시각을 반영하지 않습니다.</p><details><summary>데이터 출처·라이선스와 계산 기준</summary><p>장소 좌표: Wikidata P625 (CC0). 각 장소의 Wikidata 원문을 사실 확인에 참고했습니다. 설명·촬영 아이디어·동선 규칙·모의 점수는 직접 작성했습니다. 트리플의 코스·사진·문장은 수집하거나 복제하지 않았습니다.</p><p>거리: 하버사인 직선거리. 1.2km 이하는 도보 4.5km/h, 그 이상은 대중교통 평균 20km/h와 대기 10분을 가정해 5분 단위로 반올림합니다. 실제 보행·교통 경로와 다를 수 있습니다. 일몰은 NOAA 근사식과 목적지 시간대로 계산하며 지형·기상에 따른 차이가 있습니다.</p>${r.missing.length?`<p>좌표를 확인하지 못해 자동 배치에서 제외: ${r.missing.map(esc).join(', ')}</p>`:''}<div class="course-sources">${(DATA.cities[r.city]?.places||[]).filter(p=>p.source).map(p=>`<a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">${esc(p.name)}</a>`).join(' · ')}</div></details>`;
    root.innerHTML=h;
  }
  root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
    if(b.dataset.courseDay!=null){active=Number(b.dataset.courseDay);paint();}
    else if(b.hasAttribute('data-course-shuffle')){const city=result.city;seeds[city]=(Number(seeds[city])||0)+1;try{localStorage.setItem(STORE,JSON.stringify(seeds));}catch(_){}calculate();}
    else if(b.dataset.courseCity)document.dispatchEvent(new CustomEvent('triptrend:destination',{detail:{city:b.dataset.courseCity}}));
  });
  window.TripCourse=Object.freeze({get:()=>JSON.parse(JSON.stringify(result)),summaryText(){if(!result.days.length)return '미정';const items=result.days.flatMap(d=>d.items).filter(p=>p.id);return `${result.city} ${result.actualDays-1}박 ${result.actualDays}일${result.actualDays>7?' 중 7일':''} · ${items.length}곳 (담은 곳 ${items.filter(p=>p.picked).length})`;}});
  document.addEventListener('tripcontext:change',calculate);document.addEventListener('triptrend:change',calculate);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',calculate,{once:true});else calculate();
})();

</script>

    <script id="food-trend-ui">
/* Offline food UI. The data block is replaceable; this module never calls a network API. */
(() => {
  'use strict';
  const root=document.getElementById('food-root');
  if(!root)return;
  const DATA=window.FOOD_TREND_DATA;
  if(!DATA||!DATA.cities||typeof DATA.cities!=='object'){root.hidden=true;return;}
  const KINDS=['현지 음식','해산물','고기·구이','면·국물','카페·디저트','길거리 음식'];
  const BUDGETS=['1만원 이하','1~3만원','3~5만원','5만원 이상'];
  const ICONS={'웨이팅 적은 곳':'🪑','예약 가능':'📅','한국어 메뉴':'🇰🇷','채식 가능':'🌱'};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const finite=v=>typeof v==='number'&&Number.isFinite(v);
  const cities=Object.create(null),known=new Set();
  for(const [city,raw] of Object.entries(DATA.cities)){
    if(!Array.isArray(raw))continue;
    const seen=new Set();
    cities[city]=raw.filter(p=>p&&typeof p.name==='string'&&p.name.trim()).flatMap(p=>{
      const key=city+'|'+p.name;if(seen.has(key))return [];seen.add(key);known.add(key);
      return [{...p,city,key,name:p.name,area:typeof p.area==='string'&&p.area.trim()?p.area:'지역 미분류',kind:typeof p.kind==='string'?p.kind:'',budget:typeof p.budget==='string'?p.budget:'',prefs:Array.isArray(p.prefs)?p.prefs.filter(v=>typeof v==='string'):[],score:finite(p.score)?Math.max(0,Math.min(100,p.score)):0,trendPct:finite(p.trendPct)?p.trendPct:0,blogTotal:finite(p.blogTotal)?Math.max(0,Math.round(p.blogTotal)):0,chain:p.chain===true,hiddenGem:p.hiddenGem===true}];
    });
  }
  let picks=new Set(),area='',grouped=false,lastCity='',storageUnavailable=false;
  try{const v=JSON.parse(localStorage.getItem('gonsang-food-picks-v1')||'[]');if(Array.isArray(v))picks=new Set(v.filter(k=>known.has(k)));}catch(_){storageUnavailable=true;}
  const context=()=>{try{return window.TripContext?.()||{};}catch(_){return {};}};
  const mode=()=>{try{return window.TripTrend?.get()?.mode==='old'?'old':'young';}catch(_){return 'young';}};
  const arr=v=>Array.isArray(v)?v:[];
  function matches(p,food){
    const kinds=arr(food.kind),budgets=arr(food.budget),prefs=arr(food.pref);
    const kindActive=kinds.length>0&&!(kinds.length===1&&kinds[0]==='현지 음식');
    const limit=BUDGETS.indexOf(budgets[0]);
    return {kind:!kindActive||(KINDS.includes(p.kind)&&kinds.includes(p.kind)),budget:p.budget===''||limit<0||(BUDGETS.includes(p.budget)&&BUDGETS.indexOf(p.budget)<=limit),pref:prefs.every(v=>p.prefs.includes(v)||(v==='웨이팅 적은 곳'&&p.hiddenGem)),area:!area||area===p.area};
  }
  const relaxed=p=>p.hiddenGem||p.prefs.includes('웨이팅 적은 곳');
  function sorted(rows,old){return [...rows].sort((a,b)=>{
    if(old){const chain=p=>p.chain&&!p.prefs.includes('한국어 메뉴');const d=Number(chain(a))-Number(chain(b));if(d)return d;const r=Number(relaxed(b))-Number(relaxed(a));if(r)return r;}
    return b.score-a.score||a.name.localeCompare(b.name,'ko');
  });}
  function cityButtons(){return '<div class="ft-cities">'+Object.keys(cities).filter(c=>cities[c].length).map(c=>`<button type="button" data-food-city="${esc(c)}">${esc(c)}</button>`).join('')+'</div>';}
  function card(p,old){
    const picked=picks.has(p.key),change=Math.round(p.trendPct),trend=change>0?'▲'+change+'%':change<0?'▼'+Math.abs(change)+'%':'–';
    const badge=(s,c='')=>`<span class="ft-chip ${c}">${esc(s)}</span>`;
    return `<article class="ft-card${picked?' ft-picked':''}" data-food-name="${esc(p.name)}" data-food-area="${esc(p.area)}" data-food-kind="${esc(p.kind)}" data-food-budget="${esc(p.budget)}" data-food-score="${p.score}"><div class="ft-name"><span class="ft-rank">${esc(p.rank??'·')}</span><span>${esc(p.name)}</span></div><div>${badge(p.area)}${badge(p.kind||'종류 미분류')}${p.chain?badge('체인'):''}${p.hiddenGem?badge('💎 숨은 맛집','ft-good'):''}${!old&&p.trendPct>=20?badge('🔥 지금 뜨는 중','ft-good'):''}${old&&(p.prefs.includes('웨이팅 적은 곳')||p.prefs.includes('예약 가능'))?badge('🪑 여유롭게','ft-good'):''}</div><div class="ft-meter" role="meter" aria-label="${esc(p.name)} 화제도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.score}"><span style="width:${p.score}%"></span></div><div class="ft-score">화제도 ${p.score} <span>${trend}</span></div><p class="ft-note">${esc(p.budget||'예산 정보 없음')} · ${p.prefs.length?p.prefs.map(v=>esc((ICONS[v]||'✓')+' '+v)).join(' · '):'식사 조건 정보 없음'}</p><p class="ft-note">${esc(p.note||'')}</p><div class="ft-sub">📝 블로그 ${p.blogTotal.toLocaleString('ko-KR')}건 · 검색 결과 수</div><button class="ft-pick" type="button" data-food-pick="${esc(p.key)}" aria-pressed="${picked}">${picked?'담음 ✓':'＋ 담기'}</button></article>`;
  }
  function render(){
    const ctx=context(),city=(ctx.dest||'').trim(),old=mode()==='old',raw=cities[city]||[],food=ctx.food||{};

      <div id="fd-selection" class="fd-selection" hidden></div>
      <div class="fd-layout"><aside class="fd-filters" aria-label="항공권 필터"><h4>원하는 항공편만</h4><button class="fd-link" data-action="reset">필터 초기화</button>
        <fieldset class="fd-filter-group"><legend>경유</legend>${[0,1,2].map(stops=>{const items=offers.filter(item=>item.stops===stops);return `<label class="fd-check"><input type="checkbox" data-filter="stops" value="${stops}" ${items.length?'checked':'disabled'}><span>${stops===0?'직항':stops===1?'1회 경유':'2회 이상 경유'}<small>${items.length?`${money(Math.min(...items.map(item=>item.price)))}부터`:'해당 없음'}</small></span></label>`;}).join('')}</fieldset>
        ${timeControls('out','가는 편 출발 시간')}${query.type==='왕복'?timeControls('in','오는 편 출발 시간'):''}
        <fieldset class="fd-filter-group"><legend>가는 편 최대 소요시간</legend><output class="fd-time-label" id="fd-duration"></output>${rangeControl('maxDuration','최대 시간',filters.maxDuration,filters.maxDuration,15)}</fieldset>
        <fieldset class="fd-filter-group"><legend>성인 1인 가격 상한</legend><output class="fd-time-label" id="fd-price-limit"></output>${rangeControl('maxPrice','최대 운임',filters.maxPrice,filters.maxPrice,10000)}</fieldset>

        <fieldset class="fd-filter-group"><legend>항공사</legend>${filters.airlines.map(name=>`<label class="fd-check"><input type="checkbox" data-filter="airlines" value="${e(name)}" checked>${e(name)}</label>`).join('')}</fieldset>
      </aside><div><div class="fd-sort" id="fd-sort" aria-label="항공편 정렬"></div><p id="fd-stat" class="fd-sub" style="margin-bottom:12px"></p><div class="fd-list" id="fd-list" aria-live="polite"></div></div></div>
      <details class="fd-provenance"><summary>가데이터와 가격 참고 기준</summary><p>2026-10-15 공개 노선 페이지를 참고해 넓은 가격대를 수동 설정했습니다. ${e(p.region)} ${e(query.city)}의 일반석 왕복 기준은 ${money(p.low)}~${money(p.high)}이며, 편도 기준은 ${money(regionLow)}부터 가정했습니다. 날짜·좌석·공항별 가중치는 시연용 규칙입니다. 실제 시장 평균이나 조회한 날짜의 판매가격이 아닙니다.</p><p>참고 노선: <a href="https://www.skyscanner.co.kr/routes/sela/tyoa/seoul-to-tokyo.html" target="_blank" rel="noopener">서울–도쿄</a> · <a href="https://www.skyscanner.co.kr/routes/sela/bkkt/seoul-to-bangkok.html" target="_blank" rel="noopener">방콕</a> · <a href="https://www.skyscanner.co.kr/routes/sela/lond/seoul-to-london.html" target="_blank" rel="noopener">런던</a> · <a href="https://www.skyscanner.co.kr/routes/sela/nyca/seoul-to-new-york.html" target="_blank" rel="noopener">뉴욕</a> · <a href="https://www.skyscanner.co.kr/routes/sela/syd/seoul-to-sydney.html" target="_blank" rel="noopener">시드니</a>. 다른 도시의 가격대는 이 지역별 차이를 참고한 시연용 추정값입니다.</p></details>`;
    updateFilterLabels(); paint();
  }
  function legHtml(leg, title) {
    const offset = leg.dayOffset ? `<sup>${leg.dayOffset>0?'+':''}${leg.dayOffset}일</sup>` : '';
    return `<div class="fd-leg-label">${title} · ${e(dateLabel(leg.date))}</div><div class="fd-leg"><div class="fd-leg-time"><strong>${e(leg.depart)}</strong><small>${e(leg.origin)}</small></div><div class="fd-flight-path">${duration(leg.minutes)}<i></i><em>${leg.stops ? `${leg.stops}회 경유 · ${e(leg.via)}` : '직항'}</em></div><div class="fd-leg-time"><strong>${e(leg.arrive)}${offset}</strong><small>${e(leg.destination)}</small></div></div>`;
  }
  function cardHtml(offer, index) {

      ${legHtml(offer.outbound,'가는 편')}${offer.inbound?legHtml(offer.inbound,'오는 편'):''}
      <div class="fd-price"><div><small>성인 1인 · ${e(query.type)}</small><strong>${money(offer.price)}</strong><small>총 ${people}명 ${money(offer.groupPrice)}</small></div><button class="fd-btn" data-action="select" data-id="${offer.id}">${chosen?'선택됨 ✓':'후보로 선택 →'}</button></div>
      <details class="fd-details"><summary>모의 운임 상세</summary><div>${e(offer.cabin)} · 기내수하물 7kg 가정 · ${offer.baggage?'위탁수하물 15kg 포함 가정':'위탁수하물 별도 가정'}<br>세금 포함을 가정한 총액입니다. 어린이 75%, 유아 10% 요율은 시연 계산용이며 실제 항공사 규정이 아닙니다. 예약·발권은 진행되지 않습니다.</div></details></article>`;
  }
  function sorted(items, order) {
    return [...items].sort((a,b)=>order==='cheap'?a.price-b.price:order==='fast'?a.duration-b.duration:a.recommendation-b.recommendation || a.price-b.price);
  }
  function paint() {
    let visible = D.filterOffers(offers,filters); if (favoriteOnly) visible = visible.filter(item=>favorites.has(item.id));

    $('#fd-sort').innerHTML = [['best','추천순'],['cheap','최저가'],['fast','최단시간']].map(([order,label])=>{
      const best = sorted(visible,order)[0]; return `<button data-action="sort" data-sort="${order}" aria-pressed="${sort===order}"><span>${label}</span><b>${best?money(best.price):'—'}</b><small>${best?`${duration(best.outbound.minutes)} · 가는 편`:'조건을 조정해 주세요'}</small></button>`;
    }).join('');
    $('#fd-stat').textContent = visible.length ? `모의 결과 평균 ${money(visible.reduce((sum,item)=>sum+item.price,0)/visible.length)} · 성인 1인 ${query.type} 기준` : '현재 필터에 맞는 모의 항공편이 없습니다.';
    $('#fd-list').innerHTML = visible.length ? sorted(visible,sort).map(cardHtml).join('') : '<div class="fd-intro"><h3>조건에 맞는 항공편이 없어요</h3><p>시간대나 경유 조건을 넓혀 보세요.</p><button class="fd-btn" data-action="reset">필터 초기화</button></div>';
    const selection = $('#fd-selection'); selection.hidden = !selected;
    if (selected) selection.innerHTML = `<strong>✓ 여행 후보에 담았어요</strong>${e(selected.offer.airline)} · ${money(selected.offer.price)} / 성인 1인 · 전체 ${money(selected.offer.groupPrice)}<br>이 선택은 가데이터 후보로 브라우저에 저장됩니다.`;
  }
  function updateFilterLabels() {
    for (const prefix of ['out','in']) {
      const label = $(`#fd-time-${prefix}`); if (label) label.textContent = `${String(filters[`${prefix}Min`]).padStart(2,'0')}:00 ~ ${String(filters[`${prefix}Max`]).padStart(2,'0')}:59`;
      for (const suffix of ['Min','Max']) { const output=$(`#fd-value-${prefix}${suffix}`); if(output) output.textContent=`${filters[`${prefix}${suffix}`]}시`; }
    }
    $('#fd-duration').textContent = duration(filters.maxDuration); $('#fd-price-limit').textContent = money(filters.maxPrice);
  }
  function updateFilter(input) {
    const name=input.dataset.filter; if (!name || !query) return;
    if (name==='stops'||name==='airlines') filters[name]=Array.from(root.querySelectorAll(`[data-filter="${name}"]:checked`)).map(el=>name==='stops'?Number(el.value):el.value);
    else if(name==='baggage') filters.baggage=input.checked;
    else if(name==='favorites') favoriteOnly=input.checked;
    else {
      filters[name]=Number(input.value);
      for (const prefix of ['out','in']) if (filters[`${prefix}Min`]>filters[`${prefix}Max`]) {
        const other=name.endsWith('Min')?`${prefix}Max`:`${prefix}Min`;
        filters[other]=filters[name]; const element=$(`#fd-${other}`); if(element)element.value=String(filters[other]);
      }
    }
    updateFilterLabels(); paint();
  }
  function paintExplore(region='all') {
    $('#fd-cities').innerHTML = D.profiles.filter(p=>region==='all'||p.region===region).map(p=>{
      const offersForCity=D.buildOffers({...query,city:p.city,cabin:'일반석'}), low=offersForCity.length?Math.min(...offersForCity.map(offer=>offer.price)):null;
      return `<button class="fd-city" data-action="destination" data-city="${e(p.city)}"><b>${e(p.city)} <small>${e(p.airport)}</small></b><span>${low?`${money(low)}부터`:'일정 조정 필요'}</span></button>`;
    }).join('');

  function search(input) {
    try {
      query=D.normalize(input); offers=D.buildOffers(query); if(!offers.length)throw Error('왕복 비행시간에 비해 일정이 짧아요. 오는 날짜를 늦춰 다시 조회해 주세요.');sort='best';resetFilters();
      const previous=load('gonsang-flight-selection-v1',null); selected=previous?.query && keyOf(previous.query)===keyOf(query)?previous:null;

  }
  root.addEventListener('input',event=>{if(event.target.type==='range')updateFilter(event.target)});
  root.addEventListener('change',event=>{if(event.target.id==='fd-region')paintExplore(event.target.value);else if(event.target.type!=='range')updateFilter(event.target)});
  root.addEventListener('click',event=>{
    const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
    const action=button.dataset.action;
    if(action==='example'){document.dispatchEvent(new CustomEvent('tripflight:example'));return;}
    if(!query)return;
    if(action==='sort'){sort=button.dataset.sort;paint();}
    if(action==='reset'){resetFilters();renderFrame();}
    if(action==='calendar'){
      const calendar=$('#fd-calendar');calendar.hidden=!calendar.hidden;button.setAttribute('aria-expanded',String(!calendar.hidden));
      if(!calendar.hidden)calendar.innerHTML=D.calendar(query).map(day=>`<button class="fd-date" data-action="date" data-start="${day.start}" data-end="${day.end}" aria-pressed="${day.start===query.start}" ${day.disabled?'disabled':''}><span>${e(dateLabel(day.start))}</span><b>${day.price?money(day.price):'결과 없음'}</b></button>`).join('');
    }
    if(action==='explore'){const panel=$('#fd-explore');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)paintExplore($('#fd-region').value);}
    if(action==='date')document.dispatchEvent(new CustomEvent('tripflight:dateschange',{detail:{start:button.dataset.start,end:button.dataset.end}}));
    if(action==='destination')document.dispatchEvent(new CustomEvent('tripflight:destination',{detail:{city:button.dataset.city}}));
    if(action==='favorite'){const id=button.dataset.id;favorites.has(id)?favorites.delete(id):favorites.add(id);save('gonsang-flight-favorites-v1',[...favorites]);paint();}
    if(action==='select'){
      const offer=offers.find(item=>item.id===button.dataset.id);if(!offer)return;
      // Future budget adapter: amountKrw is the entire party total; offer.price is one adult.
      // Listen for tripflight:select separately when the budget team is ready to integrate.
      selected={version:1,source:'demo',currency:'KRW',query,offer,amountKrw:offer.groupPrice,updatedAt:new Date().toISOString()};
      save('gonsang-flight-selection-v1',selected);paint();document.dispatchEvent(new CustomEvent('tripflight:select',{detail:selected}));
    }
  });
  window.FlightDemo=Object.freeze({search,updateConditions(input){if(!query||!$('#fd-stale'))return;$('#fd-stale').hidden=keyOf(query)===keyOf(input);}});
  root.innerHTML='<div class="fd-intro"><span class="fd-chip">OFFLINE FLIGHT DEMO</span><h3>내 조건에 맞는 항공편을 비교해 보세요</h3><p>상단에서 도시·날짜·인원을 고르고 조회하면<br>이곳에 직항·경유 항공편과 모의 운임이 펼쳐집니다.</p><button class="fd-btn fd-light" data-action="example">도쿄 예시 조건으로 살펴보기 →</button></div>';
})();
</script>

  let contSel = '전체';
  const ALL = Object.entries(CONTINENTS).flatMap(([c, l]) => l.map(d => ({ c, ic: d[0], n: d[1], t: d[2], code: d[3] })));
  const codeOf = n => (ALL.find(d => d.n === n) || {}).code || '';
  function renderDest(q = '') {
    $('#conts').innerHTML = ['전체', ...Object.keys(CONTINENTS)]
      .map(c => `<button class="cont${c === contSel ? ' on' : ''}" type="button" data-c="${c}">${c}</button>`).join('');
    const list = ALL.filter(d => (contSel === '전체' || d.c === contSel) && d.n.includes(q.trim()));
    let h = '', last = '';
    list.forEach(d => {
      if (d.c !== last) { h += `<div class="grp">${d.c}</div>`; last = d.c; }
      h += `<button class="dest" type="button" data-d="${d.n}"><i>${d.ic}</i><span><b>${d.n} <small style="color:var(--sub);font-weight:600">${d.code}</small></b><em>${d.t}</em></span></button>`;
    });
    $('#destList').innerHTML = h || `<div style="padding:12px;color:var(--sub);font-size:14px">검색 결과가 없습니다. 직접 입력한 "${q}" 로 진행할 수 있어요.</div>`;
  }
  renderDest();
  $('#conts').addEventListener('click', e => {
    const b = e.target.closest('.cont'); if (!b) return;
    e.stopPropagation(); // re-render가 클릭 대상을 DOM에서 지워 패널이 닫히는 것을 방지
    contSel = b.dataset.c; renderDest($('#destInput').value);
  });
  $('#destInput').addEventListener('input', e => {
    state.dest = e.target.value; renderDest(e.target.value); open('dest'); renderAll();
  });
  $('#destList').addEventListener('click', e => {
    const b = e.target.closest('.dest'); if (!b) return;
    // 이미 선택된 도시를 다시 누르면 선택 취소
    if (state.dest === b.dataset.d) { e.stopPropagation(); clearDest(); return; }
    state.dest = b.dataset.d; $('#destInput').value = state.dest; renderAll(); open('date');
  });
  function clearDest() {
    state.dest = ''; $('#destInput').value = ''; contSel = '전체';
    renderDest(); renderAll(); open('dest'); $('#destInput').focus();
  }
  $('#destClear').addEventListener('click', e => { e.stopPropagation(); clearDest(); });

  /* ---------- 달력 ---------- */
  const today = new Date(); today.setHours(0,0,0,0);
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  const sameDay = (a, b) => a && b && a.getTime() === b.getTime();
  function renderMonth(host, base) {
    const y = base.getFullYear(), m = base.getMonth();
    const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
    let h = `<h5>${y}년 ${m + 1}월</h5><div class="grid">` + DOW.map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < first; i++) h += '<div></div>';
    for (let d = 1; d <= last; d++) {
      const dt = new Date(y, m, d);
      const past = dt < today;
      const edge = sameDay(dt, state.start) || sameDay(dt, state.end);
      const inRange = state.start && state.end && dt > state.start && dt < state.end;
      h += `<button type="button" class="day${edge ? ' edge' : ''}${inRange ? ' in' : ''}" data-t="${dt.getTime()}" ${past ? 'disabled' : ''}>${d}</button>`;
    }
    host.innerHTML = h + '</div>';
  }
  function renderCal() {
    renderMonth($('#cal0'), view);
    renderMonth($('#cal1'), new Date(view.getFullYear(), view.getMonth() + 1, 1));
    $('#prevM').disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
    $('#rangeHint').textContent = !state.start ? '체크인 날짜를 선택하세요'
      : !state.end ? '체크아웃 날짜를 선택하세요' : `${nights()}박 ${nights() + 1}일`;
  }
  $('#prevM').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); });
  $('#nextM').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); });
  $('#p-date').addEventListener('click', e => {
    e.stopPropagation(); // 달력을 다시 그리면 클릭 대상이 DOM에서 사라져 바깥 클릭으로 오인되므로 막는다
    const b = e.target.closest('.day'); if (!b || b.disabled) return;
    const t = new Date(+b.dataset.t);
    if (!state.start || (state.start && state.end)) { state.start = t; state.end = null; }
    else if (t < state.start) { state.start = t; }
    else if (sameDay(t, state.start)) { return; }
    else { state.end = t; }
    renderCal(); renderAll();
    if (state.end) open('guest');
  });
  $('#clearDate').addEventListener('click', () => { state.start = state.end = null; renderCal(); renderAll(); });
  const nights = () => state.start && state.end ? Math.round((state.end - state.start) / 864e5) : 0;
  const fmt = d => `${d.getMonth() + 1}월 ${d.getDate()}일`;
  const fmtLong = d => `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;

  /* ---------- 여행자 ---------- */
  const GUEST_ROWS = [
    ['adult','성인','13세 이상'], ['child','어린이','2~12세'], ['infant','유아','2세 미만'], ['pet','반려동물','보조동물을 동반하시나요?']
  ];
  function renderGuest() {
    $('#p-guest').innerHTML = GUEST_ROWS.map(([k, t, s]) => `
      <div class="row"><div><b>${t}</b><em>${s}</em></div>
      <div class="step"><button type="button" data-k="${k}" data-d="-1" ${state.guests[k] <= 0 ? 'disabled' : ''}>−</button>
      <span>${state.guests[k]}</span>
      <button type="button" data-k="${k}" data-d="1" ${state.guests[k] >= 16 ? 'disabled' : ''}>+</button></div></div>`).join('');
  }
  $('#p-guest').addEventListener('click', e => {
    e.stopPropagation();
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const g = state.guests, k = b.dataset.k;
    g[k] = Math.max(0, g[k] + +b.dataset.d);
    if (k !== 'adult' && k !== 'pet' && g[k] > 0 && g.adult === 0) g.adult = 1;
    if (k === 'adult' && g.adult === 0) { g.child = 0; g.infant = 0; }
    renderGuest(); renderAll();
  });
  function guestLabel() {
    const g = state.guests, n = g.adult + g.child;
    const parts = [];
    if (n) parts.push(`게스트 ${n}명`);
    if (g.infant) parts.push(`유아 ${g.infant}명`);
    if (g.pet) parts.push(`반려동물 ${g.pet}마리`);
    return parts.join(', ');
  }

  /* ---------- 하단 조건 ---------- */
  $$('.opts').forEach(box => {
    const key = box.dataset.key, multi = box.dataset.mode === 'multi';
    state.opts[key] = $$('.opt.on', box).map(b => b.textContent);
    box.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b) return;
      if (multi) b.classList.toggle('on');
      else $$('.opt', box).forEach(x => x.classList.toggle('on', x === b));
      state.opts[key] = $$('.opt.on', box).map(x => x.textContent);
      renderAll();
    });
  });
  // 예산은 budget.js(TripBudget)가 관리한다. 금액이 바뀌면 요약만 갱신.
  document.addEventListener('tripbudget:change', () => renderSummary());
  document.addEventListener('tripstay:change', () => renderSummary());
  document.addEventListener('triptour:change', () => renderSummary());
  document.addEventListener('tripcourse:change', () => renderSummary());
  document.addEventListener('foodtrend:change', () => renderSummary());
  $('#tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t) return;
    $$('.tab').forEach(x => x.classList.toggle('on', x === t));
    $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + t.dataset.t));
    document.dispatchEvent(new CustomEvent('triptabs:change'));
  });

  /* ---------- 렌더 ---------- */
  function renderSummary() {
    const o = state.opts, j = a => (a && a.length ? a.join(', ') : '상관없음');
    const rows = [
      ['여행지', state.dest || '미정'],
      ['날짜', state.start ? (state.end ? `${fmtLong(state.start)} ~ ${fmtLong(state.end)} (${nights()}박)` : `${fmtLong(state.start)} ~`) : '미정'],
      ['여행자', guestLabel() || '미정'],
      ['항공', `${air.reverse ? '귀국편 기준 · ' : ''}${air.from} · ${air.type} · ${j(o.airClass)}`],
      ['숙소', window.StayFilter ? window.StayFilter.summaryText() : '상관없음'],
      ['관광', `${j(o.tourTheme)} · ${j(o.tourPace)} · ${j(o.tourMove)}${window.TripTour?.summaryText() || ''}`],
      ['일정', window.TripCourse ? window.TripCourse.summaryText() : '미정'],
      ['맛집', `${j(o.foodKind)} · ${j(o.foodBudget)}` + (o.foodPref.length ? ` · ${o.foodPref.join(', ')}` : '') + (window.FoodTrend ? window.FoodTrend.summaryText() : '')],
      ['예산', window.TripBudget ? window.TripBudget.summaryText() : '미정']
    ];
    $('#summary').innerHTML = rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
  }
  function renderAll() {
    $('#dateText').textContent = state.start
      ? (state.end ? `${fmt(state.start)} - ${fmt(state.end)}` : `${fmt(state.start)} - 체크아웃 선택`) : '날짜 추가';
    $('#dateText').classList.toggle('filled', !!state.start);
    const gl = guestLabel();
    $('#guestText').textContent = gl || '게스트 추가';
    $('#guestText').classList.toggle('filled', !!gl);
    $('#destClear').hidden = !state.dest;
    renderFlight();
    renderSummary();
    // 예산 모듈에 읽기용 조건만 전달한다. 선택한 조건·항공·숙소 상태는 변경하지 않는다.
    window.TripBudget?.setContext({ dest: state.dest, guests: state.guests });
    // 관광 검색 관심도는 조건을 읽기만 하며 기존 선택 요약은 변경하지 않는다.
    document.dispatchEvent(new CustomEvent('tripcontext:change'));
  }

  /* ---------- 항공 검색 폼 (상단 선택과 연동) ---------- */
  const air = { type: '왕복', from: '서울 SEL', reverse: false };
  // FLIGHT DEMO BRIDGE START — only reads travel conditions; never writes TripBudget.
  const flightDate = date => date ? `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}` : '';
  function flightDemoConditions() {
    return { city:state.dest, home:(air.from.match(/[A-Z]{3}/)||['SEL'])[0], type:air.type, reverse:air.reverse,
      start:flightDate(state.start), end:flightDate(state.end), cabin:(state.opts.airClass||['일반석'])[0],
      guests:{adult:state.guests.adult, child:state.guests.child, infant:state.guests.infant} };
  }
  const searchFlightDemo = () => window.FlightDemo?.search(flightDemoConditions());
  // FLIGHT DEMO BRIDGE END
  function renderFlight() {
    const code = codeOf(state.dest);
    const to = state.dest ? (code ? `${state.dest} ${code}` : state.dest) : '';
    const fromEl = $('#fFrom'), toEl = $('#fTo');
    const place = air.reverse
      ? [[to, '도착 도시'], [air.from, '']] : [[air.from, ''], [to, '도착 도시']];
    // 위쪽 행 = 출발, 아래 행 = 도착
    fromEl.textContent = place[0][0] || '출발 도시'; fromEl.className = place[0][0] ? '' : 'ph';
    toEl.textContent = place[1][0] || '도착 도시'; toEl.className = place[1][0] ? '' : 'ph';
    const dEl = $('#fDate');
    const d = state.start
      ? (air.type === '편도' || !state.end ? fmt(state.start) : `${fmt(state.start)} - ${fmt(state.end)}`) : '날짜';
    dEl.textContent = d; dEl.className = state.start ? '' : 'ph';
    const pax = state.guests.adult + state.guests.child + state.guests.infant;
    $('#fPax').textContent = `탑승객 ${pax || 1}명, ${(state.opts.airClass || ['일반석'])[0]}`;
    const ok = !!state.dest && !!state.start && (air.type === '편도' || !!state.end) && state.guests.adult > 0;
    $('#fGo').disabled = !ok;
    window.FlightDemo?.updateConditions(flightDemoConditions());
  }
  $('#ftabs').addEventListener('click', e => {
    const b = e.target.closest('.ftab'); if (!b) return;
    air.type = b.dataset.v;
    $$('.ftab').forEach(x => x.classList.toggle('on', x === b));
    renderAll();
  });
  $('#fSwap').addEventListener('click', () => { air.reverse = !air.reverse; renderAll(); });
  const toTop = name => { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => open(name), 50); };
  $('#fr-from').addEventListener('click', () => {
    const list = ['서울 SEL', '부산 PUS', '제주 CJU'];
    air.from = list[(list.indexOf(air.from) + 1) % list.length]; renderAll();
  });
  $('#fr-to').addEventListener('click', e => { e.stopPropagation(); toTop('dest'); });
  $('#fr-date').addEventListener('click', e => { e.stopPropagation(); toTop('date'); });
  $('#fr-pax').addEventListener('click', e => { e.stopPropagation(); toTop('guest'); });
  $('#fGo').addEventListener('click', searchFlightDemo);
  // Flight-only navigation events keep the top search and the mock results consistent.
  document.addEventListener('tripflight:dateschange', event => {
    const localDate = value => { const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d); };
    state.start=localDate(event.detail.start); if(event.detail.end)state.end=localDate(event.detail.end);
    view=new Date(state.start.getFullYear(),state.start.getMonth(),1); renderCal();renderAll();searchFlightDemo();
  });
  document.addEventListener('tripflight:destination', event => {
    state.dest=event.detail.city;$('#destInput').value=state.dest;renderAll();searchFlightDemo();
  });
  document.addEventListener('triptrend:destination', event => {
    const city=event.detail?.city;
    if(typeof city!=='string'||!Object.prototype.hasOwnProperty.call(window.GonsangTourCatalog||{},city))return;
    state.dest=city;$('#destInput').value=city;renderAll();
  });
  document.addEventListener('tripflight:example', () => {
    const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()+5);
    state.dest='도쿄';$('#destInput').value=state.dest;state.start=start;state.end=new Date(start);state.end.setDate(start.getDate()+7);
    state.guests={adult:2,child:0,infant:0,pet:0};state.opts.airClass=['일반석'];air.type='왕복';air.from='서울 SEL';air.reverse=false;
    $$('.ftab').forEach(button=>button.classList.toggle('on',button.dataset.v==='왕복'));
    $$('.opts[data-key="airClass"] .opt').forEach(button=>button.classList.toggle('on',button.textContent==='일반석'));
    view=new Date(start.getFullYear(),start.getMonth(),1);closeAll();renderCal();renderGuest();renderAll();searchFlightDemo();
  });

  /* ---------- 검색 / 저장 ---------- */
  const toast = msg => {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 2200);
  };
  $('#goBtn').addEventListener('click', () => {
    closeAll();
    if (!state.dest) { toast('여행지를 먼저 선택해 주세요'); open('dest'); return; }
    if (!state.start || !state.end) { toast('여행 날짜를 선택해 주세요'); open('date'); return; }
    if (!state.guests.adult) { toast('여행자를 추가해 주세요'); open('guest'); return; }
    document.querySelector('.plan').scrollIntoView({ behavior: 'smooth' });
    toast('상단 조건이 적용됐어요. 하단에서 세부 조건을 설정하세요');
  });
  // 숙소 검색(stay.js)이 상단 선택값을 읽어 가는 통로
  window.TripContext = () => ({
    dest: state.dest,
    start: state.start && ymd(state.start), end: state.end && ymd(state.end),
    guests: { ...state.guests },
    food: { kind:[...(state.opts.foodKind || [])], budget:[...(state.opts.foodBudget || [])], pref:[...(state.opts.foodPref || [])] },
    tourThemes: [...(state.opts.tourTheme || [])],
    pace: (state.opts.tourPace || ['보통'])[0],
    flight: { home:(air.from.match(/[A-Z]{3}/)||['SEL'])[0], type:air.type, reverse:air.reverse, cabin:(state.opts.airClass || ['일반석'])[0] }
  });
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const saveConditions = () => {
    const data = { dest: state.dest, start: state.start && ymd(state.start),
      end: state.end && ymd(state.end), guests: state.guests, flight: air, budget: window.TripBudget ? window.TripBudget.get() : null, stay: window.StayFilter ? window.StayFilter.get() : null, tour:window.TripTour?.get() || [], course:window.TripCourse?.get() || null, options: state.opts };
    try { localStorage.setItem('gonsang-trip-conditions', JSON.stringify(data)); } catch (_) {}
  };
  // 최종 일정 창: 저장한 조건을 trip-summary.html 이 읽어 일정·경비·체크리스트로 보여 준다
  const sumModal = $('#sumModal'), sumFrame = $('#sumFrame');
  const closeSummary = () => { sumModal.classList.remove('open'); sumFrame.removeAttribute('src'); };
  $('#saveBtn').addEventListener('click', () => {
    saveConditions();
    sumFrame.src = 'trip-summary.html';
    sumModal.classList.add('open');
  });
  $('#sumClose').addEventListener('click', closeSummary);
  sumModal.addEventListener('click', e => { if (e.target === sumModal) closeSummary(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sumModal.classList.contains('open')) closeSummary(); });
  window.addEventListener('message', e => {
    if (e.origin === location.origin && e.data && e.data.type === 'trip-summary:close') closeSummary();
  });

  renderCal(); renderGuest(); renderAll();
})();
</script>
</body>
</html>
