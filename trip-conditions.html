<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 조건 설정</title>
<style>
  :root{
    --bg:#fff; --ink:#222; --sub:#717171; --line:#ddd; --soft:#f7f7f7; --soft2:#ebebeb;
    --pink:#1d735a; --pink2:#155a46; --teal:#1d735a; --teal-d:#1d735a; --teal-soft:#e4f3ed; --lime:#d9f17c;
    --gray:#f0f1f0; --gray-d:#dfe2e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input{font:inherit}

  /* ===== 상단: Airbnb 스타일 ===== */
  .top{background:#fff;border-bottom:1px solid var(--line);padding:20px 16px 28px;position:relative}
  .top-head{max-width:1100px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;color:var(--pink);font-size:22px;letter-spacing:-.5px}
  .search-wrap{max-width:860px;margin:0 auto;position:relative}
  .search{display:flex;align-items:stretch;background:var(--soft2);border:1px solid var(--line);border-radius:999px;height:68px}
  .search.active{background:var(--soft2)}
  .seg{flex:1;text-align:left;padding:0 28px;border-radius:999px;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .seg:hover{background:#dedede}
  .seg.on{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .seg+.seg{position:relative}
  .seg small{font-size:12px;font-weight:700}
  .seg span{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg span.filled{color:var(--ink)}
  .go{display:flex;align-items:center;gap:6px;background:var(--pink);color:#fff;font-weight:700;border-radius:999px;margin:8px;padding:0 22px}
  .go:hover{background:var(--pink2)}
  .panel{position:absolute;top:78px;background:#fff;border-radius:32px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:24px;z-index:20;display:none}
  .panel.open{display:block}
  #p-dest{left:0;width:400px;max-height:420px;overflow:auto}
  #p-date{left:50%;transform:translateX(-50%);width:min(820px,94vw)}
  #p-guest{right:0;width:380px}
  .panel h4{margin:0 0 10px;font-size:12px;font-weight:600}
  .dest{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:12px}
  .dest:hover{background:var(--soft)}
  .dest i{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:24px;background:#fdecec}
  .dest b{display:block;font-size:15px}
  .dest em{font-style:normal;font-size:13px;color:var(--sub)}
  .dest-input{width:100%;border:0;outline:0;background:transparent;font-size:14px;padding:0}
  .dest-row{display:flex;align-items:center;gap:6px}
  .dest-x{width:22px;height:22px;flex:none;border-radius:50%;background:#d8d8d8;color:#fff;font-size:11px;display:grid;place-items:center;cursor:pointer}
  .dest-x:hover{background:var(--teal-d)}
  .dest-x[hidden]{display:none}

  /* 달력 */
  .cal-wrap{display:flex;gap:40px;justify-content:center;position:relative}
  .cal{flex:1;min-width:0}
  .cal h5{text-align:center;margin:6px 0 14px;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
  .grid .dow{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
  .day{aspect-ratio:1;border-radius:50%;font-size:14px;font-weight:600;display:grid;place-items:center}
  .day:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--ink)}
  .day:disabled{color:#c8c8c8;cursor:default;font-weight:400;text-decoration:line-through}
  .day.in{background:var(--soft2);border-radius:0}
  .day.edge{background:var(--ink);color:#fff}
  .nav{position:absolute;top:0;width:32px;height:32px;border-radius:50%;font-size:18px}
  .nav:hover{background:var(--soft2)}
  .nav.l{left:0}.nav.r{right:0}
  .nav:disabled{opacity:.25;cursor:default}
  .cal-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
  .link{text-decoration:underline;font-weight:600;color:var(--ink)}

  /* 게스트 */
  .row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--soft2)}
  .row:last-child{border-bottom:0}
  .row b{display:block;font-size:16px}
  .row em{font-style:normal;color:var(--sub);font-size:14px}
  .step{display:flex;align-items:center;gap:14px}
  .step button{width:32px;height:32px;border-radius:50%;border:1px solid #b0b0b0;font-size:18px;line-height:1}
  .step button:hover:not(:disabled){border-color:var(--ink)}
  .step button:disabled{opacity:.3;cursor:default}
  .step span{width:20px;text-align:center}

  /* ===== 하단: 트리플 스타일 ===== */
  .plan{max-width:1100px;margin:28px auto 80px;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .main-col{min-width:0}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .tab{padding:22px 0;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .tab i{font-style:normal;font-size:30px}
  .tab:hover{border-color:var(--teal-d)}
  .tab.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff;box-shadow:0 8px 20px rgba(29,115,90,.25)}
  .panes{border:1px solid var(--line);border-radius:20px;background:#fff}
  .aside{position:sticky;top:16px;background:var(--gray);border-radius:20px;padding:24px 22px 26px}
  .aside h3{margin:0 0 4px;font-size:18px}
  .aside .hint{margin:0 0 18px;font-size:13px;color:var(--sub)}
  .bud{margin-bottom:16px}
  .bud label{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
  .bud label span{color:var(--teal-d)}
  .bud-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-top:1px solid var(--gray-d);border-bottom:1px solid var(--gray-d);margin:6px 0 18px;font-weight:700}
  .bud-total strong{font-size:22px;color:var(--teal-d)}
  .pane{display:none;padding:22px 24px 28px}
  .pane.on{display:block}
  .pane h3{margin:0 0 16px;font-size:17px}
  .field{margin-bottom:20px}
  .field>label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;background:#fff}
  .opt:hover{border-color:var(--teal-d)}
  .opt.on{background:var(--teal-soft);border-color:var(--teal-d);color:var(--teal-d)}
  .text{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px}
  .text:focus{outline:2px solid var(--teal);border-color:transparent}
  .range{width:100%;accent-color:var(--teal-d)}
  .range-val{font-weight:700;margin-left:6px;color:var(--ink)}
  .ftabs{display:flex;gap:6px;margin-bottom:14px}
  .ftab{padding:10px 20px;border-radius:999px;font-weight:700;color:#9db8af}
  .ftab.on{background:var(--teal-soft);color:var(--teal-d)}
  .fcard{position:relative;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:6px 0}
  .frow{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-right:70px;border-bottom:1px solid var(--soft2);cursor:pointer;font-weight:700;font-size:17px}
  .frow:last-child{border-bottom:0;margin-right:0}
  .frow:hover{background:var(--soft)}
  .frow i{font-style:normal;color:#aaa;width:22px;text-align:center}
  .frow .ph{color:#b5b5b5;font-weight:600}
  #fr-date,#fr-pax{margin-right:0}
  .swap{position:absolute;right:18px;top:50px;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#999;font-size:20px}
  .swap:hover{border-color:var(--teal-d);color:var(--teal-d)}
  .fgo{width:100%;margin-top:16px;padding:18px;border-radius:14px;background:var(--teal-d);color:#fff;font-weight:800;font-size:17px}
  .fgo:disabled{background:#bdbdbd;cursor:default}
  .fhint{margin:10px 2px 0;font-size:12px;color:var(--sub)}
  .conts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .cont{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700}
  .cont.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
  .grp{margin:10px 0 4px;font-size:12px;font-weight:800;color:var(--teal-d)}
  .summary{padding-top:6px}
  .summary h3{margin:0 0 10px;font-size:15px}
  .summary dl{margin:0;display:grid;grid-template-columns:52px 1fr;gap:6px 10px;font-size:13px}
  .summary dt{color:var(--sub)}
  .summary dd{margin:0;font-weight:600;word-break:keep-all}
  .save{display:block;width:100%;margin-top:18px;padding:15px;border-radius:14px;background:var(--teal-d);color:#fff;font-weight:700;font-size:16px}
  .save:hover{background:var(--pink2)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1}

  @media (max-width:760px){
    .search{flex-direction:column;border-radius:24px;height:auto}
    .seg{padding:12px 20px;border-radius:24px}
    .go{margin:8px;padding:14px;justify-content:center}
    .panel{position:static;transform:none!important;width:auto!important;margin-top:10px;max-height:none!important}
    .cal-wrap{flex-direction:column;gap:20px}
    .cal:nth-child(3){display:none}
    .plan{grid-template-columns:1fr}
    .aside{position:static}
    .tab{font-size:15px;padding:16px 0}
  }
</style>
</head>
<body>

<!-- ============ 상단 (5/1) : 여행지 · 날짜 · 여행자 ============ -->
<header class="top">
  <div class="top-head"><span class="logo">곤상플랜</span></div>
  <div class="search-wrap" id="searchWrap">
    <div class="search">
      <button class="seg" id="s-dest" type="button">
        <small>여행지</small>
        <span class="dest-row"><input class="dest-input" id="destInput" placeholder="여행지 검색" autocomplete="off"><span class="dest-x" id="destClear" role="button" aria-label="여행지 선택 취소" title="선택 취소" hidden>✕</span></span>
      </button>
      <button class="seg" id="s-date" type="button"><small>날짜</small><span id="dateText">날짜 추가</span></button>
      <button class="seg" id="s-guest" type="button"><small>여행자</small><span id="guestText">게스트 추가</span></button>
      <button class="go" id="goBtn" type="button">🔍 검색</button>
    </div>

    <div class="panel" id="p-dest"><h4>해외 여행지 · 대륙별</h4><div class="conts" id="conts"></div><div id="destList"></div></div>

    <div class="panel" id="p-date">
      <div class="cal-wrap">
        <button class="nav l" id="prevM" type="button">‹</button>
        <div class="cal" id="cal0"></div>
        <div class="cal" id="cal1"></div>
        <button class="nav r" id="nextM" type="button">›</button>
      </div>
      <div class="cal-foot"><span id="rangeHint">체크인 날짜를 선택하세요</span><button class="link" id="clearDate" type="button">날짜 지우기</button></div>
    </div>

    <div class="panel" id="p-guest"></div>
  </div>
</header>

<!-- ============ 하단 (5/4) : 항공 · 숙소 · 관광 · 맛집 ============ -->
<main class="plan">
  <div class="main-col">
  <nav class="tabs" id="tabs">
    <button class="tab on" data-t="air" type="button"><i>✈</i>항공</button>
    <button class="tab" data-t="stay" type="button"><i>🏨</i>숙소</button>
    <button class="tab" data-t="tour" type="button"><i>📍</i>관광</button>
    <button class="tab" data-t="food" type="button"><i>🍽</i>맛집</button>
  </nav>
  <div class="panes">

  <div class="pane on" id="pane-air">
    <div class="ftabs" id="ftabs">
      <button class="ftab on" data-v="왕복" type="button">왕복</button>
      <button class="ftab" data-v="편도" type="button">편도</button>
      <button class="ftab" data-v="다구간" type="button">다구간</button>
    </div>
    <div class="fcard">
      <div class="frow" id="fr-from"><i>➤</i><span id="fFrom">서울 SEL</span></div>
      <div class="frow" id="fr-to"><i>⌖</i><span id="fTo" class="ph">도착 도시</span></div>
      <button class="swap" id="fSwap" type="button" aria-label="출발·도착 바꾸기">⇅</button>
      <div class="frow" id="fr-date"><i>▭</i><span id="fDate" class="ph">날짜</span></div>
      <div class="frow" id="fr-pax"><i>☺</i><span id="fPax">탑승객 1명, 일반석</span></div>
    </div>
    <div class="field" style="margin-top:16px"><label>좌석 등급</label>
      <div class="opts" data-key="airClass" data-mode="single">
        <button class="opt on" type="button">일반석</button><button class="opt" type="button">프리미엄 일반석</button><button class="opt" type="button">비즈니스</button>
      </div></div>
    <button class="fgo" id="fGo" type="button" disabled>항공권 검색</button>
    <p class="fhint">도착 도시·날짜·탑승객은 상단 선택과 연동돼요. 항목을 누르면 상단 선택창이 열립니다.</p>
  </div>

  <div class="pane" id="pane-stay">
    <h3>🏨 숙소 조건</h3>
    <div class="field"><label>숙소 유형 (복수 선택)</label>
      <div class="opts" data-key="stayType" data-mode="multi">
        <button class="opt on" type="button">호텔</button><button class="opt" type="button">리조트</button><button class="opt" type="button">게스트하우스</button><button class="opt" type="button">에어비앤비</button><button class="opt" type="button">료칸·한옥</button>
      </div></div>
    <div class="field"><label>최소 성급</label>
      <div class="opts" data-key="stayStar" data-mode="single">
        <button class="opt on" type="button">상관없음</button><button class="opt" type="button">3성 이상</button><button class="opt" type="button">4성 이상</button><button class="opt" type="button">5성</button>
      </div></div>
    <div class="field"><label>중요한 점 (복수 선택)</label>
      <div class="opts" data-key="stayPref" data-mode="multi">
        <button class="opt" type="button">역세권</button><button class="opt" type="button">조식 포함</button><button class="opt" type="button">수영장</button><button class="opt" type="button">조용한 곳</button>
      </div></div>
  </div>

  <div class="pane" id="pane-tour">
    <h3>📍 관광 조건</h3>
    <div class="field"><label>관심 테마 (복수 선택)</label>
      <div class="opts" data-key="tourTheme" data-mode="multi">
        <button class="opt on" type="button">명소·랜드마크</button><button class="opt" type="button">자연·풍경</button><button class="opt" type="button">역사·문화</button><button class="opt" type="button">쇼핑</button><button class="opt" type="button">테마파크</button><button class="opt" type="button">박물관·미술관</button><button class="opt" type="button">액티비티</button>
      </div></div>
    <div class="field"><label>여행 속도</label>
      <div class="opts" data-key="tourPace" data-mode="single">
        <button class="opt" type="button">여유롭게</button><button class="opt on" type="button">보통</button><button class="opt" type="button">빡빡하게</button>
      </div></div>
    <div class="field"><label>이동 수단 (복수 선택)</label>
      <div class="opts" data-key="tourMove" data-mode="multi">
        <button class="opt on" type="button">대중교통</button><button class="opt" type="button">렌터카</button><button class="opt" type="button">택시</button><button class="opt" type="button">도보 위주</button>
      </div></div>
  </div>

  <div class="pane" id="pane-food">
    <h3>🍽 맛집 조건</h3>
    <div class="field"><label>음식 종류 (복수 선택)</label>
      <div class="opts" data-key="foodKind" data-mode="multi">
        <button class="opt on" type="button">현지 음식</button><button class="opt" type="button">해산물</button><button class="opt" type="button">고기·구이</button><button class="opt" type="button">면·국물</button><button class="opt" type="button">카페·디저트</button><button class="opt" type="button">길거리 음식</button>
      </div></div>
    <div class="field"><label>1인 한 끼 예산</label>
      <div class="opts" data-key="foodBudget" data-mode="single">
        <button class="opt" type="button">1만원 이하</button><button class="opt on" type="button">1~3만원</button><button class="opt" type="button">3~5만원</button><button class="opt" type="button">5만원 이상</button>
      </div></div>
    <div class="field"><label>식사 조건 (복수 선택)</label>
      <div class="opts" data-key="foodPref" data-mode="multi">
        <button class="opt" type="button">웨이팅 적은 곳</button><button class="opt" type="button">예약 가능</button><button class="opt" type="button">한국어 메뉴</button><button class="opt" type="button">채식 가능</button>
      </div></div>
  </div>

  </div>
  </div>

  <aside class="aside">
    <h3>예산</h3>
    <p class="hint">1인 기준, 항목별 예산을 정해 보세요.</p>
    <div class="bud"><label>✈ 항공 <span id="b-air-v"></span></label><input class="range" id="b-air" type="range" min="0" max="300" step="5" value="60"></div>
    <div class="bud"><label>🏨 숙소 (전체) <span id="b-stay-v"></span></label><input class="range" id="b-stay" type="range" min="0" max="300" step="5" value="60"></div>
    <div class="bud"><label>📍 관광 <span id="b-tour-v"></span></label><input class="range" id="b-tour" type="range" min="0" max="100" step="5" value="20"></div>
    <div class="bud"><label>🍽 맛집 <span id="b-food-v"></span></label><input class="range" id="b-food" type="range" min="0" max="100" step="5" value="30"></div>
    <div class="bud-total"><span>총 예산</span><strong id="b-total"></strong></div>
    <section class="summary">
      <h3>선택한 조건</h3>
      <dl id="summary"></dl>
    </section>
    <button class="save" id="saveBtn" type="button">조건 저장하기</button>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const DOW = ['일','월','화','수','목','금','토'];

  /* ---------- 상태 ---------- */
  const state = {
    dest: '',
    start: null, end: null,
    guests: { adult: 0, child: 0, infant: 0, pet: 0 },
    opts: {},
    budget: { air: 0, stay: 0, tour: 0, food: 0 }
  };

  /* ---------- 패널 열고 닫기 ---------- */
  const segs = { dest: $('#s-dest'), date: $('#s-date'), guest: $('#s-guest') };
  const panels = { dest: $('#p-dest'), date: $('#p-date'), guest: $('#p-guest') };
  function open(name) {
    Object.keys(panels).forEach(k => {
      panels[k].classList.toggle('open', k === name);
      segs[k].classList.toggle('on', k === name);
    });
  }
  function closeAll() { open(null); }
  segs.dest.addEventListener('click', () => { open('dest'); $('#destInput').focus(); });
  segs.date.addEventListener('click', () => open('date'));
  segs.guest.addEventListener('click', () => open('guest'));
  document.addEventListener('click', e => { if (!$('#searchWrap').contains(e.target)) closeAll(); });

  /* ---------- 여행지 ---------- */
  // [아이콘, 도시, 설명, 공항코드] — 해외만, 대륙별
  const CONTINENTS = {
    '아시아': [['🗼','도쿄','멋진 건축물과 쇼핑','TYO'], ['🏯','오사카','활기찬 나이트라이프','OSA'], ['🌸','교토','전통과 사찰','UKY'],
      ['🍜','후쿠오카','먹거리와 가까운 거리','FUK'], ['🌴','방콕','야시장과 사원','BKK'], ['🏖','다낭','휴양과 해변','DAD'],
      ['🌆','타이베이','야시장과 온천','TPE'], ['🌃','싱가포르','도시 속 미식 여행','SIN'], ['🏙','홍콩','야경과 딤섬','HKG']],
    '유럽': [['🥐','파리','예술과 미식','PAR'], ['🎡','런던','박물관과 공연','LON'], ['🍝','로마','고대 유적과 파스타','ROM'],
      ['🏰','프라하','동화 같은 구시가지','PRG'], ['🌉','바르셀로나','건축과 해변','BCN']],
    '북미': [['🗽','뉴욕','쇼핑과 뮤지컬','NYC'], ['🌉','샌프란시스코','금문교와 해안 드라이브','SFO'], ['🎬','로스앤젤레스','할리우드와 해변','LAX'],
      ['🍁','밴쿠버','자연과 도시의 조화','YVR']],
    '오세아니아': [['🎭','시드니','오페라하우스와 해변','SYD'], ['🏝','괌','가까운 휴양지','GUM'], ['🏔','퀸스타운','대자연 액티비티','ZQN']],
    '중동·아프리카': [['🏜','두바이','초고층과 사막 투어','DXB'], ['🕌','이스탄불','동서양이 만나는 곳','IST'], ['🦁','케이프타운','자연과 와인','CPT']],
    '중남미': [['💃','칸쿤','카리브해 리조트','CUN'], ['🗿','리마','페루 미식 여행','LIM']]
  };
  let contSel = '전체';
  const ALL = Object.entries(CONTINENTS).flatMap(([c, l]) => l.map(d => ({ c, ic: d[0], n: d[1], t: d[2], code: d[3] })));
  const codeOf = n => (ALL.find(d => d.n === n) || {}).code || '';
  function renderDest(q = '') {
    $('#conts').innerHTML = ['전체', ...Object.keys(CONTINENTS)]
      .map(c => `<button class="cont${c === contSel ? ' on' : ''}" type="button" data-c="${c}">${c}</button>`).join('');
    const list = ALL.filter(d => (contSel === '전체' || d.c === contSel) && d.n.includes(q.trim()));
    let h = '', last = '';
    list.forEach(d => {
      if (d.c !== last) { h += `<div class="grp">${d.c}</div>`; last = d.c; }
      h += `<button class="dest" type="button" data-d="${d.n}"><i>${d.ic}</i><span><b>${d.n} <small style="color:var(--sub);font-weight:600">${d.code}</small></b><em>${d.t}</em></span></button>`;
    });
    $('#destList').innerHTML = h || `<div style="padding:12px;color:var(--sub);font-size:14px">검색 결과가 없습니다. 직접 입력한 "${q}" 로 진행할 수 있어요.</div>`;
  }
  renderDest();
  $('#conts').addEventListener('click', e => {
    const b = e.target.closest('.cont'); if (!b) return;
    e.stopPropagation(); // re-render가 클릭 대상을 DOM에서 지워 패널이 닫히는 것을 방지
    contSel = b.dataset.c; renderDest($('#destInput').value);
  });
  $('#destInput').addEventListener('input', e => {
    state.dest = e.target.value; renderDest(e.target.value); open('dest'); renderAll();
  });
  $('#destList').addEventListener('click', e => {
    const b = e.target.closest('.dest'); if (!b) return;
    // 이미 선택된 도시를 다시 누르면 선택 취소
    if (state.dest === b.dataset.d) { e.stopPropagation(); clearDest(); return; }
    state.dest = b.dataset.d; $('#destInput').value = state.dest; renderAll(); open('date');
  });
  function clearDest() {
    state.dest = ''; $('#destInput').value = ''; contSel = '전체';
    renderDest(); renderAll(); open('dest'); $('#destInput').focus();
  }
  $('#destClear').addEventListener('click', e => { e.stopPropagation(); clearDest(); });

  /* ---------- 달력 ---------- */
  const today = new Date(); today.setHours(0,0,0,0);
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  const sameDay = (a, b) => a && b && a.getTime() === b.getTime();
  function renderMonth(host, base) {
    const y = base.getFullYear(), m = base.getMonth();
    const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
    let h = `<h5>${y}년 ${m + 1}월</h5><div class="grid">` + DOW.map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < first; i++) h += '<div></div>';
    for (let d = 1; d <= last; d++) {
      const dt = new Date(y, m, d);
      const past = dt < today;
      const edge = sameDay(dt, state.start) || sameDay(dt, state.end);
      const inRange = state.start && state.end && dt > state.start && dt < state.end;
      h += `<button type="button" class="day${edge ? ' edge' : ''}${inRange ? ' in' : ''}" data-t="${dt.getTime()}" ${past ? 'disabled' : ''}>${d}</button>`;
    }
    host.innerHTML = h + '</div>';
  }
  function renderCal() {
    renderMonth($('#cal0'), view);
    renderMonth($('#cal1'), new Date(view.getFullYear(), view.getMonth() + 1, 1));
    $('#prevM').disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
    $('#rangeHint').textContent = !state.start ? '체크인 날짜를 선택하세요'
      : !state.end ? '체크아웃 날짜를 선택하세요' : `${nights()}박 ${nights() + 1}일`;
  }
  $('#prevM').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); });
  $('#nextM').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); });
  $('#p-date').addEventListener('click', e => {
    e.stopPropagation(); // 달력을 다시 그리면 클릭 대상이 DOM에서 사라져 바깥 클릭으로 오인되므로 막는다
    const b = e.target.closest('.day'); if (!b || b.disabled) return;
    const t = new Date(+b.dataset.t);
    if (!state.start || (state.start && state.end)) { state.start = t; state.end = null; }
    else if (t < state.start) { state.start = t; }
    else if (sameDay(t, state.start)) { return; }
    else { state.end = t; }
    renderCal(); renderAll();
    if (state.end) open('guest');
  });
  $('#clearDate').addEventListener('click', () => { state.start = state.end = null; renderCal(); renderAll(); });
  const nights = () => state.start && state.end ? Math.round((state.end - state.start) / 864e5) : 0;
  const fmt = d => `${d.getMonth() + 1}월 ${d.getDate()}일`;
  const fmtLong = d => `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;

  /* ---------- 여행자 ---------- */
  const GUEST_ROWS = [
    ['adult','성인','13세 이상'], ['child','어린이','2~12세'], ['infant','유아','2세 미만'], ['pet','반려동물','보조동물을 동반하시나요?']
  ];
  function renderGuest() {
    $('#p-guest').innerHTML = GUEST_ROWS.map(([k, t, s]) => `
      <div class="row"><div><b>${t}</b><em>${s}</em></div>
      <div class="step"><button type="button" data-k="${k}" data-d="-1" ${state.guests[k] <= 0 ? 'disabled' : ''}>−</button>
      <span>${state.guests[k]}</span>
      <button type="button" data-k="${k}" data-d="1" ${state.guests[k] >= 16 ? 'disabled' : ''}>+</button></div></div>`).join('');
  }
  $('#p-guest').addEventListener('click', e => {
    e.stopPropagation();
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const g = state.guests, k = b.dataset.k;
    g[k] = Math.max(0, g[k] + +b.dataset.d);
    if (k !== 'adult' && k !== 'pet' && g[k] > 0 && g.adult === 0) g.adult = 1;
    if (k === 'adult' && g.adult === 0) { g.child = 0; g.infant = 0; }
    renderGuest(); renderAll();
  });
  function guestLabel() {
    const g = state.guests, n = g.adult + g.child;
    const parts = [];
    if (n) parts.push(`게스트 ${n}명`);
    if (g.infant) parts.push(`유아 ${g.infant}명`);
    if (g.pet) parts.push(`반려동물 ${g.pet}마리`);
    return parts.join(', ');
  }

  /* ---------- 하단 조건 ---------- */
  $$('.opts').forEach(box => {
    const key = box.dataset.key, multi = box.dataset.mode === 'multi';
    state.opts[key] = $$('.opt.on', box).map(b => b.textContent);
    box.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b) return;
      if (multi) b.classList.toggle('on');
      else $$('.opt', box).forEach(x => x.classList.toggle('on', x === b));
      state.opts[key] = $$('.opt.on', box).map(x => x.textContent);
      renderAll();
    });
  });
  const BUD = ['air', 'stay', 'tour', 'food'];
  function renderBudget() {
    let sum = 0;
    BUD.forEach(k => {
      const v = +$('#b-' + k).value; state.budget[k] = v; sum += v;
      $('#b-' + k + '-v').textContent = v ? `${v}만원` : '미정';
    });
    $('#b-total').textContent = sum ? `${sum}만원` : '미정';
  }
  BUD.forEach(k => $('#b-' + k).addEventListener('input', () => { renderBudget(); renderSummary(); }));
  $('#tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t) return;
    $$('.tab').forEach(x => x.classList.toggle('on', x === t));
    $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + t.dataset.t));
  });

  /* ---------- 렌더 ---------- */
  function renderSummary() {
    const o = state.opts, j = a => (a && a.length ? a.join(', ') : '상관없음');
    const rows = [
      ['여행지', state.dest || '미정'],
      ['날짜', state.start ? (state.end ? `${fmtLong(state.start)} ~ ${fmtLong(state.end)} (${nights()}박)` : `${fmtLong(state.start)} ~`) : '미정'],
      ['여행자', guestLabel() || '미정'],
      ['항공', `${air.reverse ? '귀국편 기준 · ' : ''}${air.from} · ${air.type} · ${j(o.airClass)}`],
      ['숙소', `${j(o.stayType)} · ${j(o.stayStar)}` + (o.stayPref.length ? ` · ${o.stayPref.join(', ')}` : '')],
      ['관광', `${j(o.tourTheme)} · ${j(o.tourPace)} · ${j(o.tourMove)}`],
      ['맛집', `${j(o.foodKind)} · ${j(o.foodBudget)}` + (o.foodPref.length ? ` · ${o.foodPref.join(', ')}` : '')],
      ['예산', Object.values(state.budget).some(Boolean)
        ? `항공 ${state.budget.air} · 숙소 ${state.budget.stay} · 관광 ${state.budget.tour} · 맛집 ${state.budget.food} (만원)` : '미정']
    ];
    $('#summary').innerHTML = rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
  }
  function renderAll() {
    $('#dateText').textContent = state.start
      ? (state.end ? `${fmt(state.start)} - ${fmt(state.end)}` : `${fmt(state.start)} - 체크아웃 선택`) : '날짜 추가';
    $('#dateText').classList.toggle('filled', !!state.start);
    const gl = guestLabel();
    $('#guestText').textContent = gl || '게스트 추가';
    $('#guestText').classList.toggle('filled', !!gl);
    $('#destClear').hidden = !state.dest;
    renderFlight();
    renderSummary();
  }

  /* ---------- 항공 검색 폼 (상단 선택과 연동) ---------- */
  const air = { type: '왕복', from: '서울 SEL', reverse: false };
  function renderFlight() {
    const code = codeOf(state.dest);
    const to = state.dest ? (code ? `${state.dest} ${code}` : state.dest) : '';
    const fromEl = $('#fFrom'), toEl = $('#fTo');
    const place = air.reverse
      ? [[to, '도착 도시'], [air.from, '']] : [[air.from, ''], [to, '도착 도시']];
    // 위쪽 행 = 출발, 아래 행 = 도착
    fromEl.textContent = place[0][0] || '출발 도시'; fromEl.className = place[0][0] ? '' : 'ph';
    toEl.textContent = place[1][0] || '도착 도시'; toEl.className = place[1][0] ? '' : 'ph';
    const dEl = $('#fDate');
    const d = state.start
      ? (air.type === '편도' || !state.end ? fmt(state.start) : `${fmt(state.start)} - ${fmt(state.end)}`) : '날짜';
    dEl.textContent = d; dEl.className = state.start ? '' : 'ph';
    const pax = state.guests.adult + state.guests.child + state.guests.infant;
    $('#fPax').textContent = `탑승객 ${pax || 1}명, ${(state.opts.airClass || ['일반석'])[0]}`;
    const ok = !!state.dest && !!state.start && (air.type === '편도' || !!state.end) && state.guests.adult > 0;
    $('#fGo').disabled = !ok;
  }
  $('#ftabs').addEventListener('click', e => {
    const b = e.target.closest('.ftab'); if (!b) return;
    air.type = b.dataset.v;
    $$('.ftab').forEach(x => x.classList.toggle('on', x === b));
    renderAll();
  });
  $('#fSwap').addEventListener('click', () => { air.reverse = !air.reverse; renderAll(); });
  const toTop = name => { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => open(name), 50); };
  $('#fr-from').addEventListener('click', () => {
    const list = ['서울 SEL', '부산 PUS', '제주 CJU'];
    air.from = list[(list.indexOf(air.from) + 1) % list.length]; renderAll();
  });
  $('#fr-to').addEventListener('click', e => { e.stopPropagation(); toTop('dest'); });
  $('#fr-date').addEventListener('click', e => { e.stopPropagation(); toTop('date'); });
  $('#fr-pax').addEventListener('click', e => { e.stopPropagation(); toTop('guest'); });
  $('#fGo').addEventListener('click', () => toast(`${$('#fFrom').textContent} → ${$('#fTo').textContent} 항공권 조건이 설정됐어요`));

  /* ---------- 검색 / 저장 ---------- */
  const toast = msg => {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 2200);
  };
  $('#goBtn').addEventListener('click', () => {
    closeAll();
    if (!state.dest) { toast('여행지를 먼저 선택해 주세요'); open('dest'); return; }
    if (!state.start || !state.end) { toast('여행 날짜를 선택해 주세요'); open('date'); return; }
    if (!state.guests.adult) { toast('여행자를 추가해 주세요'); open('guest'); return; }
    document.querySelector('.plan').scrollIntoView({ behavior: 'smooth' });
    toast('상단 조건이 적용됐어요. 하단에서 세부 조건을 설정하세요');
  });
  $('#saveBtn').addEventListener('click', () => {
    const data = { dest: state.dest, start: state.start && state.start.toISOString().slice(0, 10),
      end: state.end && state.end.toISOString().slice(0, 10), guests: state.guests, flight: air, budget: state.budget, options: state.opts };
    try { localStorage.setItem('gonsang-trip-conditions', JSON.stringify(data)); } catch (_) {}
    console.log('trip conditions', data);
    toast('여행 조건을 저장했어요');
  });

  renderCal(); renderGuest(); renderBudget(); renderAll();
})();
</script>
</body>
</html>
